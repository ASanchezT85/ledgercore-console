openapi: 3.1.0
info:
  title: LedgerCore Webhooks API
  version: 1.0.0
  description: |
    Outbound webhook subscriptions. Deliveries are HMAC-SHA256 signed with
    the subscription secret (header `X-LedgerCore-Signature`,
    `t=<unix>,v1=<hex>`) and retried with exponential backoff (5 attempts,
    then `dead`). The payload is the standard event envelope.

    Secret rotation has a 24h grace period: after `POST .../rotate-secret`
    deliveries carry TWO `v1` entries (new secret first, then the previous
    one) until `previous_secret_expires_at`, so receivers can switch at any
    point inside the window without losing events. Verify by accepting the
    header if ANY `v1` entry matches your secret.

    Delivery is at-least-once and unordered. Each delivery has a stable
    `event_id` (header `X-LedgerCore-Event-Id`: dedupe by it) and a
    per-subscription gapless `sequence` (header `X-LedgerCore-Sequence`: order
    by it, a jump means a gap). `GET /v1/webhook-deliveries` with
    `subscription_id` + `after_sequence` returns what a receiver missed, oldest
    first. Balances are always re-readable from the ledger, which stays the
    source of truth. Full client contract: docs/webhooks-client-contract.md.

    Every error uses the platform shape
    `{"error":{"code","message","request_id"}}` with stable snake_case codes
    (see docs/errores-api.md).

    Routes live under `/v1/webhook-subscriptions` and `/v1/webhook-deliveries`
    (the gateway routes those prefixes to this service). The tenant is
    derived from the JWT; in the `live` environment endpoint URLs must be
    HTTPS.
servers:
  - url: http://localhost:8084
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway)
security:
  - signedRequest: []
  - bearerAuth: []
tags:
  - name: Subscriptions
  - name: Deliveries

paths:
  /v1/webhook-subscriptions:
    post:
      operationId: createSubscription
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
            examples:
              posted:
                value:
                  url: https://api.acme.example/hooks/ledgercore
                  event_types: ['ledger.transaction.posted', 'ledger.transaction.reversed']
      responses:
        '201':
          description: Subscription created; the signing secret is returned exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionWithSecret'
              examples:
                posted:
                  value:
                    id: a7b8c9d0-e1f2-7a3b-5c6d-7e8f9a0b1c2d
                    url: https://api.acme.example/hooks/ledgercore
                    event_types: ['ledger.transaction.posted', 'ledger.transaction.reversed']
                    active: true
                    created_at: '2026-07-24T12:00:00Z'
                    secret: lcwh_4f3e2d1c0b9a
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: List subscriptions
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of subscriptions (without secrets), newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhook-subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [Subscriptions]
      summary: Get a subscription
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSubscription
      tags: [Subscriptions]
      summary: Update a subscription
      description: |
        Partial update. There is no delete endpoint: deactivate a
        subscription with `active: false` (it stops receiving events and can
        be re-activated later).
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                event_types:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventType'
                active:
                  type: boolean
            examples:
              pause:
                value:
                  active: false
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/webhook-subscriptions/{id}/rotate-secret:
    post:
      operationId: rotateSubscriptionSecret
      tags: [Subscriptions]
      summary: Rotate the signing secret (24h grace period)
      description: |
        Generates a new secret and returns it exactly once. The previous
        secret keeps VERIFYING until `previous_secret_expires_at` (24 hours):
        during that window every delivery is signed with both secrets (two
        `v1` entries in `X-LedgerCore-Signature`), so the receiver can switch
        whenever it wants inside the window without losing events. After the
        deadline the old secret is purged and never used again.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: New secret plus the instant the previous one stops verifying.
          content:
            application/json:
              schema:
                type: object
                required: [id, secret, previous_secret_expires_at]
                properties:
                  id:
                    type: string
                    format: uuid
                  secret:
                    type: string
                    description: New signing secret; shown exactly once.
                  previous_secret_expires_at:
                    type: string
                    format: date-time
                    description: Until this instant deliveries are signed with the previous secret too.
              examples:
                rotated:
                  value:
                    id: a7b8c9d0-e1f2-7a3b-5c6d-7e8f9a0b1c2d
                    secret: lcwh_0a1b2c3d4e5f
                    previous_secret_expires_at: '2026-07-25T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/webhook-deliveries:
    get:
      operationId: listDeliveries
      tags: [Deliveries]
      summary: List deliveries
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
        - name: after_sequence
          in: query
          description: |
            Replay mode: only deliveries of `subscription_id` with a greater
            `sequence`, OLDEST first (so they can be applied in order), any
            status. Requires `subscription_id`. `cursor` is ignored and
            `next_cursor` is always null: advance `after_sequence` to the last
            sequence received and call again until `data` is empty.
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of deliveries, newest first (oldest first in replay mode).
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delivery'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
              examples:
                page:
                  value:
                    data:
                      - id: b8c9d0e1-f2a3-7b4c-6d7e-8f9a0b1c2d3e
                        subscription_id: a7b8c9d0-e1f2-7a3b-5c6d-7e8f9a0b1c2d
                        event_id: 01890a5d-ac96-774b-bcce-b302099a8057
                        event_type: ledger.transaction.posted
                        payload: { event_id: 01890a5d-ac96-774b-bcce-b302099a8057, type: ledger.transaction.posted }
                        status: delivered
                        sequence: 41
                        attempts: 1
                        next_attempt_at: '2026-07-24T12:05:00Z'
                        last_status_code: 200
                        last_error: null
                        created_at: '2026-07-24T12:05:00Z'
                        delivered_at: '2026-07-24T12:05:01Z'
                    next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhook-deliveries/{id}/retry:
    post:
      operationId: retryDelivery
      tags: [Deliveries]
      summary: Retry a failed or dead delivery
      description: Re-enqueues the delivery as `pending` for immediate retry.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The delivery, re-enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The delivery is not in a retryable state (only failed or dead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  value:
                    error:
                      code: conflict
                      message: delivery is not in a retryable state (only failed or dead)

components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        **Preferred for integrations (ADR-023).** Sign every request with an API
        credential (`api_key` + `api_secret`, created in the console or with
        `POST /v1/tenants/{id}/api-credentials` on identity). Send four headers:

        | Header | Value |
        | --- | --- |
        | `X-Api-Key` | the public `ak_<env>_...` key id |
        | `X-Timestamp` | unix seconds; must be within 300 s of the server clock |
        | `X-Nonce` | 16-64 chars of `[A-Za-z0-9_-]`, unique per request (kept 600 s) |
        | `X-Signature` | `hex(HMAC-SHA256(api_secret, canonical))` |

        ```
        canonical = "LC1-HMAC-SHA256" \n METHOD \n host \n path \n query \n api_key
                    \n timestamp \n nonce \n idempotency_key \n hex(sha256(body))
        ```

        `host` is the lower-cased `Host` header; `path` and `query` are
        re-encoded (RFC 3986 unreserved characters only, query pairs sorted by
        key then value); `idempotency_key` is the `Idempotency-Key` header or
        empty; `body` is the exact bytes sent (sha256 of the empty string for no
        body). The query is part of the signature. Test vectors:
        `contracts/test-vectors/request-signatures.json`.

        The secret never travels. Credentials are sealed to one environment (a
        `sandbox` credential is refused by production: `environment_mismatch`),
        carry closed scopes, expire, and are checked against the database on
        every request (revocation is immediate). If identity cannot be reached,
        the request is refused with 503, never accepted unverified. Errors:
        `signature_missing`, `signature_invalid`, `timestamp_skew`,
        `nonce_reused`, `credential_expired`, `credential_revoked`,
        `environment_mismatch`, `ip_not_allowed` (the credential has an IP
        allow-list in `enforce` mode and the request came from outside it: 403).
        Never retry with the same `X-Nonce`.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        EdDSA JWT issued by the identity service. Claims: `tenant_id` (UUID),
        `env` (`sandbox` | `live`), `scopes` (string array).

  parameters:
    SignatureApiKey:
      name: X-Api-Key
      in: header
      required: false
      description: Public key id of the API credential. Required (with the other three headers) when the request is signed; see the `signedRequest` scheme.
      schema:
        type: string
        pattern: '^ak_(sandbox|live)_[0-9A-Za-z]{20}$'
    SignatureTimestamp:
      name: X-Timestamp
      in: header
      required: false
      description: Unix seconds, within 300 s of the server clock. Signed requests only.
      schema:
        type: string
        pattern: '^[0-9]+$'
    SignatureNonce:
      name: X-Nonce
      in: header
      required: false
      description: One-use nonce, 16-64 chars of `[A-Za-z0-9_-]`. A repeated nonce is `nonce_reused`. Signed requests only.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16,64}$'
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page. A malformed cursor yields
        400 `invalid_cursor`.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
        Query strings are as strict as bodies: a query parameter the endpoint
        does not declare is `validation_failed` and the message names it
        (`unknown query parameter "from" (accepted: ...)`), instead of being ignored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found for this tenant (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, account_inactive,
                account_not_postable, parent_account_has_activity,
                period_closed, approval_required, self_approval, step_up_required,
                request_hash_mismatch, rate_limited,
                service_unavailable, internal,
                signature_missing, signature_invalid, timestamp_skew, nonce_reused,
                credential_expired, credential_revoked, environment_mismatch,
                ip_not_allowed, legacy_credential_retired.
            message:
              type: string
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).

    NextCursor:
      type: [string, 'null']
      description: |
        Opaque cursor for the next page; null when there are no more
        results (the last page never requires an extra empty fetch).

    EventType:
      type: string
      enum:
        - ledger.transaction.posted
        - ledger.transaction.reversed
        - ledger.transaction.discarded
        - ledger.hold.created
        - ledger.hold.captured
        - ledger.hold.released
        - ledger.hold.expired
        - ledger.hold.extended
        - ledger.account.updated
        - recon.discrepancy.detected
        - '*'
      description: Canonical event topics; `*` subscribes to every event type.

    DeliveryStatus:
      type: string
      enum: [pending, delivered, failed, dead]
      description: |
        Lifecycle: pending -> delivered, or pending -> failed (retrying with
        backoff) -> dead after 5 attempts. A manual retry re-enqueues
        failed/dead as pending.

    SubscriptionCreate:
      type: object
      required: [url, event_types]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) URL to a public host. HTTPS is mandatory in the live environment. Credentials in the URL, localhost, internal names and private, loopback, link-local or reserved IP addresses are rejected with `validation_failed`; deliveries also refuse to connect to such addresses and follow redirects only within the same host.
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventType'

    Subscription:
      type: object
      required: [id, url, event_types, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    SubscriptionWithSecret:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: HMAC-SHA256 signing secret. Shown exactly once (on create and rotate).

    Delivery:
      type: object
      required:
        [id, subscription_id, event_id, event_type, payload, status, attempts,
         next_attempt_at, last_status_code, last_error, created_at, delivered_at, sequence]
      properties:
        sequence:
          type: integer
          format: int64
          description: |
            Per-subscription, gapless, monotonic delivery number (1, 2, 3...),
            also sent as `X-LedgerCore-Sequence`. Unchanged by retries.
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EventType'
        payload:
          type: object
          description: The signed event envelope exactly as sent to the endpoint.
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_status_code:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time

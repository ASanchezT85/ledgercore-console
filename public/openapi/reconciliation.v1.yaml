openapi: 3.1.0
info:
  title: LedgerCore Reconciliation API
  version: 1.0.0
  description: |
    Reconciles external statements (bank, PSP, provider) against a local
    mirror of the ledger fed by `ledger.transaction.posted` events. Tenants
    register sources, upload CSV statements, launch matching runs, triage
    discrepancies and read a per-source report. Discrepancies also emit
    `recon.discrepancy.detected` events.

    All routes live under the `/v1/reconciliation` prefix (the gateway routes
    that prefix to this service). The tenant is derived from the JWT, except
    on the signed public callback route, which names it in the path.
servers:
  - url: http://localhost:8083
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway)
security:
  - signedRequest: []
  - bearerAuth: []
tags:
  - name: Sources
  - name: Match rules
    description: Versioned, immutable rules that say how a run pairs statement rows with ledger entries.
  - name: Imports
  - name: Runs
  - name: Reports
  - name: Discrepancies
  - name: Custody
    description: Balances reported by a custodian (bank, PSP) compared with the ledger balance of the account that represents them.
  - name: Settlement
    description: Settlement batches declared by a PSP (gross, fees, net) checked against the ledger captures and the payout on the statement.
  - name: Callbacks
    description: Events a provider pushes (at least once), deduplicated per source by the provider's event id. Transaction events become statement rows.

paths:
  /v1/reconciliation/sources:
    post:
      operationId: createSource
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Sources]
      summary: Register an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
            examples:
              bank:
                value:
                  name: chase-operating
                  kind: bank
      responses:
        '201':
          description: Source registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
              examples:
                bank:
                  value:
                    id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    name: chase-operating
                    kind: bank
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listSources
      tags: [Sources]
      summary: List sources
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of the tenant's sources, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/reconciliation/sources/{id}/match-rules:
    post:
      operationId: createMatchRule
      tags: [Match rules]
      summary: Create a match rule version for a source
      description: |
        Match rules say how a run pairs the source's statement rows with
        ledger entries. Rules are **immutable**: each `POST` creates version
        n+1 for the source (the first is version 1); to change the logic,
        create a new version. A run records the version it used.

        A source without rules runs the **built-in rule** (version 0, never
        stored): 1:1 on the transaction idempotency key, exact amount, any
        account, which is the behavior before rules existed.

        `one_to_many` (one statement row settles several ledger entries) and
        `many_to_one` (several statement rows pay one ledger entry) compare
        sums inside a group, so they require `account_id`: the mirror holds
        every leg of every transaction and a sum over both legs is
        meaningless.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRuleCreate'
            examples:
              settlementBatch:
                summary: 1:N settlement batch grouped by metadata
                value:
                  cardinality: one_to_many
                  group_by: metadata
                  metadata_key: settlement_id
                  account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                  amount_tolerance: '0'
              split:
                summary: N:1 split payment with a 1 cent tolerance
                value:
                  cardinality: many_to_one
                  account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                  amount_tolerance: '1'
      responses:
        '201':
          description: Rule version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRule'
              examples:
                settlementBatch:
                  value:
                    id: 0197f3b4-1c2d-7e3f-8a4b-5c6d7e8f9a0b
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    version: 1
                    cardinality: one_to_many
                    group_by: metadata
                    metadata_key: settlement_id
                    account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                    amount_tolerance: '0'
                    created_at: '2026-10-19T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: listMatchRules
      tags: [Match rules]
      summary: List a source's match rule versions
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: All rule versions of the source, newest version first. Not paginated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchRule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/reconciliation/sources/{id}/custody-balances:
    post:
      operationId: createCustodyBalance
      tags: [Custody]
      summary: Record a custodian's reported balance
      description: |
        Stores the balance a custodian (bank, PSP) reports for a ledger
        account at a cut-off, next to the balance the posting mirror gives
        for the same account and cut-off (ADR-011).

        `ledger` = sum of debits minus sum of credits of every mirrored
        posting on the account, in the asset, with `posted_at <= as_of`
        (computed in SQL, it cannot wrap). It is only as complete as the
        mirror: postings from before reconciliation consumed
        `ledger.transaction.posted`, or history the stream lost, are missing.

        Snapshots are **append-only**: a correction is a new snapshot. When
        `reported` differs from `ledger`, the snapshot opens a `critical`
        `balance_mismatch` discrepancy (`discrepancy_id`); otherwise
        `discrepancy_id` is null. `difference` is `reported - ledger`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyBalanceCreate'
            examples:
              eod:
                value:
                  account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                  asset: USD
                  as_of: '2026-10-18T23:59:59Z'
                  balance: '1250000'
      responses:
        '201':
          description: Snapshot recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyBalance'
              examples:
                mismatch:
                  value:
                    id: 0197f3c5-2d3e-7f4a-9b5c-6d7e8f9a0b1c
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                    asset: USD
                    as_of: '2026-10-18T23:59:59Z'
                    reported: '1250000'
                    ledger: '1249000'
                    difference: '1000'
                    discrepancy_id: 0197f3c5-2d3f-7a5b-8c6d-7e8f9a0b1c2d
                    created_at: '2026-10-19T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: listCustodyBalances
      tags: [Custody]
      summary: List a source's custody balance snapshots
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of the source's snapshots, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyBalance'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/reconciliation/sources/{id}/settlement-batches:
    post:
      operationId: createSettlementBatch
      tags: [Settlement]
      summary: Declare a settlement batch
      description: |
        Declares what a PSP reports for one settlement: `gross` captured,
        `fees` kept, `chargebacks` and `refunds` netted, so
        `net = gross - fees - chargebacks - refunds` is paid out. The batch is an
        expectation that is checked, never consumed (ADR-011).

        **Evaluation** runs when the batch is created and again on every run
        of the source, while the batch is `open`:

        - No statement row with `external_ref` equal to `batch_ref` yet: it
          stays `open` (captures and payouts arrive on their own schedule).
        - The payout row exists, equals `net` in the batch asset, the
          ledger captures add up to `gross` and the linked reversals add up
          to `chargebacks + refunds`: `settled`.
        - Anything else (wrong amount or asset, captures different from
          `gross`, reversals different from `chargebacks + refunds`, the
          payout repeated): `mismatched`, and a `high`
          `settlement_mismatch` discrepancy is opened (`discrepancy_id`).

        `settled` and `mismatched` are final: the batch is never evaluated
        again. **Captures** are the debit legs on `account_id` whose
        transaction metadata `metadata_key` equals `batch_ref`; the ledger's
        own payout booking (a credit on the same account) is not a capture.
        **Chargebacks and refunds** are the credit legs on `account_id` of
        *linked reversals* (`POST /v1/transactions/{id}/reverse`, full or
        partial, which keeps `reverses` to the original deposit) whose
        metadata `metadata_key` equals `batch_ref`: reverse the capture with
        that metadata. The ledger cannot tell a chargeback from a refund, so
        they are checked together against `chargebacks + refunds`; the split
        is the PSP's declaration. Reversals mirrored before recon migration
        `0013` carry no link and never count. The payout row is only
        referenced, so matching still pairs it with the ledger's payout
        posting (the default matcher pairs `external_ref` with the posting's
        idempotency key, so the payout posting must use `batch_ref` as its
        key, or a `group_by=metadata` rule must be used).
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementBatchCreate'
            examples:
              psp:
                value:
                  batch_ref: STL-2026-10-18
                  account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                  asset: USD
                  gross: '100000'
                  fees: '2900'
                  chargebacks: '5000'
                  refunds: '0'
      responses:
        '201':
          description: Batch created and evaluated once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementBatch'
              examples:
                open:
                  value:
                    id: 0197f3d6-3e4f-7a5b-8c6d-7e8f9a0b1c2d
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    batch_ref: STL-2026-10-18
                    account_id: 0197f3a2-5b6c-7d8e-9f01-2a3b4c5d6e7f
                    metadata_key: settlement_id
                    asset: USD
                    gross: '100000'
                    fees: '2900'
                    chargebacks: '5000'
                    refunds: '0'
                    net: '92100'
                    status: open
                    captured: '100000'
                    reversed: '5000'
                    payout_external_id: null
                    discrepancy_id: null
                    evaluated_at: '2026-10-19T12:00:00Z'
                    created_at: '2026-10-19T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The source already has a batch with that `batch_ref` (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listSettlementBatches
      tags: [Settlement]
      summary: List a source's settlement batches
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: status
          in: query
          description: Filter by batch status; omit for all.
          schema:
            $ref: '#/components/schemas/BatchStatus'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of the source's batches, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettlementBatch'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/reconciliation/sources/{id}/callbacks:
    post:
      operationId: receiveCallback
      tags: [Callbacks]
      summary: Deliver a provider callback
      description: |
        Stores one provider event in the source's inbox (ADR-012). Providers
        deliver at least once, so the same event arrives again on timeouts
        and retries; each `event_id` is kept once per source.

        - First delivery: `201` and the stored callback.
        - Redelivery of a known `event_id` with the **same canonical
          payload**: `200` and the stored callback with `duplicates`
          incremented. Nothing is processed twice.
        - Same `event_id` with a **different payload**: `409` (`conflict`).
          Either the provider reused an id or the payload was tampered with;
          the stored event is not changed.

        The canonical payload is `event_type`, `occurred_at` (in UTC) and
        `data` re-encoded with sorted keys and numbers kept verbatim. Key
        order, whitespace and the time zone offset do not matter, so a
        provider retry that only reformats the body is still a duplicate.

        An event with `event_type` = `transaction` becomes a statement row of
        the source (`external_id`, under its own import `callback:<event_id>`)
        and the next run matches it like any CSV row (`status` `processed`).
        Every other type is stored as evidence with no side effect (`status`
        `ignored`). `data` of a `transaction` event needs `external_ref`,
        `amount` (minor units, string) and `asset`, plus an optional
        `direction`; anything else in `data` is kept as sent.

        This route is behind the platform's JWT (`reconciliation:write`), for
        a tenant integration that relays the provider's events. A provider can
        also deliver directly, signed with the source's callback secret, to
        `receivePublicCallback` (ADR-017); both routes share this inbox.
        Stored events cannot be changed except for their duplicate counter.

        Ledger idempotency: book the money with the bank's reference
        (`external_ref`) as `idempotency_key`, never this `event_id`. A provider
        resend with a new id becomes a second statement row, flagged `duplicate`
        by the next run. See docs/aviso-proveedor-a-ledger.md.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackCreate'
            examples:
              transaction:
                summary: A payment the provider reports
                value:
                  event_id: evt_9f3a1c
                  event_type: transaction
                  occurred_at: '2026-10-19T09:30:00Z'
                  data:
                    external_ref: PSP-TX-20261019-0042
                    amount: '12500'
                    asset: USD
                    direction: CREDIT
              payoutStatus:
                summary: An event the inbox only keeps
                value:
                  event_id: evt_9f3a1d
                  event_type: payout.status
                  occurred_at: '2026-10-19T09:31:00Z'
                  data:
                    payout_id: po_771
                    status: paid
      responses:
        '201':
          description: New event stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
              examples:
                transaction:
                  value:
                    id: 0197f3e7-4f5a-7b6c-9d7e-8f9a0b1c2d3e
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    event_id: evt_9f3a1c
                    event_type: transaction
                    occurred_at: '2026-10-19T09:30:00Z'
                    data:
                      amount: '12500'
                      asset: USD
                      direction: CREDIT
                      external_ref: PSP-TX-20261019-0042
                    status: processed
                    external_id: 0197f3e7-4f5b-7c7d-8e8f-9a0b1c2d3e4f
                    duplicates: 0
                    last_duplicate_at: null
                    received_at: '2026-10-19T09:30:02Z'
                payoutStatus:
                  value:
                    id: 0197f3e7-5a6b-7c7d-8e8f-9a0b1c2d3e4f
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    event_id: evt_9f3a1d
                    event_type: payout.status
                    occurred_at: '2026-10-19T09:31:00Z'
                    data:
                      payout_id: po_771
                      status: paid
                    status: ignored
                    external_id: null
                    duplicates: 0
                    last_duplicate_at: null
                    received_at: '2026-10-19T09:31:01Z'
        '200':
          description: |
            Redelivery of a known event with the same canonical payload: the
            stored callback, with `duplicates` incremented. Nothing was reprocessed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
              examples:
                redelivery:
                  value:
                    id: 0197f3e7-4f5a-7b6c-9d7e-8f9a0b1c2d3e
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    event_id: evt_9f3a1c
                    event_type: transaction
                    occurred_at: '2026-10-19T09:30:00Z'
                    data:
                      amount: '12500'
                      asset: USD
                      direction: CREDIT
                      external_ref: PSP-TX-20261019-0042
                    status: processed
                    external_id: 0197f3e7-4f5b-7c7d-8e8f-9a0b1c2d3e4f
                    duplicates: 1
                    last_duplicate_at: '2026-10-19T09:35:10Z'
                    received_at: '2026-10-19T09:30:02Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The source already has that `event_id` with a different payload (`conflict`). The stored event is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCallbacks
      tags: [Callbacks]
      summary: List a source's callbacks
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: status
          in: query
          description: Filter by callback status; omit for all.
          schema:
            $ref: '#/components/schemas/CallbackStatus'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of the source's callbacks, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Callback'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/reconciliation/sources/{id}/callback-secret:
    post:
      operationId: rotateCallbackSecret
      tags: [Callbacks]
      summary: Create or rotate a source's callback signing secret
      description: |
        Generates a new signing secret for the source's public callback route
        (ADR-017) and returns it **once**; it is stored only encrypted
        (AES-256-GCM) and never shown again. Needs `reconciliation:write`.

        - First call: `201`, `previous_expires_at` is `null`.
        - Later calls rotate: `200`. The old secret keeps verifying until
          `previous_expires_at` (24 h), so the provider can switch keys
          without losing events. A second rotation inside the window drops
          the oldest secret at once.

        Each call is written to the audit log without the secret.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: First secret of the source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackSecret'
        '200':
          description: Secret rotated; the previous one verifies until `previous_expires_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackSecret'
              examples:
                rotated:
                  value:
                    source_id: 0197f3e7-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    secret: lccb_EXAMPLE-ONLY-not-a-real-secret-000000000
                    previous_expires_at: '2026-10-20T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token lacks `reconciliation:write` (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The service has no `LEDGERCORE_MASTER_KEY`, so it cannot seal secrets (`service_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reconciliation/public/{tenant_id}/sources/{source_id}/callbacks:
    post:
      operationId: receivePublicCallback
      tags: [Callbacks]
      summary: Deliver a provider callback signed with the source's secret
      description: |
        Provider-facing twin of `receiveCallback` (ADR-017). It takes **no
        JWT**: the source's callback secret (`rotateCallbackSecret`)
        authenticates the request. Send

        - `LedgerCore-Timestamp`: unix seconds, within 300 s of the server
          clock;
        - `LedgerCore-Signature`: `v1=<hex HMAC-SHA256(secret, timestamp + "." + raw_body)>`.
          Several comma-separated `v1=` values are accepted, so during a
          rotation the provider can sign with both secrets.

        The MAC covers the exact bytes sent. Once verified, the body is the
        same canonical callback as `receiveCallback`, with the same answers:
        `201` new, `200` duplicate, `409` same `event_id` with another
        payload, `400` invalid body.

        Every authentication failure (malformed ids, unknown tenant or source,
        no secret, missing or malformed headers, stale timestamp, wrong
        signature) gets the same `401`, so the route reveals nothing about
        which part was wrong.
      security: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: LedgerCore-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
          example: '1792402200'
        - name: LedgerCore-Signature
          in: header
          required: true
          schema: { type: string }
          example: v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackCreate'
      responses:
        '201':
          description: New event stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
        '200':
          description: Redelivery of a known event with the same canonical payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The request could not be authenticated (`unauthorized`). Same body for every reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rejected:
                  value:
                    error:
                      code: unauthorized
                      message: callback signature is missing or invalid
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '409':
          description: The source already has that `event_id` with a different payload (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/reconciliation/imports:
    post:
      operationId: createImport
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Imports]
      summary: Import a CSV statement
      description: |
        Uploads a CSV statement as `multipart/form-data` (max 10 MiB) with
        two fields:
          - `source_id`: UUID of a registered source
          - `file`: the CSV statement

        Required CSV columns (any order, header row required):
        `external_ref`, `amount`, `asset`, `occurred_at` (RFC 3339).
        `amount` is a decimal string (e.g. `100.00`) converted to integer
        minor units with an exponent of 2. The import is processed
        synchronously; the response carries the final status.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source_id, file]
              properties:
                source_id:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
                  description: CSV statement, max 10 MiB.
      responses:
        '201':
          description: Import processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
              examples:
                processed:
                  value:
                    id: c3d4e5f6-a7b8-7c9d-1e2f-3a4b5c6d7e8f
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    filename: statement-2026-07-24.csv
                    status: processed
                    row_count: 1
                    created_at: '2026-07-24T13:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/reconciliation/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Runs]
      summary: Launch a reconciliation run
      description: |
        Runs the matcher for one source over its unmatched statement rows
        against the ledger entries not yet matched. The run executes
        synchronously. It uses the source's match rule `rule_version`, or the
        latest version when omitted (or 0), or the built-in rule when the
        source has none; the run records the version it used.

        `matched_count` and `unmatched_count` count **statement rows**, not
        matches: a 1:N match of one row counts 1, an N:1 match of three rows
        counts 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              additionalProperties: false
              properties:
                source_id:
                  type: string
                  format: uuid
                rule_version:
                  type: integer
                  minimum: 0
                  default: 0
                  description: |
                    Match rule version to run. 0 or omitted means the latest
                    version of the source, or the built-in rule when it has
                    none.
            examples:
              daily:
                value:
                  source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
              pinned:
                value:
                  source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                  rule_version: 2
      responses:
        '201':
          description: Run executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                completed:
                  value:
                    id: e5f6a7b8-c9d0-7e1f-3a4b-5c6d7e8f9a0b
                    source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                    rule_version: 0
                    status: completed
                    matched_count: 118
                    unmatched_count: 2
                    started_at: '2026-07-24T14:00:00Z'
                    finished_at: '2026-07-24T14:00:03Z'
        '400':
          description: Invalid input (`validation_failed`), including a `rule_version` the source does not have.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/reconciliation/runs/{id}:
    get:
      operationId: getRun
      tags: [Runs]
      summary: Get a run
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/reconciliation/reports:
    get:
      operationId: getReports
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Reports]
      summary: Reconciliation report per source
      description: One summary row per source, plus tenant-wide totals.
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [data, totals]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceSummary'
                  totals:
                    type: object
                    required: [matched, unmatched, disputed, open_discrepancies, overdue_discrepancies]
                    properties:
                      matched: { type: integer }
                      unmatched: { type: integer }
                      disputed: { type: integer }
                      open_discrepancies: { type: integer }
                      overdue_discrepancies:
                        type: integer
                        description: Unresolved discrepancies already past their `due_at`.
              examples:
                report:
                  value:
                    data:
                      - source_id: d4e5f6a7-b8c9-7d0e-2f3a-4b5c6d7e8f9a
                        source_name: chase-operating
                        matched: 118
                        unmatched: 2
                        disputed: 0
                        open_discrepancies: 2
                        overdue_discrepancies: 1
                    totals:
                      matched: 118
                      unmatched: 2
                      disputed: 0
                      open_discrepancies: 2
                      overdue_discrepancies: 1
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/reconciliation/discrepancies:
    get:
      operationId: listDiscrepancies
      tags: [Discrepancies]
      summary: List discrepancies
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: status
          in: query
          description: Filter by triage status; omit for all.
          schema:
            $ref: '#/components/schemas/DiscrepancyStatus'
        - name: severity
          in: query
          description: Filter by severity; omit for all.
          schema:
            $ref: '#/components/schemas/Severity'
        - name: owner
          in: query
          description: Filter by assignee handle (exact match); omit for all.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
        - name: overdue
          in: query
          description: |
            `true` keeps only unresolved discrepancies already past their
            `due_at`; `false` or omitted does not filter.
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of discrepancies, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Discrepancy'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/reconciliation/discrepancies/{id}:
    patch:
      operationId: updateDiscrepancy
      tags: [Discrepancies]
      summary: Triage a discrepancy
      description: |
        Partial update: send only the fields to change. All of `status`,
        `severity`, `owner` and `resolution_note` are optional, but at least
        one is required (an empty body is 400 `validation_failed`).

        - Changing `severity` moves `due_at` to `created_at` + the SLA of the
          new severity, so raising the severity of an old discrepancy can make
          it overdue at once.
        - Moving `status` to `resolved` stamps `resolved_at`; moving it back to
          `open` or `investigating` clears it.
        - `owner` is a handle (user id, team slug, `api_key:<id>`), never an
          email or a name: it is copied into the audit log, which holds no PII.
          Send `""` to unassign.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                status:
                  $ref: '#/components/schemas/DiscrepancyStatus'
                severity:
                  $ref: '#/components/schemas/Severity'
                owner:
                  type: string
                  pattern: '^([A-Za-z0-9._:-]{1,128})?$'
                  description: |
                    Assignee handle; `""` unassigns. Never an email or a name.
                resolution_note:
                  type: string
            examples:
              resolve:
                value:
                  status: resolved
                  resolution_note: duplicate wire, refunded by bank
              assign:
                value:
                  owner: team:payments-ops
                  severity: critical
      responses:
        '200':
          description: Updated discrepancy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discrepancy'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        **Preferred for integrations (ADR-023).** Sign every request with an API
        credential (`api_key` + `api_secret`, created in the console or with
        `POST /v1/tenants/{id}/api-credentials` on identity). Send four headers:

        | Header | Value |
        | --- | --- |
        | `X-Api-Key` | the public `ak_<env>_...` key id |
        | `X-Timestamp` | unix seconds; must be within 300 s of the server clock |
        | `X-Nonce` | 16-64 chars of `[A-Za-z0-9_-]`, unique per request (kept 600 s) |
        | `X-Signature` | `hex(HMAC-SHA256(api_secret, canonical))` |

        ```
        canonical = "LC1-HMAC-SHA256" \n METHOD \n host \n path \n query \n api_key
                    \n timestamp \n nonce \n idempotency_key \n hex(sha256(body))
        ```

        `host` is the lower-cased `Host` header; `path` and `query` are
        re-encoded (RFC 3986 unreserved characters only, query pairs sorted by
        key then value); `idempotency_key` is the `Idempotency-Key` header or
        empty; `body` is the exact bytes sent (sha256 of the empty string for no
        body). The query is part of the signature. Test vectors:
        `contracts/test-vectors/request-signatures.json`.

        The secret never travels. Credentials are sealed to one environment (a
        `sandbox` credential is refused by production: `environment_mismatch`),
        carry closed scopes, expire, and are checked against the database on
        every request (revocation is immediate). If identity cannot be reached,
        the request is refused with 503, never accepted unverified. Errors:
        `signature_missing`, `signature_invalid`, `timestamp_skew`,
        `nonce_reused`, `credential_expired`, `credential_revoked`,
        `environment_mismatch`, `ip_not_allowed` (the credential has an IP
        allow-list in `enforce` mode and the request came from outside it: 403).
        Never retry with the same `X-Nonce`.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        EdDSA JWT issued by the identity service. Claims: `tenant_id` (UUID),
        `env` (`sandbox` | `live`), `scopes` (string array).

  responses:
    BadRequest:
      description: |
        Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
        Query strings are as strict as bodies: a query parameter the endpoint
        does not declare is `validation_failed` and the message names it
        (`unknown query parameter "from" (accepted: ...)`), instead of being ignored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: 'kind must be one of bank, psp, provider, manual'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Unauthorized:
      description: Missing or invalid credentials (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found for this tenant (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        A statement row or ledger entry of the run was paired by a concurrent
        run (`conflict`). Nothing was written; retry the run.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    SignatureApiKey:
      name: X-Api-Key
      in: header
      required: false
      description: Public key id of the API credential. Required (with the other three headers) when the request is signed; see the `signedRequest` scheme.
      schema:
        type: string
        pattern: '^ak_(sandbox|live)_[0-9A-Za-z]{20}$'
    SignatureTimestamp:
      name: X-Timestamp
      in: header
      required: false
      description: Unix seconds, within 300 s of the server clock. Signed requests only.
      schema:
        type: string
        pattern: '^[0-9]+$'
    SignatureNonce:
      name: X-Nonce
      in: header
      required: false
      description: One-use nonce, 16-64 chars of `[A-Za-z0-9_-]`. A repeated nonce is `nonce_reused`. Signed requests only.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16,64}$'
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page's next_cursor. A malformed
        cursor yields 400 invalid_cursor.
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, account_inactive,
                account_not_postable, parent_account_has_activity,
                period_closed, approval_required, self_approval,
                request_hash_mismatch, rate_limited,
                service_unavailable, internal,
                signature_missing, signature_invalid, timestamp_skew, nonce_reused,
                credential_expired, credential_revoked, environment_mismatch,
                ip_not_allowed, legacy_credential_retired.
            message:
              type: string
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).

    NextCursor:
      type: [string, 'null']
      description: |
        Opaque cursor for the next page; null when there are no more
        results (the last page never requires an extra empty fetch).

    SourceKind:
      type: string
      enum: [bank, psp, provider, manual]

    SourceCreate:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          $ref: '#/components/schemas/SourceKind'

    Source:
      type: object
      required: [id, name, kind, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SourceKind'
        created_at:
          type: string
          format: date-time

    Import:
      type: object
      required: [id, source_id, filename, status, row_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum: [pending, processed, failed]
        row_count:
          type: integer
        error:
          type: string
          description: Parse/processing error; present only when status is failed.
        created_at:
          type: string
          format: date-time

    Cardinality:
      type: string
      enum: [one_to_one, one_to_many, many_to_one]
      description: |
        `one_to_one`: one statement row, one ledger entry. `one_to_many`: one
        statement row settles several ledger entries (extra rows with the same
        key are `duplicate`). `many_to_one`: several statement rows pay one
        ledger entry.

    MatchRuleCreate:
      type: object
      required: [cardinality]
      additionalProperties: false
      properties:
        cardinality:
          $ref: '#/components/schemas/Cardinality'
        group_by:
          type: string
          enum: [reference, metadata]
          default: reference
          description: |
            What a statement row's `external_ref` is compared with:
            `reference` is the transaction idempotency key, `metadata` is
            the transaction metadata value under `metadata_key` (only on
            postings mirrored since recon migration 0005).
        metadata_key:
          type: string
          minLength: 1
          maxLength: 64
          description: Required if and only if `group_by` is `metadata`.
        account_id:
          type: string
          format: uuid
          description: |
            Only postings on this ledger account are candidates. Required for
            `one_to_many` and `many_to_one`.
        amount_tolerance:
          type: string
          pattern: '^[0-9]{1,19}$'
          default: '0'
          description: |
            Allowed absolute difference between the sum of the statement rows
            and the sum of the ledger entries, in minor units, as a string.

    MatchRule:
      type: object
      required: [id, source_id, version, cardinality, group_by, metadata_key, account_id, amount_tolerance, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Per-source, starts at 1 and grows by one per `POST`.
        cardinality:
          $ref: '#/components/schemas/Cardinality'
        group_by:
          type: string
          enum: [reference, metadata]
        metadata_key:
          type: [string, 'null']
        account_id:
          type: [string, 'null']
          format: uuid
        amount_tolerance:
          type: string
          description: Minor units, string-encoded.
        created_at:
          type: string
          format: date-time

    CustodyBalanceCreate:
      type: object
      required: [account_id, asset, as_of, balance]
      additionalProperties: false
      properties:
        account_id:
          type: string
          format: uuid
          description: Ledger account that represents the custodian's balance.
        asset:
          type: string
          minLength: 1
          maxLength: 12
        as_of:
          type: string
          format: date-time
          description: Cut-off of the reported balance.
        balance:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Balance the custodian reports, in minor units, as a string. May be negative.

    CustodyBalance:
      type: object
      required: [id, source_id, account_id, asset, as_of, reported, ledger, difference, discrepancy_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        asset:
          type: string
        as_of:
          type: string
          format: date-time
        reported:
          type: string
          description: Balance reported by the custodian, minor units.
        ledger:
          type: string
          description: Mirrored debits minus credits on the account up to `as_of`, minor units.
        difference:
          type: string
          description: '`reported - ledger`, minor units; "0" when they agree.'
        discrepancy_id:
          type: [string, 'null']
          format: uuid
          description: The `balance_mismatch` discrepancy; null exactly when `difference` is "0".
        created_at:
          type: string
          format: date-time

    BatchStatus:
      type: string
      enum: [open, settled, mismatched]

    SettlementBatchCreate:
      type: object
      required: [batch_ref, account_id, asset, gross]
      additionalProperties: false
      properties:
        batch_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Settlement id as the PSP reports it. Unique per source. It is the
            `external_ref` of the payout row on the statement and the value
            the captures carry under `metadata_key`.
        account_id:
          type: string
          format: uuid
          description: Clearing account that holds the captures.
        metadata_key:
          type: string
          minLength: 1
          maxLength: 64
          default: settlement_id
          description: Transaction metadata key that tags captures with the batch.
        asset:
          type: string
          minLength: 1
          maxLength: 12
        gross:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Gross captured, minor units, as a string.
        fees:
          type: string
          pattern: '^[0-9]{1,19}$'
          default: '0'
          description: Fees the PSP kept, minor units, as a string.
        chargebacks:
          type: string
          pattern: '^[0-9]{1,19}$'
          default: '0'
          description: Chargebacks the PSP deducted from the payout, minor units, as a string.
        refunds:
          type: string
          pattern: '^[0-9]{1,19}$'
          default: '0'
          description: |
            Refunds the PSP deducted from the payout, minor units, as a
            string. `fees + chargebacks + refunds` must not exceed `gross`.

    SettlementBatch:
      type: object
      required: [id, source_id, batch_ref, account_id, metadata_key, asset, gross, fees, chargebacks, refunds, net, status, captured, reversed, payout_external_id, discrepancy_id, evaluated_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        batch_ref:
          type: string
        account_id:
          type: string
          format: uuid
        metadata_key:
          type: string
        asset:
          type: string
        gross:
          type: string
          description: Minor units.
        fees:
          type: string
          description: Minor units.
        chargebacks:
          type: string
          description: Minor units.
        refunds:
          type: string
          description: Minor units.
        net:
          type: string
          description: '`gross - fees - chargebacks - refunds`, minor units: what the payout must equal.'
        status:
          $ref: '#/components/schemas/BatchStatus'
        captured:
          type: [string, 'null']
          description: Sum of the ledger captures at the last evaluation, minor units; null before the first.
        reversed:
          type: [string, 'null']
          description: Sum of the credit legs of linked reversals tagged with the batch at the last evaluation (the ledger side of `chargebacks + refunds`), minor units; null before the first.
        payout_external_id:
          type: [string, 'null']
          format: uuid
          description: Statement row of the payout, once it appears.
        discrepancy_id:
          type: [string, 'null']
          format: uuid
          description: The `settlement_mismatch` discrepancy; set exactly when `status` is `mismatched`.
        evaluated_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CallbackStatus:
      type: string
      enum: [processed, ignored]
      description: '`processed`: became a statement row. `ignored`: kept as evidence, no side effect.'

    CallbackCreate:
      type: object
      required: [event_id, event_type, occurred_at]
      additionalProperties: false
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 255
          description: The provider's own id for the event; unique per source.
        event_type:
          type: string
          pattern: '^[a-z0-9._-]{1,64}$'
          description: '`transaction` becomes a statement row; any other type is stored as `ignored`.'
        occurred_at:
          type: string
          format: date-time
          description: When the event happened at the provider.
        data:
          type: object
          additionalProperties: true
          description: |
            Event body (defaults to `{}`). For `event_type` = `transaction`:
            `external_ref` (string, 1..255), `amount` (string, minor units,
            `^-?[0-9]{1,19}$`), `asset` (string, at most 12 characters) and
            optionally `direction` (`DEBIT` or `CREDIT`).
          properties:
            external_ref:
              type: string
              minLength: 1
              maxLength: 255
            amount:
              type: string
              pattern: '^-?[0-9]{1,19}$'
            asset:
              type: string
              minLength: 1
              maxLength: 12
            direction:
              type: string
              enum: [DEBIT, CREDIT]

    Callback:
      type: object
      required: [id, source_id, event_id, event_type, occurred_at, data, status, external_id, duplicates, last_duplicate_at, received_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: The event body in canonical form (sorted keys), as stored.
        status:
          $ref: '#/components/schemas/CallbackStatus'
        external_id:
          type: [string, 'null']
          format: uuid
          description: The statement row the event became; null unless `status` is `processed`.
        duplicates:
          type: integer
          minimum: 0
          description: Redeliveries received with the same canonical payload.
        last_duplicate_at:
          type: [string, 'null']
          format: date-time
        received_at:
          type: string
          format: date-time

    CallbackSecret:
      type: object
      required: [source_id, secret, previous_expires_at]
      properties:
        source_id: { type: string, format: uuid }
        secret:
          type: string
          description: '`lccb_` + base64url of 32 random bytes. Shown only in this response.'
        previous_expires_at:
          type: [string, 'null']
          format: date-time
          description: Until when the previous secret still verifies; `null` on the first secret.
    Run:
      type: object
      required: [id, source_id, rule_version, status, matched_count, unmatched_count, started_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        rule_version:
          type: integer
          minimum: 0
          description: Match rule version the run used; 0 is the built-in rule.
        status:
          type: string
          enum: [pending, running, completed, failed]
        matched_count:
          type: integer
          description: Statement rows matched by this run (not the number of matches).
        unmatched_count:
          type: integer
          description: Statement rows left unmatched or disputed by this run.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time

    DiscrepancyStatus:
      type: string
      enum: [open, investigating, resolved]

    Severity:
      type: string
      enum: [low, medium, high, critical]
      description: |
        Triage priority; it sets the SLA, i.e. how long after `created_at` the
        discrepancy may stay unresolved (`due_at`):

        | severity | SLA |
        |---|---|
        | critical | 4 hours |
        | high | 24 hours |
        | medium | 72 hours |
        | low | 7 days |

        The table is fixed for all tenants. The default severity depends on the
        kind: `balance_mismatch` and `provider_backing_break` are `critical`; `amount_mismatch`, `duplicate`
        and `settlement_mismatch` and `movement_transit_residual` are `high`; the others `medium`.

    Discrepancy:
      type: object
      required: [id, source_id, run_id, kind, details, status, severity, owner, due_at, resolved_at, age_seconds, sla_breached, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
          description: Run that found it; null for custody and settlement exceptions raised outside a run.
        kind:
          type: string
          enum: [missing_internal, missing_external, amount_mismatch, duplicate, balance_mismatch, settlement_mismatch, provider_backing_break, movement_transit_residual, movement_stale]
          description: |
            `duplicate` flags statement rows repeating a key that a rule allows only once.
            `balance_mismatch` is a custody snapshot whose reported balance differs from the ledger's.
            `settlement_mismatch` is a settlement batch whose payout or captures do not add up.
            `provider_backing_break` is customer funds that no provider backs, reported by the ledger
            (`ledger.provider_backing.broken`, ADR-020): a ledger-level shortfall, a provider with negative
            customer custody or, under `by_provider`, holders' traced portions at a provider above its customer
            assets (`provider_shortfall`). It belongs to the tenant's system source `ledger:provider-backing`, has no run,
            and `details` carries `ledger_id`, `break_kind`, `provider`, `asset` and `amount`. One unresolved
            exception exists per break.
            `movement_transit_residual` is a staged movement that closed with transit left (ADR-019 section 4,
            `ledger.movement.closed` with a non-empty `transit_residual`). It belongs to the tenant's system source
            `ledger:movements`, has no run, and `details` carries `movement_id`, `ledger_id`, `movement_type`,
            `reference`, `outcome` and `transit_residual` (a list of `{asset, amount}`). It resolves itself when
            the ledger reports `ledger.movement.transit_cleared` (`details.cleared_by` is the clearing
            transaction). One exception exists per movement.
            `movement_stale` is a staged movement still open past its ledger's `stale_movement_after`
            (ADR-019 section 8, `ledger.movement.stale`). Same source, no run, `medium` by default; `details`
            carries `movement_id`, `ledger_id`, `movement_type`, `reference`, `movement_status`, `opened_at`,
            `stale_after_seconds` and `stale_at`. It resolves itself when the movement closes
            (`ledger.movement.closed`). One exception exists per movement.
        details:
          type: object
          description: |
            Free-form context of the mismatch (external ref, amounts, etc.).
            Includes `rule_version`, the match rule version of the run, and,
            when an aggregate group (1:N / N:1) failed to match,
            `group_external_ids`, the ids of all statement rows of the group.
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        owner:
          type: [string, 'null']
          description: Assignee handle; null when unassigned.
        due_at:
          type: string
          format: date-time
          description: SLA deadline, `created_at` + the SLA of `severity`.
        resolved_at:
          type: [string, 'null']
          format: date-time
          description: Set exactly while `status` is `resolved`; null otherwise.
        age_seconds:
          type: integer
          description: |
            Seconds since `created_at`, computed at read time; the clock stops
            at `resolved_at`.
        sla_breached:
          type: boolean
          description: |
            True when the discrepancy is unresolved and past `due_at`, or was
            resolved after it.
        created_at:
          type: string
          format: date-time

    SourceSummary:
      type: object
      required: [source_id, source_name, matched, unmatched, disputed, open_discrepancies, overdue_discrepancies]
      properties:
        source_id:
          type: string
          format: uuid
        source_name:
          type: string
        matched:
          type: integer
        unmatched:
          type: integer
        disputed:
          type: integer
        open_discrepancies:
          type: integer
        overdue_discrepancies:
          type: integer
          description: Unresolved discrepancies already past their `due_at`.

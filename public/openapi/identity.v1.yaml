openapi: 3.1.0
info:
  title: LedgerCore Identity API
  version: 1.0.0
  description: |
    Tenant registry, API key management, console users (email + password,
    roles), token issuance (EdDSA JWT) and the JWKS used by every service to
    validate tokens.

    Tenant and API key management endpoints are bootstrap/admin endpoints
    gated by the `X-Admin-Token` shared secret (LEDGERCORE_ADMIN_TOKEN); when
    no admin token is configured they answer 503 `service_unavailable`. Token
    issuance and the JWKS are public.

    **Console users.** People sign in to the console with email + password
    (`POST /v1/auth/login`), which opens a server-side session carried by an
    `HttpOnly; Secure; SameSite=Lax` cookie (`lc_session`); every
    state-changing session request also needs the `X-CSRF-Token` header. The
    session mints the same 15-minute JWT the services already accept
    (`POST /v1/auth/session/token`). These endpoints are for the console's
    server: a request with an `Origin` header is refused.

    **API credentials (key + secret).** Integrations authenticate with an
    `api_key` (public) and an `api_secret` (shown once, stored encrypted) and
    sign every request with `X-Api-Key`, `X-Timestamp`, `X-Nonce` and
    `X-Signature` (see ADR-023 and `docs/api-design.md`). The signature is
    verified by identity on behalf of the other services; this API only issues,
    rotates and revokes the credentials. The old single-value `lk_` keys keep
    working until **2027-02-01** and answer with `Deprecation` / `Sunset`
    headers.

    Issued tokens are EdDSA (Ed25519) JWTs with these claims:
      - `tenant_id`: tenant UUID
      - `env`: `sandbox` | `live` (the API key's environment; for a console user,
        `sandbox` when the tenant has an expiry and `live` otherwise)
      - `scopes`: string array; a key gets `["ledger:read", "ledger:write", ...]` by default
        (read/write on every service) and may be created with a narrower list,
        or with `ledger:frozen_override` (record movements on frozen accounts;
        never part of the default)
      - standard registered claims (`sub` = `api_key:<id>` or `user:<id>`, `iat`, `exp`; TTL 15 minutes)
servers:
  - url: https://ledgercore-api.sanchezavila.com
    description: Hosted LedgerCore (sandbox and production credentials)
  - url: http://localhost:8082
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway; paths are routed unchanged)
tags:
  - name: Tenants
  - name: ApiKeys
  - name: ApiCredentials
  - name: Auth
  - name: Console
  - name: Onboarding
  - name: BackOffice
  - name: Users

paths:
  /v1/tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Create a tenant
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            examples:
              acme:
                value:
                  name: Acme Payments
                  slug: acme
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                acme:
                  value:
                    id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    name: Acme Payments
                    slug: acme
                    status: active
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A tenant with that slug already exists (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': { $ref: '#/components/responses/AdminDisabled' }
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: List tenants
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page of tenants, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/tenants/{id}:
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Get a tenant
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/api-keys:
    post:
      operationId: createApiKey
      tags: [ApiKeys]
      summary: Create an API key
      description: The plaintext secret is returned exactly once, on creation.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
            examples:
              sandboxKey:
                value:
                  tenant_id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                  environment: sandbox
                  name: ci-sandbox
      responses:
        '201':
          description: API key created; includes the one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
              examples:
                sandboxKey:
                  value:
                    id: b2c3d4e5-f6a7-7b8c-0d1e-2f3a4b5c6d7e
                    tenant_id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    environment: sandbox
                    name: ci-sandbox
                    key_prefix: lk_sandbox_9f8e
                    secret: lk_sandbox_9f8e7d6c5b4a3f2e1d0c
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [ApiKeys]
      summary: Revoke an API key
      description: Revoking an already-revoked key is a no-op (still 204).
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Key revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/api-credentials:
    get:
      operationId: listApiCredentials
      tags: [ApiCredentials]
      summary: List the tenant's API credentials
      description: Owners and admins only. Secrets are never returned after creation.
      security:
        - consoleSession: []
      responses:
        '200':
          description: Credentials of the caller's tenant, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiCredential'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createApiCredential
      tags: [ApiCredentials]
      summary: Create an API credential (key + secret)
      description: |
        Owners and admins only. The `api_secret` is returned **exactly once**,
        in this response (`Cache-Control: no-store`); only its encrypted form
        is stored. `scopes` is required: nothing is granted by default.
        A sandbox tenant can only create `sandbox` credentials. Credentials
        are sealed to their environment: a `sandbox` credential is refused by a
        production deployment (`environment_mismatch`).

        The account's onboarding status gates the environment: `sandbox`
        credentials need a verified account (status `sandbox` or later),
        `live` ones need an `approved` account. Otherwise `403 forbidden` with
        `account_not_verified` / `account_not_approved` in the message. A live
        credential of an account that is no longer approved (suspended) is
        refused at signature verification too.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCredentialCreate'
            examples:
              backend:
                value:
                  environment: live
                  name: payments-backend
                  scopes: [ledger:read, ledger:write]
                  expires_in_days: 180
      responses:
        '201':
          description: Credential created; includes the one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCredentialWithSecret'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/api-credentials/{id}/rotate:
    post:
      operationId: rotateApiCredential
      tags: [ApiCredentials]
      summary: Rotate a credential with an overlap window
      description: |
        Issues a successor (new key and secret; same name, environment and
        scopes) and ends the old credential's term at `now + overlap_seconds`
        (default 24 h, at most 7 days), so both pairs work while clients
        deploy the new one. Rotating never extends the old term. Only an
        active, not yet rotated credential can be rotated. The new
        `api_secret` is shown once. The body is optional.
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCredentialRotate'
      responses:
        '201':
          description: Successor created; includes the one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCredentialWithSecret'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api-credentials/{id}:
    delete:
      operationId: revokeApiCredential
      tags: [ApiCredentials]
      summary: Revoke a credential
      description: |
        Immediate: the next signed request is `credential_revoked`. Revoking
        twice is a no-op (204).
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Credential revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api-credentials/{id}/ip-allowlist:
    put:
      operationId: updateApiCredentialIpAllowlist
      tags: [ApiCredentials]
      summary: Edit a credential's IP allow-list and mode
      description: |
        Replaces `allowed_cidrs` (IPv4 and IPv6, a bare address is a /32 or /128,
        at most 50, `/0` is refused) and/or `ip_mode`. Omit `allowed_cidrs` to keep
        the list; send `[]` to clear it (which also drops `enforce` to `observe`
        unless `ip_mode` says otherwise). `enforce` needs at least one entry.
        Every change is audited as `api_credential.ip_allowlist.update`.

        With `ip_mode: observe` a request from outside the list passes and the
        address is counted; with `enforce` it is refused with `403 ip_not_allowed`.
        An empty list means any address. The address is the TCP peer of the
        service that receives the request, or the client reported through
        `X-Forwarded-For` only when that peer is one of the service's trusted
        proxies (`LEDGERCORE_TRUSTED_PROXIES`).
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCredentialIpAllowlist'
      responses:
        '200':
          description: The credential with its new list and mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCredential'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/api-credentials/{id}/ip-events:
    get:
      operationId: listApiCredentialIpEvents
      tags: [ApiCredentials]
      summary: Addresses seen outside a credential's allow-list
      description: |
        The 50 most recently seen distinct addresses that used the credential from
        outside its list, newest first, each with a hit counter and whether it
        was `observed` (let through) or `rejected` (`ip_not_allowed`).
      security:
        - consoleSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Recent addresses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiCredentialIpEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/security-alerts:
    get:
      operationId: listSecurityAlerts
      tags: [ApiCredentials]
      summary: Security alerts of the tenant
      description: |
        The tenant's 100 most recent alerts, newest first (owners and admins).
        An alert is raised when a credential is used for the first time
        (`credential_first_use`, info), when it is used from an address it never
        used before (`credential_new_ip`, warning), and when one address or one
        credential collects 20 refused requests in 5 minutes (`rejection_burst`,
        high). Every refused signed request is also in the audit log with its
        error code, and the rows are append-only.
      security:
        - consoleSession: []
      responses:
        '200':
          description: Recent alerts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityAlert'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/tenants/{id}/api-credentials:
    post:
      operationId: adminCreateApiCredential
      tags: [ApiCredentials]
      summary: Create an API credential for a tenant (admin)
      description: |
        Bootstrap path for tenants without a console user yet. Same body and
        one-time secret as `POST /v1/api-credentials`.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCredentialCreate'
      responses:
        '201':
          description: Credential created; includes the one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCredentialWithSecret'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/tenants/{id}/api-credentials/{credential_id}:
    delete:
      operationId: adminRevokeApiCredential
      tags: [ApiCredentials]
      summary: Revoke a tenant's credential (admin)
      description: Incident response, revokes immediately. A no-op if already revoked.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Credential revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /v1/auth/token:
    post:
      operationId: issueToken
      tags: [Auth]
      deprecated: true
      summary: Exchange an old API key for a JWT (deprecated)
      description: |
        **Deprecated, retired on 2027-02-01.** Replace it with an API
        credential (key + secret) and sign every request (ADR-023). Until the
        sunset date every response carries `Deprecation: true` and
        `Sunset: Mon, 01 Feb 2027 00:00:00 GMT`; from that date, or earlier
        when the operator sets `LEDGERCORE_LEGACY_API_KEYS=deny`, this endpoint
        answers 401 `legacy_credential_retired`.

        Exchanges the plaintext API key secret (the `lk_...` string returned
        on key creation) for a short-lived EdDSA JWT. Every failure mode —
        unknown key, revoked key, suspended tenant — answers the same 401
        `unauthorized`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              additionalProperties: false
              properties:
                api_key:
                  type: string
                  description: The full plaintext key secret (starts with `lk_`).
            examples:
              exchange:
                value:
                  api_key: lk_sandbox_9f8e7d6c5b4a3f2e1d0c
      responses:
        '200':
          description: Short-lived EdDSA JWT (TTL 15 minutes).
          headers:
            Deprecation:
              schema: { type: string, const: 'true' }
              description: Always present; this exchange is deprecated.
            Sunset:
              schema: { type: string }
              description: HTTP date after which old API keys stop working.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    description: Seconds until expiry.
              examples:
                token:
                  value:
                    access_token: eyJhbGciOiJFZERTQSIsImtpZCI6ImtleS0xIn0...
                    token_type: Bearer
                    expires_in: 900
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Unknown key, wrong secret, revoked key or inactive tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: api key is unknown, revoked, or its tenant is not active
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/auth/login:
    post:
      operationId: login
      tags: [Console]
      summary: Sign in to the console with email and password
      description: |
        Checks the email and password and opens a server-side session. The
        response sets the `lc_session` cookie (`HttpOnly; Secure; SameSite=Lax`)
        and returns the CSRF token the caller must echo in `X-CSRF-Token` on
        every state-changing session request.

        **A lockout runs before the password is checked.** The first 5 wrong
        passwords for an email (20 for an IP address) are free; each one after
        that locks the door for twice as long as the last (30 s, 1 min, 2 min…
        capped at 15 min) and during the wait not even the correct password gets
        in: `429 rate_limited` with `Retry-After`. The counters are keyed by a
        hash of the email, so an unknown email behaves exactly like a real one;
        a wrong password, an unknown email, an invited or disabled account and
        a suspended tenant all answer the same `401`.

        **Two-factor authentication is mandatory.** A correct password opens a
        session in state `password_verified`, which authorizes nothing but the
        `/v1/auth/2fa/*` endpoints. `second_factor` says what to do next:
        `verify` (the user has an authenticator: send a TOTP or recovery code to
        `POST /v1/auth/2fa/verify`) or `enroll` (they have none yet: set it up
        with `POST /v1/auth/2fa/enrollment` and confirm it). The session turns
        `active` only after that. Wrong codes count against the same
        progressive lockout as wrong passwords, and the account counter is
        cleared when the second factor succeeds, not when the password does.

        Console endpoints are called by the console's server, never cross-origin
        from a browser: a request carrying an `Origin` header is refused (`403`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session opened.
          headers:
            Set-Cookie:
              description: '`lc_session=<opaque>; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, state]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  csrf_token:
                    type: string
                  state:
                    type: string
                    enum: [active, password_verified]
                  second_factor:
                    type: string
                    enum: [verify, enroll]
                    description: Present when `state` is `password_verified`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password (`unauthorized`); identical whether or not the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Console]
      summary: End the session
      description: |
        Deletes the session and clears the cookie. Needs `X-CSRF-Token` when
        the cookie maps to a live session; a stale or absent cookie is simply
        cleared.
      security:
        - consoleSession: []
          csrfToken: []
      responses:
        '204':
          description: Signed out.
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/session:
    get:
      operationId: getSession
      tags: [Console]
      summary: The current session
      description: |
        The signed-in user, their tenant, the scopes their role mints and the
        CSRF token. The idle timeout is 30 minutes (slides on use) and the
        absolute lifetime 12 hours.
      security:
        - consoleSession: []
      responses:
        '200':
          description: The active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/session/token:
    post:
      operationId: issueSessionToken
      tags: [Console]
      summary: Mint the 15-minute JWT for the session
      description: |
        Issues the same kind of EdDSA JWT as `POST /v1/auth/token`, for the
        signed-in user: `sub` is `user:<id>`, `tenant_id` the user's tenant,
        `env` is `sandbox` for a tenant with an expiry (public sandbox) and
        `live` otherwise, and `scopes` come from the user's role (see the Role
        table in the Users description). Never `ledger:frozen_override`.
      security:
        - consoleSession: []
          csrfToken: []
      responses:
        '200':
          description: Short-lived JWT.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/2fa:
    get:
      operationId: getTwoFactorStatus
      tags: [Console]
      summary: Second-factor status of the session
      description: |
        Works for a `password_verified` session as well as an active one, so the
        console can pick the right screen after a page reload.
      security:
        - consoleSession: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [state, csrf_token, user, enabled, recovery_codes_remaining]
                properties:
                  state:
                    type: string
                    enum: [active, password_verified]
                  csrf_token:
                    type: string
                    description: The session's CSRF token, for a page that was reloaded and lost the one login returned.
                  user:
                    $ref: '#/components/schemas/User'
                  enabled:
                    type: boolean
                    description: The user has a confirmed authenticator.
                  recovery_codes_remaining:
                    type: integer
                  passkeys:
                    type: integer
                    description: Live passkeys the user has (`GET /v1/auth/passkeys`). The login prompt offers the passkey when it is above zero.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/2fa/enrollment:
    post:
      operationId: startTwoFactorEnrollment
      tags: [Console]
      summary: Start (or resume) setting up the authenticator
      description: |
        Returns the secret and the `otpauth://` URI to render as a QR code
        (Google Authenticator and compatible apps: SHA-1, 6 digits, 30 s).
        **Idempotent:** while the enrolment is pending, every call returns the
        same secret, so a QR code already scanned stays valid. The secret is
        stored encrypted with `LEDGERCORE_MASTER_KEY`. Nothing is enabled until
        `POST /v1/auth/2fa/enrollment/confirm`. `409 conflict` when the user
        already has an authenticator (an owner or admin must reset it first).
      security:
        - consoleSession: []
          csrfToken: []
      responses:
        '200':
          description: "The pending authenticator. `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret:
                    type: string
                    description: Base32, for manual entry.
                  otpauth_uri:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Two-factor authentication is already enabled (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/2fa/enrollment/confirm:
    post:
      operationId: confirmTwoFactorEnrollment
      tags: [Console]
      summary: Confirm the authenticator with a code
      description: |
        Activates the pending authenticator once the app shows a valid code,
        opens the session (it becomes `active`) and returns the ten recovery
        codes. **They are shown only here**: each works once, in any case and
        with or without the dash, and only their hash is stored. A wrong code
        counts against the progressive lockout (`429` with `Retry-After`).
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
      responses:
        '200':
          description: "Enabled. `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [state, recovery_codes]
                properties:
                  state:
                    type: string
                    const: active
                  recovery_codes:
                    type: array
                    items:
                      type: string
                      examples: ['K7P2M-XQ49N']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: No enrolment in progress, or two-factor is already enabled (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      tags: [Console]
      summary: Prove the second factor and open the session
      description: |
        Send exactly one of `code` (the TOTP from the authenticator; the
        previous and next 30-second step are accepted, and a step is never
        accepted twice), `recovery_code` (each works once) or `passkey` (the
        answer to a challenge from `POST /v1/auth/passkeys/assertion`; a
        challenge works once and a failed answer counts against the same
        lockout as a wrong code). On success the
        `password_verified` session becomes `active`. A wrong code is `401` and
        counts against the progressive lockout; during a wait even the right
        code is refused (`429`). `409` when the session is already active or the
        user has no authenticator yet.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  description: Six digits; spaces and dashes are ignored.
                recovery_code:
                  type: string
                passkey:
                  $ref: '#/components/schemas/PasskeyAnswer'
      responses:
        '200':
          description: Session is now active.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    const: active
                  recovery_codes_remaining:
                    type: integer
                    description: Present when a recovery code was used.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The session needs no second factor, or there is no authenticator (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/2fa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Console]
      summary: Replace the recovery codes
      description: |
        Needs an **active** session and a fresh TOTP `code` (a step not used
        before). Invalidates every previous recovery code and returns ten new
        ones, shown only here.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
      responses:
        '200':
          description: "New codes. `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/2fa/step-up:
    post:
      operationId: stepUp
      tags: [Console]
      summary: Prove a fresh TOTP code before a large money write
      description: |
        Step-up (ADR-030).
        Needs an **active** session and either a fresh TOTP `code` (a time step
        not used before) or a `passkey` answer (challenge from
        `POST /v1/auth/passkeys/assertion`); recovery codes are not accepted.
        Same progressive
        lockout as the login factor: while the account or the IP is locked
        the answer is 429, a wrong code counts against both and is audited
        `2fa.failed`. Success is audited `2fa.step_up`.

        Returns a token like `POST /v1/auth/session/token` that also carries
        `step_up_at` (unix seconds) and lives **5 minutes**. ledger-core
        accepts it for writes at or above a ledger's step-up threshold, which
        otherwise answer `403 step_up_required`; the services check the age
        of `step_up_at` themselves, so the elevation never outlives 5 minutes.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of `code` or `passkey`.
              properties:
                code:
                  type: string
                  description: Six-digit TOTP; spaces and dashes are ignored.
                passkey:
                  $ref: '#/components/schemas/PasskeyAnswer'
      responses:
        '200':
          description: "Elevated JWT. `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    const: 300
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: No authenticator is enrolled (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/passkeys:
    get:
      operationId: listPasskeys
      tags: [Console]
      summary: List the user's passkeys
      description: |
        Passkeys (WebAuthn) are a second 2FA method next to TOTP: usable at
        login (`POST /v1/auth/2fa/verify`) and for the step-up
        (`POST /v1/auth/2fa/step-up`). TOTP stays mandatory and is what
        enrols the user; a passkey is added from an active session. Accepts a
        `password_verified` session too. Revoked passkeys are not listed.
      security:
        - consoleSession: []
      responses:
        '200':
          description: The live passkeys, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Passkey'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/passkeys/registration:
    post:
      operationId: beginPasskeyRegistration
      tags: [Console]
      summary: Start adding a passkey
      description: |
        Needs an **active** session and a fresh TOTP `code` (same lockout as
        the other 2FA calls: a wrong code is `401`, audited `2fa.failed`), so a
        stolen session alone cannot plant a second factor. Returns the
        `options` for `navigator.credentials.create` (as
        `PublicKeyCredential.parseCreationOptionsFromJSON` takes them) and a
        single-use `challenge_id` valid 5 minutes. At most 10 passkeys per user
        (`400` beyond that). `Cache-Control: no-store`.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
      responses:
        '200':
          description: Challenge and creation options.
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, options]
                properties:
                  challenge_id:
                    type: string
                    format: uuid
                  options:
                    type: object
                    additionalProperties: true
                    description: WebAuthn `PublicKeyCredentialCreationOptionsJSON`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The session is not active or the user has no authenticator (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/auth/passkeys/registration/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [Console]
      summary: Finish adding a passkey
      description: |
        Verifies the authenticator's attestation against the challenge and the
        configured relying party (`LEDGERCORE_WEBAUTHN_RP_ID` and
        `LEDGERCORE_WEBAUTHN_ORIGINS`; by default the console's host and
        origin) and stores the passkey. Audited `2fa.passkey_added`. `400` when
        the challenge is unknown, expired, already used, or the attestation
        does not verify.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PasskeyAnswer'
                - type: object
                  properties:
                    name:
                      type: string
                      maxLength: 64
                      description: Label shown in the list (default `Passkey`).
      responses:
        '201':
          description: Passkey stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The session is not active (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/passkeys/assertion:
    post:
      operationId: beginPasskeyAssertion
      tags: [Console]
      summary: Get a challenge to sign with a passkey
      description: |
        For the second factor at login (a `password_verified` session) or for a
        step-up (an `active` one). Returns the `options` for
        `navigator.credentials.get` and a single-use `challenge_id` valid 5
        minutes; the answer goes in `passkey` of `POST /v1/auth/2fa/verify` or
        `POST /v1/auth/2fa/step-up`. `409` when the user has no passkey.
        `Cache-Control: no-store`.
      security:
        - consoleSession: []
          csrfToken: []
      responses:
        '200':
          description: Challenge and request options.
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, options]
                properties:
                  challenge_id:
                    type: string
                    format: uuid
                  options:
                    type: object
                    additionalProperties: true
                    description: WebAuthn `PublicKeyCredentialRequestOptionsJSON`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The user has no passkey (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/passkeys/{id}:
    delete:
      operationId: revokePasskey
      tags: [Console]
      summary: Revoke a passkey
      description: |
        Needs an **active** session. The passkey stops verifying at once; TOTP
        and the recovery codes remain, so revoking cannot lock the user out.
        Audited `2fa.passkey_revoked`. Owners and admins also remove every
        passkey of a user with the 2FA reset.
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Passkey revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Console]
      summary: Accept an invitation and set the password
      description: |
        The token comes from the invitation email (valid 7 days, works once).
        The password must be 12–128 characters, not on the common-passwords
        list, not a single repeated character and not the email. It is stored
        as an Argon2id hash (19 MiB, t=2, p=1, 16-byte salt). A used, expired or
        unknown token is `404 not_found`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
      responses:
        '200':
          description: Account activated; sign in with the new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Console]
      summary: Ask for a password-reset email
      description: |
        Always answers `202`, whether or not the address belongs to anyone
        (and the mail is sent in the background, so the response time tells
        nothing either). A user who never accepted their invitation gets a
        fresh invitation instead. The reset link is valid 1 hour and works once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: accepted
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Console]
      summary: Set a new password with a reset token
      description: |
        Consumes the reset token, sets the password (same policy as accepting
        an invitation) and ends every session of that user. A used, expired or
        unknown token is `404 not_found`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
      responses:
        '204':
          description: Password changed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/onboarding/accounts:
    post:
      operationId: registerAccount
      tags: [Onboarding]
      summary: Sign up a company or a person
      description: |
        Public (no session), only when the deployment sets `LEDGERCORE_ONBOARDING=true`.
        Validates the form **on the server**, then creates the tenant, its owner
        (already active, with the given password under the same policy as an
        invitation) and the onboarding record in one transaction, and sends a
        6-digit code to the email. The account starts at `registered`; **no
        credentials of any environment exist until it is verified** (sandbox) and
        approved by the back office (live). There is no KYC: the data is for the
        back office to read, not a verified identity. The owner may sign in right
        away, and must enrol an authenticator like everyone.

        An email that already belongs to a user answers `409 conflict`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSignup'
      responses:
        '201':
          description: Account created; the verification code was emailed.
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, status]
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/AccountStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That email already belongs to a user (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/onboarding/email/verify:
    post:
      operationId: verifyAccountEmail
      tags: [Onboarding]
      summary: Verify the email with the code
      description: |
        Public. A code lives 10 minutes, works once and dies after 5 wrong
        guesses (ask for another with `/v1/onboarding/email/resend`). Every
        failure — unknown address, wrong, expired, used or exhausted code —
        answers the same `400 validation_failed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              additionalProperties: false
              properties:
                email:
                  type: string
                code:
                  type: string
                  description: Six digits.
      responses:
        '204':
          description: Verified; the account advanced as far as its facts allow.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/onboarding/email/resend:
    post:
      operationId: resendAccountEmailCode
      tags: [Onboarding]
      summary: Ask for a new email code
      description: |
        Public. Always answers `202`, whether or not the address belongs to an
        unverified account and whether or not the limit refused: at most one
        code per 60 seconds and 5 per hour per channel. A new code revokes the
        previous one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: accepted
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/onboarding:
    get:
      operationId: getOnboarding
      tags: [Onboarding]
      summary: Where the account stands
      description: |
        The tenant's onboarding record: its status, which of the three
        verifications are done, and the data given at signup (`profile` is
        `null` for tenants that did not sign up through the form). After a
        rejection, `decision_reason` says why.
      security:
        - consoleSession: []
      responses:
        '200':
          description: The onboarding record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/onboarding/phone/send:
    post:
      operationId: sendPhoneCode
      tags: [Onboarding]
      summary: Text a verification code to the phone given at signup
      description: |
        Owners only. Same code rules as the email (10 minutes, 5 attempts) and
        the same limits: one per 60 seconds, 5 per hour (`429` with
        `Retry-After`). Until an SMS provider exists the text is written to the
        service log.
      security:
        - consoleSession: []
          csrfToken: []
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: accepted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /v1/onboarding/phone/verify:
    post:
      operationId: verifyPhone
      tags: [Onboarding]
      summary: Verify the phone with the code
      description: |
        Owners only. When email, authenticator and phone are all verified the
        account becomes `sandbox`: sandbox credentials can be created from then on.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCode'
      responses:
        '204':
          description: Verified.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/onboarding/review:
    post:
      operationId: requestReview
      tags: [Onboarding]
      summary: Ask the back office to approve the account
      description: |
        Owners only. A `sandbox` account (or a `rejected` one, to try again)
        becomes `under_review`; any other status answers `409 conflict`. Only
        an approval by the LedgerCore back office makes live credentials possible.
      security:
        - consoleSession: []
          csrfToken: []
      responses:
        '202':
          description: The account is under review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: under_review
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The account is not in a status that allows a review request (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/backoffice/accounts:
    get:
      operationId: listReviewAccounts
      tags: [BackOffice]
      summary: The review queue
      description: |
        **Platform operators only** (LedgerCore staff; any tenant role, owners
        included, gets `403`). Accounts in the given status, oldest submission
        first. The default, `under_review`, is the queue. The platform tenant is
        never listed.
      security:
        - consoleSession: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, email_verified, mfa_enrolled, sandbox, under_review, approved, rejected, suspended, all]
            default: under_review
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/backoffice/accounts/{id}:
    get:
      operationId: getReviewAccount
      tags: [BackOffice]
      summary: One account, with its history
      description: |
        Platform operators only. The data the operator decides on plus the
        audited history of the account (registration, verifications, every
        status change with its actor and reason). `{id}` is the tenant id; the
        platform tenant answers `404`.
      security:
        - consoleSession: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/backoffice/accounts/{id}/decision:
    post:
      operationId: decideReviewAccount
      tags: [BackOffice]
      summary: Approve, reject, suspend or reinstate an account
      description: |
        Platform operators only. **A reason is required for every decision**
        (at most 1000 characters). Each decision starts from one status:
        `approve` and `reject` from `under_review`, `suspend` from `approved`,
        `reinstate` from `suspended`; anything else is `409 conflict`, so two
        operators deciding at once cannot both win. `approve` makes live
        credentials possible; `suspend` also suspends the tenant (nobody signs
        in, no signature verifies) and `reinstate` lifts it. The decision, its
        reason and the operator are in the audit log (`account.status_changed`).
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [approve, reject, suspend, reinstate]
                reason:
                  type: string
                  maxLength: 1000
                  description: Shown to the account owner after a rejection.
      responses:
        '200':
          description: The account after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account is not in the status the decision starts from (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/backoffice/integrations:
    get:
      operationId: listIntegrations
      tags: [BackOffice]
      summary: Integration credentials and their readiness
      description: |
        **Platform operators only.** One entry per integration (`smtp`, `sms`,
        `ipinfo`) and environment, with the keys its contract asks for, whether
        each one is configured, where it comes from (`database`, or
        `environment` for the `LEDGERCORE_<PROVIDER>_<KEY>` fallback, which
        applies to the environment named by `LEDGERCORE_INTEGRATION_ENV`,
        `live` by default) and who rotated it and when. `ready` is true when
        every required key is configured. **No response of this API ever
        carries a secret value.**
      security:
        - consoleSession: []
      responses:
        '200':
          description: The integrations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Integration'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/backoffice/integrations/{provider}/{environment}/{name}:
    put:
      operationId: setIntegrationSecret
      tags: [BackOffice]
      summary: Store or rotate one integration key
      description: |
        Platform operators only. The value is sealed with the master key
        (AES-256-GCM, bound to provider, environment and name) before it is
        stored, and is not returned. `201` for a first write, `200` for a
        rotation. The audit log records `integration_secret.set` or
        `integration_secret.rotate` with the operator as actor and no value.
        `503` when the service has no `LEDGERCORE_MASTER_KEY`.
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IntegrationProvider'
        - $ref: '#/components/parameters/IntegrationEnvironment'
        - $ref: '#/components/parameters/IntegrationKeyName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              additionalProperties: false
              properties:
                secret:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  writeOnly: true
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSecretRef'
        '201':
          description: Stored for the first time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSecretRef'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The service has no master key (`service_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteIntegrationSecret
      tags: [BackOffice]
      summary: Remove one integration key from the database
      description: |
        Platform operators only. The environment fallback, if any, applies
        again. Audited as `integration_secret.delete`.
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IntegrationProvider'
        - $ref: '#/components/parameters/IntegrationEnvironment'
        - $ref: '#/components/parameters/IntegrationKeyName'
      responses:
        '204':
          description: Removed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/platform/operators:
    post:
      operationId: invitePlatformOperator
      tags: [BackOffice]
      summary: Invite a member of LedgerCore staff
      description: |
        Admin token only (bootstrap). Invites an email as a `platform_operator`
        of the platform tenant: a one-time invitation to set the password, then
        the mandatory authenticator at the first login. A tenant cannot create
        platform operators in any way, and the database refuses the role outside
        the platform tenant.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: That email already belongs to a user (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List the tenant's users
      description: |
        Owners and admins only. Roles map to token scopes like this:

        | Role | Scopes |
        | --- | --- |
        | `owner`, `admin` | `ledger:read`, `ledger:write`, `reconciliation:read`, `reconciliation:write`, `webhooks:read`, `webhooks:write` |
        | `operator` | `ledger:read`, `ledger:write`, `reconciliation:read`, `reconciliation:write`, `webhooks:read` |
        | `viewer` | `ledger:read`, `reconciliation:read` |
        | `auditor` | `ledger:read`, `reconciliation:read`, `webhooks:read` |

        An owner manages everyone; an admin manages operators, viewers and
        auditors but not admins or owners. `ledger:frozen_override` is never
        granted to a user.
      security:
        - consoleSession: []
      responses:
        '200':
          description: Users of the caller's tenant, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/users/invitations:
    post:
      operationId: inviteUser
      tags: [Users]
      summary: Invite someone to the tenant
      description: |
        Creates an `invited` user and emails them a one-time link (valid 7
        days). Inviting an address that is still `invited` in the same tenant
        re-sends the invitation with a new token and the new role. An address
        that already belongs to an active user — in any tenant — is `409
        conflict`. The caller must be allowed to assign the role.
      security:
        - consoleSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              additionalProperties: false
              properties:
                email:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The email already belongs to a user (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users/{id}:
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Change a user's role or status
      description: |
        Send exactly one of `role` or `status` (`active` | `disabled`).
        Disabling ends the user's sessions. The caller must be allowed to
        assign both the user's current role and the new one, cannot disable
        themselves, and a tenant always keeps one active owner (`409 conflict`).
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  $ref: '#/components/schemas/Role'
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: It would leave the tenant without an active owner (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users/{id}/2fa:
    delete:
      operationId: resetUserTwoFactor
      tags: [Users]
      summary: Reset a user's second factor
      description: |
        For a user who lost their phone and their recovery codes. Removes the
        authenticator and recovery codes and ends the user's sessions; at their
        next login they must enrol again. Owners can reset anyone; admins
        operators, viewers and auditors; nobody resets themselves. Audited as
        `2fa.reset` with the caller as actor.
      security:
        - consoleSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Reset.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tenants/{id}/owner-invitations:
    post:
      operationId: inviteTenantOwner
      tags: [Tenants]
      summary: Invite a tenant's first owner
      description: |
        Bootstrap for tenants created through the admin API (the public
        sandbox signup does this by itself): creates an `owner` user and emails
        them the invitation.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The email already belongs to a user (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': { $ref: '#/components/responses/AdminDisabled' }

  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [Auth]
      summary: Public signing keys (JWKS)
      description: 'Served with `Cache-Control: public, max-age=300`.'
      security: []
      responses:
        '200':
          description: RFC 7517 key set with Ed25519 (OKP) keys.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, kid, x]
                      properties:
                        kty:
                          type: string
                          const: OKP
                        crv:
                          type: string
                          const: Ed25519
                        kid:
                          type: string
                        x:
                          type: string
                          description: base64url-encoded 32-byte public key.
              examples:
                jwks:
                  value:
                    keys:
                      - kty: OKP
                        crv: Ed25519
                        kid: key-2026-07
                        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        Bootstrap admin shared secret (LEDGERCORE_ADMIN_TOKEN). A wrong or
        missing value answers 401 `invalid_admin_token`; if the service has
        no admin token configured, admin endpoints answer 503 `service_unavailable`.

    consoleSession:
      type: apiKey
      in: cookie
      name: lc_session
      description: Server-side session cookie set by `POST /v1/auth/login`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The `csrf_token` returned by login / `GET /v1/auth/session`; required on every non-GET session request.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegrationProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [smtp, sms, ipinfo]
    IntegrationEnvironment:
      name: environment
      in: path
      required: true
      schema:
        type: string
        enum: [sandbox, live]
    IntegrationKeyName:
      name: name
      in: path
      required: true
      description: A key of the integration's contract (smtp - host, port, from, username, password; sms - account_sid, auth_token, from_number; ipinfo - token).
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page's next_cursor. A malformed
        cursor yields 400 invalid_cursor.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
        Query strings are as strict as bodies: a query parameter the endpoint
        does not declare is `validation_failed` and the message names it
        (`unknown query parameter "from" (accepted: ...)`), instead of being ignored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Not allowed (`forbidden`): the role does not permit the action, the
        `X-CSRF-Token` header is missing or wrong, or the request carried an
        `Origin` header (console endpoints are not available cross-origin).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: |
        Locked out (`rate_limited`) for the number of seconds in `Retry-After`.
        Identical whether or not the account exists.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminDisabled:
      description: Admin endpoints are disabled because LEDGERCORE_ADMIN_TOKEN is not configured (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, account_inactive,
                account_not_postable, parent_account_has_activity,
                period_closed, approval_required, self_approval, step_up_required,
                request_hash_mismatch, rate_limited,
                service_unavailable, internal, signature_missing,
                signature_invalid, timestamp_skew, nonce_reused,
                credential_expired, credential_revoked,
                environment_mismatch, ip_not_allowed, legacy_credential_retired.
            message:
              type: string
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).
    NextCursor:
      type: [string, 'null']
      description: |
        Opaque cursor for the next page; null when there are no more
        results (the last page never requires an extra empty fetch).

    Environment:
      type: string
      enum: [sandbox, live]

    TenantCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          description: URL-safe unique identifier of the tenant.

    Tenant:
      type: object
      required: [id, name, slug, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, suspended]
        created_at:
          type: string
          format: date-time

    ApiKeyCreate:
      type: object
      required: [tenant_id, environment, name]
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        name:
          type: string
          minLength: 1
          maxLength: 255
        scopes:
          type: array
          description: |
            What tokens minted from the key may do. Omitted or empty = read and
            write on every service. `ledger:post` is the deposit-only key: it
            books money (transactions, movements, holds, posting events and
            groups) and nothing else; `ledger:write` implies it. `ledger:frozen_override` and
            `ledger:reconciliation_source` (6.20: may give an adjustment request
            a reconciliation `origin`) are only granted when listed here.
          items:
            type: string
            enum:
              - ledger:read
              - ledger:write
              - ledger:post
              - ledger:frozen_override
              - ledger:reconciliation_source
              - reconciliation:read
              - reconciliation:write
              - webhooks:read
              - webhooks:write

    ApiKey:
      type: object
      required: [id, tenant_id, environment, name, key_prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        name:
          type: string
        key_prefix:
          type: string
          description: First characters of the secret, for display/lookup.
        created_at:
          type: string
          format: date-time

    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Full plaintext key (`lk_<env>_...`). Shown exactly once; store it securely.

    ApiCredentialCreate:
      type: object
      required: [environment, name, scopes]
      additionalProperties: false
      properties:
        environment:
          $ref: '#/components/schemas/Environment'
        name:
          type: string
          maxLength: 255
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ledger:read, ledger:write, ledger:post, ledger:frozen_override, ledger:reconciliation_source, reconciliation:read, reconciliation:write, webhooks:read, webhooks:write]
          description: Required; no scope is granted by default and the wildcard is never available.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Term of the credential. Default 180.
        allowed_cidrs:
          type: array
          maxItems: 50
          items:
            type: string
          description: Optional IP allow-list (IPv4/IPv6 addresses or CIDRs). Empty or absent means any address.
        ip_mode:
          $ref: '#/components/schemas/IpMode'

    IpMode:
      type: string
      enum: [observe, enforce]
      description: |
        What a request from outside a non-empty `allowed_cidrs` gets. `observe`
        lets it through and counts the address; `enforce` answers `403 ip_not_allowed`.
        Default when omitted: `enforce` for a `live` credential created with a
        list, `observe` otherwise.

    ApiCredentialIpAllowlist:
      type: object
      additionalProperties: false
      properties:
        allowed_cidrs:
          type: array
          maxItems: 50
          items:
            type: string
          description: The new list. Omit to keep the current one; `[]` clears it.
        ip_mode:
          $ref: '#/components/schemas/IpMode'

    ApiCredentialIpEvent:
      type: object
      required: [ip, outcome, hits, first_seen_at, last_seen_at]
      properties:
        ip:
          type: string
          description: The address, or `unknown` when the service could not tell.
        outcome:
          type: string
          enum: [observed, rejected]
        hits:
          type: integer
          format: int64
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    SecurityAlert:
      type: object
      required: [id, occurred_at, kind, severity, credential_id, client_ip, details]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [credential_first_use, credential_new_ip, rejection_burst]
        severity:
          type: string
          enum: [info, warning, high]
        credential_id:
          type: [string, 'null']
          format: uuid
        client_ip:
          type: string
          description: Empty when the address could not be told.
        details:
          type: object
          additionalProperties: true
          description: Kind-specific context (never a secret).

    ApiCredentialRotate:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          description: How long the old credential keeps working. Default 86400 (24 h); 0 means the default.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Term of the successor. Default 180.

    ApiCredential:
      type: object
      required: [id, tenant_id, environment, name, api_key, scopes, allowed_cidrs, ip_mode, status, created_by, created_at, expires_at, revoked_at, rotated_to]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        name:
          type: string
        api_key:
          type: string
          description: Public key id, `ak_<env>_<20 chars>`. Sent in `X-Api-Key`.
        scopes:
          type: array
          items:
            type: string
        allowed_cidrs:
          type: array
          items:
            type: string
          description: IP allow-list, canonical CIDR text (a bare address is `/32` or `/128`). Empty means any address.
        ip_mode:
          $ref: '#/components/schemas/IpMode'
        status:
          type: string
          enum: [active, expired, revoked]
        created_by:
          type: string
          description: '`user:<id>` or `admin`.'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: End of the term; after a rotation, the end of the overlap window.
        revoked_at:
          type: [string, 'null']
          format: date-time
        rotated_to:
          type: [string, 'null']
          format: uuid
          description: The successor, once rotated.

    ApiCredentialWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiCredential'
        - type: object
          required: [api_secret]
          properties:
            api_secret:
              type: string
              description: '`as_<env>_<48 chars>`. Shown exactly once. It never travels in a request; it only computes the signature.'

    Role:
      type: string
      enum: [owner, admin, operator, viewer, auditor, platform_operator]
      description: |
        `platform_operator` is LedgerCore staff (the back office, 7.5): it exists
        only in the platform tenant, holds no scope on any tenant's data and can
        never be assigned by a tenant (`403`).

    User:
      type: object
      required: [id, email, role, status, created_at, last_login_at, two_factor_enabled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Lower-cased; unique across the whole platform.
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [invited, active, disabled]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        two_factor_enabled:
          type: boolean
          description: The user has a confirmed authenticator (TOTP).

    PasskeyAnswer:
      type: object
      required: [challenge_id, credential]
      description: A browser's answer to a passkey challenge.
      properties:
        challenge_id:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
          description: '`PublicKeyCredential.toJSON()`.'

    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time

    TwoFactorCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Six-digit TOTP; spaces and dashes are ignored.

    Session:
      type: object
      required: [user, tenant, environment, account_status, scopes, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          type: object
          required: [id, name, slug]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
        environment:
          $ref: '#/components/schemas/Environment'
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        scopes:
          type: array
          items:
            type: string
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session (12 hours after login).

    AccountStatus:
      type: string
      enum: [registered, email_verified, mfa_enrolled, sandbox, under_review, approved, rejected, suspended]
      description: |
        `registered → email_verified → mfa_enrolled → sandbox → under_review →
        approved | rejected` (a rejected account can ask again), and
        `approved ⇄ suspended`. The first four are driven by facts — email code,
        authenticator, phone code — and may happen in any order. `sandbox`
        credentials exist from `sandbox` on; `live` ones only when `approved`.

    AccountProfile:
      type: object
      required: [kind, legal_name, tax_id, country, region, city, address_line, postal_code, phone]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [company, person]
        legal_name:
          type: string
          description: Company name or the person's full name (2-255 characters).
        registration_number:
          type: string
          description: Companies only; optional.
        tax_id:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 (case-insensitive on input; upper case in responses).
          examples: [CL]
        region:
          type: string
          description: State or province.
        city:
          type: string
        address_line:
          type: string
        postal_code:
          type: string
          description: Checked and normalized for the country (generic rule where there is none).
        website:
          type: string
          description: Optional http(s) address.
        phone:
          type: string
          description: International format; spaces, dashes and parentheses are stripped.
          examples: ['+56912345678']

    AccountSignup:
      type: object
      required: [email, password, profile]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
          description: 12-128 characters, not a common password, not the email.
        profile:
          $ref: '#/components/schemas/AccountProfile'

    Onboarding:
      type: object
      required: [tenant_id, status, steps, profile, submitted_at, decided_at, status_changed_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        steps:
          type: object
          required: [email_verified, two_factor_enrolled, phone_verified]
          properties:
            email_verified:
              type: boolean
            two_factor_enrolled:
              type: boolean
            phone_verified:
              type: boolean
        profile:
          oneOf:
            - $ref: '#/components/schemas/AccountProfile'
            - type: 'null'
        submitted_at:
          type: [string, 'null']
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decision_reason:
          type: string
          description: The back office's reason, after a decision.
        status_changed_at:
          type: string
          format: date-time

    Integration:
      type: object
      required: [provider, environment, ready, keys]
      properties:
        provider: { type: string, enum: [smtp, sms, ipinfo] }
        environment: { type: string, enum: [sandbox, live] }
        ready: { type: boolean, description: Every required key is configured. }
        keys:
          type: array
          items:
            type: object
            required: [name, required, configured]
            properties:
              name: { type: string }
              required: { type: boolean }
              configured: { type: boolean }
              source: { type: string, enum: [database, environment] }
              rotated_at: { type: string, format: date-time }
              rotated_by: { type: string, description: 'Actor, e.g. user:<id>.' }
    IntegrationSecretRef:
      type: object
      required: [provider, environment, name, configured]
      properties:
        provider: { type: string }
        environment: { type: string }
        name: { type: string }
        configured: { type: boolean }
    ReviewAccount:
      allOf:
        - $ref: '#/components/schemas/Onboarding'
        - type: object
          required: [name, slug, owner_email, created_at]
          properties:
            name:
              type: string
              description: The tenant's name (the legal name given at signup).
            slug:
              type: string
            owner_email:
              type: string
            decided_by:
              type: string
              description: The actor of the last decision, `user:<operator id>`.
            created_at:
              type: string
              format: date-time
            history:
              type: array
              description: Only in the single-account response, oldest first.
              items:
                type: object
                required: [occurred_at, action, actor, before, after]
                properties:
                  occurred_at:
                    type: string
                    format: date-time
                  action:
                    type: string
                    examples: [account.status_changed]
                  actor:
                    type: string
                  before:
                    type: [object, 'null']
                  after:
                    type: [object, 'null']

    TokenPassword:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The one-time token from the email link.
        password:
          type: string

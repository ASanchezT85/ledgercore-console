openapi: 3.1.0
info:
  title: LedgerCore Ledger API
  version: 1.0.0
  description: |
    Double-entry ledger API. All monetary amounts are integers in minor units,
    string-encoded to avoid int64 precision loss in JSON, together with an
    asset code. Every transaction must balance debits and credits per asset.

    Multi-tenancy: the tenant is derived from the JWT; resources are always
    scoped to the authenticated tenant.
  contact:
    name: LedgerCore Platform Team
    url: https://github.com/ASanchezT85/ledgercore
servers:
  - url: http://localhost:8081
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway; paths are routed unchanged)
security:
  - bearerAuth: []
tags:
  - name: Ledgers
    description: A ledger is an isolated chart of accounts within a tenant.
  - name: Accounts
    description: Accounts hold balances per asset and receive postings.
  - name: Transactions
    description: Balanced sets of postings. Lifecycle draft -> posted -> reversed; a draft can instead be discarded.
  - name: Holds
    description: Two-phase authorizations that reserve funds before capture.
  - name: Periods
    description: Accounting periods of a ledger. Lifecycle open -> soft_closed -> hard_closed.
  - name: AdjustmentRequests
    description: |
      Maker-checker for adjustments. Lifecycle pending -> approved -> executed,
      or rejected / cancelled. Every adjustment (`adjusts_period_id`) is
      written by executing a request two other actors approved.
  - name: FXQuotes
    description: Immutable rates between two assets that posting groups cite.
  - name: PostingGroups
    description: |
      Several single-asset transactions written atomically, optionally priced
      by an FX quote (currency conversion).
  - name: PostingRules
    description: |
      Versioned, immutable mappings from a canonical event type to the lines of
      one transaction, and the events booked through them.
  - name: LedgerTransfers
    description: |
      A value transfer between two ledgers of one tenant, written as one
      transaction per ledger whose due-to / due-from accounts eliminate.
  - name: Reports
    description: Accounting reports.

paths:
  /v1/ledgers:
    post:
      operationId: createLedger
      tags: [Ledgers]
      summary: Create a ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCreate'
            examples:
              main:
                summary: Main USD ledger
                value:
                  name: main
                  description: Primary operating ledger
                  metadata:
                    region: us
      responses:
        '201':
          description: Ledger created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                main:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    description: Primary operating ledger
                    environment: sandbox
                    metadata:
                      region: us
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/MetadataRejected' }
    get:
      operationId: listLedgers
      tags: [Ledgers]
      summary: List ledgers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of ledgers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ledger'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
              examples:
                page:
                  value:
                    data:
                      - id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: main
                        description: Primary operating ledger
                        environment: sandbox
                        metadata: {}
                        created_at: '2026-07-24T12:00:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ledgers/{id}:
    get:
      operationId: getLedger
      tags: [Ledgers]
      summary: Get a ledger
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                main:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    description: Primary operating ledger
                    environment: sandbox
                    metadata: {}
                    created_at: '2026-07-24T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/metadata-policy:
    put:
      operationId: setLedgerMetadataPolicy
      tags: [Ledgers]
      summary: Set the ledger's metadata allowlist
      description: |
        Replaces the metadata keys the ledger accepts: `transaction_keys` on
        new transactions and holds, `account_keys` on new accounts. A list
        that is `null` or left out removes that allowlist (any key accepted);
        an empty list accepts no key. A key outside the list is rejected with
        422 `metadata_key_not_allowed`. Requires the `ledger:write` scope.

        Every ledger, with or without an allowlist, accepts only scalar
        values and rejects obvious personal data (see `Metadata`). The policy
        governs metadata written from then on; what is already stored is not
        re-judged. The change waits for the writes in flight on the ledger,
        and writes that commit after it are judged by it.

        Each change leaves an `audit_log` row (`ledger.metadata_policy.update`)
        with the previous and the new policy, in the same database
        transaction. Setting the policy the ledger already has is a no-op and
        audits nothing.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataPolicy'
            examples:
              ordersOnly:
                value:
                  transaction_keys: [order_id, channel]
                  account_keys: [customer_id]
              removeAllowlists:
                value: {}
      responses:
        '200':
          description: The ledger with its new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                ordersOnly:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    environment: sandbox
                    metadata: {}
                    metadata_policy:
                      transaction_keys: [channel, order_id]
                      account_keys: [customer_id]
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MetadataRejected' }

  /v1/ledgers/{id}/coverage:
    get:
      operationId: getLedgerCoverage
      tags: [Ledgers, Reports]
      summary: Customer-funds coverage per asset
      description: |
        Whether the funds that back customer money cover what is owed to
        customers, per asset of the ledger:

        - `customer_assets`: posted balance (debits - credits) of the
          ledger's `asset` accounts with `fund_class: customer` — the bank or
          safeguarding accounts that hold customer money.
        - `customer_liabilities`: posted balance (credits - debits) of its
          `liability` accounts with `fund_class: customer` — wallets and
          other balances owed to customers. Only accounts with a positive
          balance add to it: a wallet in the red (`allow_negative`) never
          lowers what is owed to the others.
        - `customer_receivables`: the sum of the negative balances of those
          same accounts, as a positive number — what customers owe the
          platform. `negative_accounts` counts them. They are reported apart
          and never reduce `customer_liabilities` nor count as backing.
        - `covered` is `customer_assets >= customer_liabilities`;
          `shortfall` is what is missing, `"0"` when covered.

        Only posted balances count (drafts and holds do not), read from the
        running `account_balances`. Accounts of other types, and `own`
        accounts, never count. New `liability` accounts default to
        `customer` and every other type to `own`, so until the backing asset
        accounts are marked `customer` the report shows the full liability
        as shortfall. The top-level `covered` is true when every asset is.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: One row per asset with customer-class balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              examples:
                covered:
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    covered: false
                    data:
                      - asset: EUR
                        exponent: 2
                        customer_assets: '50000'
                        customer_liabilities: '42000'
                        customer_receivables: '0'
                        negative_accounts: 0
                        covered: true
                        shortfall: '0'
                      - asset: USD
                        exponent: 2
                        customer_assets: '5000'
                        customer_liabilities: '9700'
                        customer_receivables: '500'
                        negative_accounts: 1
                        covered: false
                        shortfall: '4700'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts:
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            examples:
              customerWallet:
                summary: Customer wallet account
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  name: customer:cust_42:wallet
                  type: liability
                  normal_balance: CREDIT
                  allow_negative: false
                  fund_class: customer
                  metadata:
                    customer_id: cust_42
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                customerWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: active
                    allow_negative: false
                    fund_class: customer
                    postable: true
                    metadata:
                      customer_id: cust_42
                    created_at: '2026-07-24T12:01:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            The name places the account under an existing account that already
            has postings (drafts included) or active holds
            (`parent_account_has_activity`). That account would become a
            non-postable parent and could never move those funds again; post
            to a new leaf instead (e.g. `assets:cash:main` beside
            `assets:cash:usd`, not under an active `assets:cash`). Or the
            metadata is rejected (`metadata_not_scalar`, `metadata_too_large`,
            `metadata_pii_detected`, `metadata_key_not_allowed`; see
            `MetadataRejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parentHasActivity:
                  value:
                    error:
                      code: parent_account_has_activity
                      message: 'domain: parent account already has postings or active holds: assets:cash cannot become a parent of assets:cash:usd'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List accounts
      parameters:
        - name: ledger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AccountType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  next_cursor:
                    type: [string, 'null']
              examples:
                page:
                  value:
                    data:
                      - id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: customer:cust_42:wallet
                        type: liability
                        normal_balance: CREDIT
                        status: active
                        allow_negative: false
                        fund_class: customer
                        postable: true
                        metadata: {}
                        created_at: '2026-07-24T12:01:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                customerWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: active
                    allow_negative: false
                    fund_class: customer
                    postable: true
                    metadata: {}
                    created_at: '2026-07-24T12:01:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      tags: [Accounts]
      summary: Freeze, unfreeze or close an account, or change its overdraft policy or fund class
      description: |
        Changes the account's `status`, `allow_negative` and/or `fund_class`;
        send at least one. Fields left out keep their value. Requires the
        `ledger:write` scope. Every change also leaves an `audit_log` row
        (`account.update`) with the previous and the new values.

        - `active` <-> `frozen` move freely. A frozen account rejects every
          new transaction and hold (422 `account_inactive`); captures and
          releases of holds it already has still work.
        - `closed` is **final**: a closed account cannot be reopened, frozen
          or have its policy changed (409 `conflict`).
        - Only an **empty** account can be closed: zero posted balance, no
          active holds and no draft transactions pending in every asset it
          has touched. Otherwise 409 `conflict` — drain it, release or capture
          its holds and post or discard its drafts first.
        - Lowering `allow_negative` to `false` on an account that is already
          below zero is accepted: it can be refilled but not taken lower.
        - Only a postable account can be changed. A parent (`postable:
          false`) receives no movements, so its status and policy would govern
          nothing: 422 `account_not_postable` — change its children instead.

        The change waits for the transactions and holds already in flight on
        the account and blocks new ones until it commits, so a freeze or close
        never lands between a movement's status check and its commit.

        Every change emits `ledger.account.updated` with the new and the
        previous values. A request that changes nothing returns the account
        as it is and emits nothing, so retries are safe without an
        idempotency key.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
            examples:
              freeze:
                value:
                  status: frozen
              close:
                value:
                  status: closed
              allowOverdraft:
                value:
                  allow_negative: true
              markCustomerFunds:
                summary: The bank account holds customer money (counts in coverage)
                value:
                  fund_class: customer
      responses:
        '200':
          description: The account after the change (or unchanged, if nothing differed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                frozenWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: frozen
                    allow_negative: false
                    fund_class: customer
                    postable: true
                    metadata: {}
                    created_at: '2026-07-24T12:01:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The account is closed (closed is final), or it is not empty and
            cannot be closed (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  value:
                    error:
                      code: conflict
                      message: 'domain: a closed account cannot be changed: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is closed'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                notEmpty:
                  value:
                    error:
                      code: conflict
                      message: 'domain: only an empty account can be closed: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e has a posted balance of 9700 USD'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: The account is a parent (`account_not_postable`); change its children instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parent:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 5d4c3b2a-1f0e-7d6c-8b5a-493827161504 (customer:cust_42) has child accounts; change them instead'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/accounts/{id}/balances:
    get:
      operationId: getAccountBalances
      tags: [Accounts]
      summary: Get account balances per asset
      description: |
        Returns one balance row per asset the account has ever touched.
        `pending` includes draft transactions and uncaptured holds;
        `available` = posted - active holds against the account.

        For a parent account (`postable: false`) the rows are the sum of its
        whole subtree — every account whose name starts with the parent's
        name followed by `:` — computed on read, never stored, and signed by
        the parent's `normal_balance`; `version` is the sum of the members'
        versions and `aggregate` is `true`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Balances per asset.
          content:
            application/json:
              schema:
                type: object
                required: [data, aggregate]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Balance'
                  aggregate:
                    type: boolean
                    description: True when the account is a parent and the rows sum its subtree.
              examples:
                afterDeposit:
                  summary: Customer wallet after the USD 100 deposit (97 credited)
                  value:
                    data:
                      - asset: USD
                        exponent: 2
                        posted: '9700'
                        pending: '0'
                        available: '9700'
                        held: '0'
                        posted_debits: '0'
                        posted_credits: '9700'
                        version: 1
                    aggregate: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts/{id}/entries:
    get:
      operationId: listAccountEntries
      tags: [Accounts]
      summary: List the postings that hit an account
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: asset
          in: query
          schema:
            $ref: '#/components/schemas/AssetCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entry'
                  next_cursor:
                    type: [string, 'null']
              examples:
                page:
                  value:
                    data:
                      - id: 4d3e9f1a-2b3c-7d5e-af61-8a9b0c1d2e3f
                        transaction_id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                        account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount:
                          asset: USD
                          amount: '9700'
                        created_at: '2026-07-24T12:05:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/transactions:
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create a transaction
      description: |
        Creates a balanced transaction. With `status=posted` (default) it is
        atomically validated and posted; with `status=draft` it can be posted
        later via `POST /v1/transactions/{id}/post` or abandoned via
        `POST /v1/transactions/{id}/discard`.

        `idempotency_key` is unique per tenant: retrying with the same key
        returns the original transaction instead of creating a duplicate
        (200 with the `X-Idempotent-Replay: true` response header). The key
        may be sent in the body or via the `Idempotency-Key` request header.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
            examples:
              usdDeposit:
                summary: USD 100 deposit — 97 to the customer, 3 platform fee
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: dep-2026-0001
                  description: Customer USD deposit
                  postings:
                    - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                      direction: DEBIT
                      amount: { asset: USD, amount: '10000' }
                    - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      direction: CREDIT
                      amount: { asset: USD, amount: '9700' }
                    - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                      direction: CREDIT
                      amount: { asset: USD, amount: '300' }
                  metadata:
                    channel: bank_transfer
      responses:
        '201':
          description: Transaction created (and posted unless status=draft was requested).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                usdDeposit:
                  value:
                    id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: dep-2026-0001
                    description: Customer USD deposit
                    status: posted
                    postings:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount: { asset: USD, amount: '9700' }
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        direction: CREDIT
                        amount: { asset: USD, amount: '300' }
                    metadata:
                      channel: bank_transfer
                    reversed_by: null
                    reverses: null
                    effective_at: '2026-07-24T12:05:00Z'
                    created_at: '2026-07-24T12:05:00Z'
                    posted_at: '2026-07-24T12:05:00Z'
        '200':
          description: Idempotent replay — the transaction already existed for this idempotency key.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            The transaction does not balance per asset
            (`unbalanced_transaction`), would leave an account with
            `allow_negative: false` below zero available (`insufficient_funds`,
            checked only when the transaction is posted), touches a frozen
            or closed account (`account_inactive`), posts to a parent
            account — one with child accounts under its path
            (`account_not_postable`), is dated in a closed accounting
            period (`period_closed`; see `adjusts_period_id`), is an
            adjustment sent without an approved adjustment request
            (`approval_required`), or carries rejected metadata
            (`metadata_*`, see `MetadataRejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                metadataPII:
                  value:
                    error:
                      code: metadata_pii_detected
                      message: 'domain: metadata looks like personal data: the value of key "note" looks like an email address'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                unbalanced:
                  value:
                    error:
                      code: unbalanced_transaction
                      message: 'debits (10000 USD) do not equal credits (9700 USD)'
                insufficientFunds:
                  value:
                    error:
                      code: insufficient_funds
                      message: 'domain: available balance would go negative: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e would have available -300 USD'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                accountInactive:
                  value:
                    error:
                      code: account_inactive
                      message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                accountNotPostable:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 3c2d8e4f-1b3c-7d5e-8f61-7a9b1c2d3e4f (assets) has child accounts; post to one of them'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                periodClosed:
                  value:
                    error:
                      code: period_closed
                      message: 'domain: accounting period is closed: period 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d (2026-09) is soft_closed; only adjustments of it may be dated in it'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List transactions
      parameters:
        - name: ledger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of transactions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  next_cursor:
                    type: [string, 'null']
              examples:
                page:
                  value:
                    data: []
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Get a transaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                usdDeposit:
                  value:
                    id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: dep-2026-0001
                    description: Customer USD deposit
                    status: posted
                    postings:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount: { asset: USD, amount: '9700' }
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        direction: CREDIT
                        amount: { asset: USD, amount: '300' }
                    metadata: {}
                    reversed_by: null
                    reverses: null
                    effective_at: '2026-07-24T12:05:00Z'
                    created_at: '2026-07-24T12:05:00Z'
                    posted_at: '2026-07-24T12:05:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/transactions/{id}/post:
    post:
      operationId: postTransaction
      tags: [Transactions]
      summary: Post a draft transaction
      description: |
        Transitions a draft transaction to posted. Idempotent for
        already-posted transactions. A reversed or discarded transaction
        cannot be posted (409 `conflict`). Requires the `ledger:write` scope.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The transaction, now posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                posted:
                  value:
                    id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: dep-2026-0001
                    description: Customer USD deposit
                    status: posted
                    postings: []
                    metadata: {}
                    reversed_by: null
                    reverses: null
                    effective_at: '2026-07-24T12:05:00Z'
                    created_at: '2026-07-24T12:05:00Z'
                    posted_at: '2026-07-24T12:06:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MovementRejected' }
        '409':
          description: The transaction is reversed or discarded and cannot be posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reversed:
                  value:
                    error:
                      code: conflict
                      message: transaction is reversed and cannot be posted
                discarded:
                  value:
                    error:
                      code: conflict
                      message: transaction is discarded and cannot be posted

  /v1/transactions/{id}/discard:
    post:
      operationId: discardTransaction
      tags: [Transactions]
      summary: Discard a draft transaction
      description: |
        Transitions a `draft` to the terminal status `discarded`: its pending
        amounts are released from the accounts' balances, it never receives a
        journal number and never enters the hash chain, and the call leaves an
        `audit_log` row (`transaction.discard`). Emits
        `ledger.transaction.discarded`. The postings stay (they are
        append-only) and are excluded by the status. No request body.

        Allowed even when the draft's `effective_at` falls in a soft- or
        hard-closed accounting period: it is the way out for a draft stuck
        there. Idempotent: discarding an already-discarded transaction returns
        it unchanged. A posted or reversed transaction cannot be discarded
        (409 `conflict`); reverse a posted one instead. Requires the
        `ledger:write` scope.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The transaction, now discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                discarded:
                  value:
                    id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: dep-2026-0001
                    description: Customer USD deposit
                    status: discarded
                    postings: []
                    metadata: {}
                    reversed_by: null
                    reverses: null
                    effective_at: '2026-07-24T12:05:00Z'
                    created_at: '2026-07-24T12:05:00Z'
                    posted_at: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The transaction is posted or reversed and cannot be discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                posted:
                  value:
                    error:
                      code: conflict
                      message: transaction is posted and cannot be discarded
                reversed:
                  value:
                    error:
                      code: conflict
                      message: transaction is reversed and cannot be discarded

  /v1/transactions/{id}/reverse:
    post:
      operationId: reverseTransaction
      tags: [Transactions]
      summary: Reverse a posted transaction
      description: |
        Creates and posts a new compensating transaction with mirrored
        postings, links both, and marks the original as reversed.
        The compensating transaction is announced with
        `ledger.transaction.posted`, followed by `ledger.transaction.reversed`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idempotency_key:
                  type: string
                  maxLength: 255
                reason:
                  type: string
                  maxLength: 1024
            examples:
              chargeback:
                value:
                  idempotency_key: rev-dep-2026-0001
                  reason: chargeback
      responses:
        '201':
          description: The reversal transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                reversal:
                  value:
                    id: 7a6b2c4d-5e6f-7a8b-d2a4-1c2d3e4f5a6b
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: rev-dep-2026-0001
                    description: 'Reversal of dep-2026-0001: chargeback'
                    status: posted
                    postings:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        direction: CREDIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: DEBIT
                        amount: { asset: USD, amount: '9700' }
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        direction: DEBIT
                        amount: { asset: USD, amount: '300' }
                    metadata: {}
                    reversed_by: null
                    reverses: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    effective_at: '2026-07-25T09:00:00Z'
                    created_at: '2026-07-25T09:00:00Z'
                    posted_at: '2026-07-25T09:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MovementRejected' }
        '409':
          description: The transaction is not posted, or is already reversed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyReversed:
                  value:
                    error:
                      code: conflict
                      message: transaction is already reversed

  /v1/periods:
    post:
      operationId: createPeriod
      tags: [Periods]
      summary: Create an accounting period
      description: |
        Appends an `open` period `[starts_at, ends_at)` to a ledger. The
        periods of a ledger are contiguous: the first one may start anywhere,
        each next one must start exactly at the last one's `ends_at` (400
        `validation_failed` otherwise), so they never overlap or leave gaps.
        Dates outside every period are not governed, and a ledger without
        periods behaves as if periods did not exist. Requires `ledger:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCreate'
            examples:
              september:
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  name: '2026-09'
                  starts_at: '2026-09-01T00:00:00Z'
                  ends_at: '2026-10-01T00:00:00Z'
      responses:
        '201':
          description: The period, open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listPeriods
      tags: [Periods]
      summary: List a ledger's accounting periods
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of periods, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Period'
                  next_cursor:
                    type: [string, 'null']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/periods/{id}:
    patch:
      operationId: transitionPeriod
      tags: [Periods]
      summary: Close a period (soft or hard)
      description: |
        Moves the period forward: `open` -> `soft_closed` -> `hard_closed`
        (`soft_closed` may be skipped). Setting the current status again is a
        no-op. Going back, including reopening a hard close, is 409
        `conflict`. Each real transition writes a `period.transition` row to
        the audit log in the same database transaction. Requires
        `ledger:write`.

        - `soft_closed`: only adjustments of this period
          (`adjusts_period_id`) may be dated in it.
        - `hard_closed`: no transaction may be dated in it (422
          `period_closed`); correct it with an adjustment dated in an open
          period.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodUpdate'
            examples:
              hardClose:
                value:
                  status: hard_closed
      responses:
        '200':
          description: The period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The transition would move the period back (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/adjustment-requests:
    post:
      operationId: createAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Propose an adjustment (maker)
      description: |
        Records the complete proposed adjustment — postings, metadata,
        `effective_at`, `adjusts_period_id` — made by the calling identity (the
        maker), in status `pending`. It is judged now as a transaction would
        be (accounts, metadata allowlist, period rules) and again when it is
        executed. The server computes `request_hash` (SHA-256 of its canonical
        form, see docs/maker-checker.md); after that the content never
        changes. Two other identities must approve that hash before the
        request can be executed. Requires `ledger:write`.

        `idempotency_key` is unique per tenant: the same key and content
        replays the request (200 + `X-Idempotent-Replay: true`); the same key
        with other content is 409 `idempotency_conflict`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequestCreate'
            examples:
              softClosedCorrection:
                summary: Book a missed USD 50 fee into the soft-closed September
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: adj-2026-09-0001
                  description: Missed September fee
                  effective_at: '2026-09-30T23:00:00Z'
                  adjusts_period_id: 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d
                  postings:
                    - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      direction: DEBIT
                      amount: { asset: USD, amount: '5000' }
                    - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                      direction: CREDIT
                      amount: { asset: USD, amount: '5000' }
      responses:
        '201':
          description: The request, pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '200':
          description: Idempotent replay — the request already existed for this key and content.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            The proposal would be refused as a transaction: unbalanced,
            inactive or parent account, closed period (`period_closed`) or
            rejected metadata (`metadata_*`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listAdjustmentRequests
      tags: [AdjustmentRequests]
      summary: List a ledger's adjustment requests
      description: Newest first. `status=pending` lists what checkers have to review. Requires `ledger:read`.
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdjustmentStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of adjustment requests.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdjustmentRequest'
                  next_cursor:
                    type: [string, 'null']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/adjustment-requests/{id}:
    get:
      operationId: getAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Get an adjustment request
      description: The request with its approvals. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The adjustment request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/adjustment-requests/{id}/approve:
    post:
      operationId: approveAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Approve an adjustment request (checker)
      description: |
        Records the calling identity's approval of the `request_hash` it
        reviewed. The maker cannot approve (403 `self_approval`), an identity
        approves once (409 `conflict`), and the hash must be the request's
        (409 `request_hash_mismatch`). The second approval moves the request
        to `approved`. Only a `pending` request takes approvals. Audited.
        Requires `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_hash]
              additionalProperties: false
              properties:
                request_hash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: The `request_hash` the approver reviewed, hex-encoded.
      responses:
        '200':
          description: The request, with the new approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The maker cannot approve their own request (`self_approval`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The hash is not the request's (`request_hash_mismatch`), this
            identity already approved, or the request is not pending
            (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/adjustment-requests/{id}/reject:
    post:
      operationId: rejectAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Reject a pending adjustment request
      description: |
        `pending` -> `rejected`, final. Stopping a request moves no money, so
        any identity with `ledger:write` may do it; rejecting a rejected
        request is a no-op. Audited.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The request, rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/adjustment-requests/{id}/cancel:
    post:
      operationId: cancelAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Cancel a pending or approved adjustment request
      description: |
        `pending` or `approved` -> `cancelled`, final (e.g. the period was
        hard-closed after the approvals). Cancelling a cancelled request is a
        no-op. Audited. Requires `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The request, cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/adjustment-requests/{id}/execute:
    post:
      operationId: executeAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Execute an approved adjustment request
      description: |
        Writes the request's transaction, posted and never as a draft
        (ADR-009), through the normal path
        (period rules, metadata allowlist, overdraft, journal hash chain), with
        idempotency key `adjustment-request:<id>`, and links request and
        transaction (`transaction_id`). Exactly once: a repeated or concurrent
        execution returns the same transaction (200 +
        `X-Idempotent-Replay: true`). If the transaction is refused (e.g. the
        period was hard-closed meanwhile) the request stays `approved`.
        Audited. Requires `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: The adjustment transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '200':
          description: Already executed — the transaction written by the first execution.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The request is not approved (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': { $ref: '#/components/responses/MovementRejected' }

  /v1/holds:
    post:
      operationId: createHold
      tags: [Holds]
      summary: Create a hold
      description: |
        Reserves funds on an account (reducing `available` without moving
        money) until captured or released.

        `idempotency_key` is unique per tenant: retrying with the same key
        returns the original hold (200 + `X-Idempotent-Replay: true`).

        At `expires_at` the hold expires (ADR-016): a sweeper in ledger-core
        (every `LEDGERCORE_HOLD_SWEEP_INTERVAL`, default 1m) moves it to
        `expired`, frees the reservation and emits `ledger.hold.expired`.
        Until then the funds stay reserved, but a capture or release past
        `expires_at` is already 409 `hold_expired` (and frees them at once).

        A hold is for short authorizations. A payout already sent to a bank is
        not one: once the hold expires the funds are free to spend and the
        bank's confirmation can no longer be booked. Book it through
        `liabilities:payouts_in_flight:<provider>` instead
        (`docs/payouts-en-vuelo.md`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldCreate'
            examples:
              cardAuth:
                summary: Authorize USD 25.00 on a customer wallet
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                  idempotency_key: auth-2026-0042
                  amount: { asset: USD, amount: '2500' }
                  expires_at: '2026-07-31T00:00:00Z'
                  metadata:
                    card_auth_id: auth_9f3
      responses:
        '201':
          description: Hold created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              examples:
                cardAuth:
                  value:
                    id: 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    idempotency_key: auth-2026-0042
                    amount: { asset: USD, amount: '2500' }
                    status: active
                    transaction_id: null
                    expires_at: '2026-07-31T00:00:00Z'
                    metadata:
                      card_auth_id: auth_9f3
                    created_at: '2026-07-24T13:00:00Z'
        '200':
          description: Idempotent replay — the hold already existed for this idempotency key.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Insufficient available balance to place the hold
            (`insufficient_funds`), the account is frozen or closed
            (`account_inactive`), it is a parent account
            (`account_not_postable`), or the metadata is rejected
            (`metadata_*`, see `MetadataRejected`; holds follow the ledger's
            `transaction_keys`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient:
                  value:
                    error:
                      code: insufficient_funds
                      message: 'available balance 9700 USD is less than hold amount 2500000 USD'
                accountInactive:
                  value:
                    error:
                      code: account_inactive
                      message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                accountNotPostable:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 3c2d8e4f-1b3c-7d5e-8f61-7a9b1c2d3e4f (assets) has child accounts; post to one of them'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/holds/{id}:
    get:
      operationId: getHold
      tags: [Holds]
      summary: Get a hold
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/holds/{id}/capture:
    post:
      operationId: captureHold
      tags: [Holds]
      summary: Capture a hold
      description: |
        Finalizes the hold (fully or partially): the held funds are freed and
        the hold is marked captured, optionally linked to the posted
        transaction that moved the money. A partial capture releases the
        remainder. Capture does not create the transaction itself — post it
        via `POST /v1/transactions` and link it with `transaction_id`.
        A hold past `expires_at` is 409 `hold_expired`, whether or not the
        sweeper has already marked it `expired`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount:
                  $ref: '#/components/schemas/Money'
                  description: Amount to capture; defaults to the full hold amount.
                transaction_id:
                  type: string
                  format: uuid
                  description: Posted transaction to link as the money movement of this capture.
            examples:
              partial:
                summary: Capture USD 20.00 of the USD 25.00 hold
                value:
                  amount: { asset: USD, amount: '2000' }
      responses:
        '200':
          description: Hold captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              examples:
                captured:
                  value:
                    id: 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    idempotency_key: auth-2026-0042
                    amount: { asset: USD, amount: '2500' }
                    status: captured
                    transaction_id: 9c8d4e6f-7a8b-7c9d-f4c6-3e4f5a6b7c8d
                    expires_at: '2026-07-31T00:00:00Z'
                    metadata: {}
                    created_at: '2026-07-24T13:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The hold is not active (`conflict`) or has expired (`hold_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notActive:
                  value:
                    error:
                      code: conflict
                      message: hold is already released
                expired:
                  value:
                    error:
                      code: hold_expired
                      message: 'domain: hold has expired: hold 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c expired at 2026-07-31T00:00:00Z'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/holds/{id}/release:
    post:
      operationId: releaseHold
      tags: [Holds]
      summary: Release a hold
      description: |
        Frees the reserved funds without moving money. A hold past
        `expires_at` is 409 `hold_expired` (its funds are freed by expiry).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Hold released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              examples:
                released:
                  value:
                    id: 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    idempotency_key: auth-2026-0042
                    amount: { asset: USD, amount: '2500' }
                    status: released
                    transaction_id: null
                    expires_at: '2026-07-31T00:00:00Z'
                    metadata: {}
                    created_at: '2026-07-24T13:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The hold is not active (`conflict`) or has expired (`hold_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notActive:
                  value:
                    error:
                      code: conflict
                      message: hold is already captured
                expired:
                  value:
                    error:
                      code: hold_expired
                      message: 'domain: hold has expired: hold 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c expired at 2026-07-31T00:00:00Z'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/fx-quotes:
    post:
      operationId: createFXQuote
      tags: [FXQuotes]
      summary: Create an FX quote
      description: |
        Records an immutable rate between two assets: 1 unit of `base_asset`
        is `rate` units of `quote_asset`, both in major units. A quote is a
        rate, not an execution: it may back any number of posting groups
        until `expires_at`, and it can never be changed or deleted. Not
        idempotent: every call creates a new quote. Requires `ledger:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFXQuoteRequest'
            examples:
              usdEur:
                summary: USD to EUR, valid for five minutes
                value:
                  base_asset: USD
                  quote_asset: EUR
                  rate: '0.9213'
                  source: desk
                  expires_at: '2026-10-19T12:05:00Z'
      responses:
        '201':
          description: Quote created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXQuote'
              examples:
                usdEur:
                  value:
                    id: 4d3e9f50-2c4d-7e6f-9072-8b0c2d3e4f5a
                    base_asset: USD
                    quote_asset: EUR
                    rate: '0.9213'
                    source: desk
                    quoted_at: '2026-10-19T12:00:00Z'
                    expires_at: '2026-10-19T12:05:00Z'
                    created_at: '2026-10-19T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/fx-quotes/{id}:
    get:
      operationId: getFXQuote
      tags: [FXQuotes]
      summary: Get an FX quote
      description: Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXQuote'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/posting-groups:
    post:
      operationId: createPostingGroup
      tags: [PostingGroups]
      summary: Create a posting group
      description: |
        Writes two or more posted, single-asset transactions atomically: all
        members commit or none does. Each member goes through the normal
        posting path (balance per asset, periods, metadata allowlist,
        overdraft, account status, hash chain) and carries `posting_group_id`.
        A member that mixes assets is 400 `validation_failed`. Requires
        `ledger:write`.

        With `fx`, the group cites an FX quote and a conversion account.
        Across the members, that account's net movement in the base asset and
        in the quote asset must be non-zero, of opposite sign, and the quote
        amount must equal the base amount times the rate within one minor unit
        (422 `fx_rate_mismatch`). The quote must not be expired
        (422 `fx_quote_expired`). An invalid quote, rate or group is 400
        `validation_failed`.

        `idempotency_key` covers the whole group: the same key and payload
        replays it (200 + `X-Idempotent-Replay: true`); the same key with
        another payload is 409 `idempotency_conflict`. The key may be sent in
        the body or via the `Idempotency-Key` request header. Members get the
        derived keys `<key>/1`, `<key>/2`, ….
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostingGroupRequest'
            examples:
              usdToEur:
                summary: Convert USD 100.00 to EUR 92.13 through a conversion account
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: fx-2026-0007
                  reference: conv-0007
                  fx:
                    quote_id: 4d3e9f50-2c4d-7e6f-9072-8b0c2d3e4f5a
                    account_id: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                  transactions:
                    - reference: conv-0007-usd
                      postings:
                        - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                          direction: DEBIT
                          amount: { asset: USD, amount: '10000' }
                        - account_id: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                          direction: CREDIT
                          amount: { asset: USD, amount: '10000' }
                    - reference: conv-0007-eur
                      postings:
                        - account_id: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                          direction: DEBIT
                          amount: { asset: EUR, amount: '9213' }
                        - account_id: 6f5a1b72-4e6f-7081-b294-0d2e4f5a6b7c
                          direction: CREDIT
                          amount: { asset: EUR, amount: '9213' }
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroup'
        '200':
          description: Idempotent replay — the group already existed for this idempotency key and payload.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroup'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The idempotency key was already used with another payload (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key already used with a different payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            A member is refused as a transaction would be: unbalanced
            (`unbalanced_transaction`), insufficient funds
            (`insufficient_funds`), frozen or closed account
            (`account_inactive`), parent account (`account_not_postable`),
            closed period (`period_closed`) or rejected metadata
            (`metadata_*`); or the group breaks its FX rules: the quote has
            expired (`fx_quote_expired`) or the conversion legs do not match
            the quote's rate (`fx_rate_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                quoteExpired:
                  value:
                    error:
                      code: fx_quote_expired
                      message: 'domain: fx quote has expired'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                rateMismatch:
                  value:
                    error:
                      code: fx_rate_mismatch
                      message: 'domain: conversion legs do not match the fx quote'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/posting-groups/{id}:
    get:
      operationId: getPostingGroup
      tags: [PostingGroups]
      summary: Get a posting group
      description: The group with its member transactions. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroup'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/posting-rules:
    post:
      operationId: createPostingRule
      tags: [PostingRules]
      summary: Publish a posting rule
      description: |
        Publishes the next version of the rule for `event_type` in a ledger.
        A rule maps a canonical event to the lines of one transaction: each
        line names an account (a fixed `account_id`, or an `account` role the
        event fills), a `direction`, the name of one of the event's `amount`s
        and, optionally, an `asset` (default: the event's). Rules are
        immutable and versioned: publishing never edits an earlier version,
        and each version carries a `rule_hash` over its event type and lines.
        Not idempotent: every call publishes a new version. Requires
        `ledger:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostingRuleRequest'
            examples:
              cardSettlement:
                summary: Card settlement with a fee
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  event_type: card.settled
                  description: Card settlement net of the processor fee
                  lines:
                    - { account: processor_clearing, direction: DEBIT, amount: net }
                    - { account: fee_expense, direction: DEBIT, amount: fee }
                    - { account: customer_wallet, direction: CREDIT, amount: gross }
      responses:
        '201':
          description: Rule version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRule'
              examples:
                cardSettlement:
                  value:
                    id: 7a6b2c83-5f70-7192-b3c5-1e2f3a4b5c6d
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    event_type: card.settled
                    version: 1
                    description: Card settlement net of the processor fee
                    lines:
                      - { account: processor_clearing, direction: DEBIT, amount: net }
                      - { account: fee_expense, direction: DEBIT, amount: fee }
                      - { account: customer_wallet, direction: CREDIT, amount: gross }
                    rule_hash: 9c1e0b7a4d2f58163ab07c94e5d1f2a83b6c4d7e0f19a2b35c8d6e7f40a1b2c3
                    created_at: '2026-10-19T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: listPostingRules
      tags: [PostingRules]
      summary: List a ledger's posting rules
      description: |
        Every published version, newest first; `event_type` narrows the list
        to one event type. Requires `ledger:read`.
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          required: false
          description: Only the versions of this event type.
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of rules, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostingRule'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/posting-rules/{id}:
    get:
      operationId: getPostingRule
      tags: [PostingRules]
      summary: Get a posting rule
      description: Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The rule version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/posting-events:
    post:
      operationId: createPostingEvent
      tags: [PostingRules]
      summary: Book a canonical event
      description: |
        Applies the rule for `event_type` (the latest version, or
        `rule_version` when given) to the event's `amounts` and `accounts` and
        posts the resulting transaction through the normal posting path
        (balance per asset, periods, metadata allowlist, overdraft, account
        status, hash chain). The transaction carries `posting_rule_id`. An
        amount of `0` skips its lines. Every amount and role the rule names
        must be supplied, and nothing else (400 `validation_failed`). The
        postings must balance (422 `unbalanced_transaction`). An unknown
        `event_type` or `rule_version` is 404. Requires `ledger:write`.

        `idempotency_key` is required and may be sent in the body or via the
        `Idempotency-Key` request header (the body field wins). The same key
        and payload replays the event (200 + `X-Idempotent-Replay: true`).
        The same key with another payload, or a key already held by a plain
        transaction, is 409 `idempotency_conflict`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostingEventRequest'
            examples:
              cardSettled:
                summary: USD 100.00 gross, USD 2.50 fee
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  event_type: card.settled
                  idempotency_key: settle-2026-0042
                  asset: USD
                  amounts: { gross: '10000', fee: '250', net: '9750' }
                  accounts:
                    processor_clearing: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    fee_expense: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                    customer_wallet: 6f5a1b72-4e6f-7081-b294-0d2e4f5a6b7c
      responses:
        '201':
          description: Event booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingEvent'
        '200':
          description: Idempotent replay — the event already existed for this idempotency key and payload.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The idempotency key was already used with another payload, or by a plain transaction (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key already used with a different payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            The resulting transaction is refused as any posted transaction
            would be: unbalanced (`unbalanced_transaction`), insufficient
            funds (`insufficient_funds`), frozen or closed account
            (`account_inactive`), parent account (`account_not_postable`),
            closed period (`period_closed`) or rejected metadata
            (`metadata_*`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unbalanced:
                  value:
                    error:
                      code: unbalanced_transaction
                      message: 'domain: transaction is not balanced'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/posting-events/{id}:
    get:
      operationId: getPostingEvent
      tags: [PostingRules]
      summary: Get a posting event
      description: The event with the transaction it booked. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledger-transfers:
    post:
      operationId: createLedgerTransfer
      tags: [LedgerTransfers]
      summary: Create a transfer between ledgers
      description: |
        Moves value between two different ledgers of the tenant. A ledger never
        holds an entry that crosses ledgers, so a transfer is two posted
        transactions, one per ledger, written atomically: both commit or
        neither does. Each side names its `ledger_id`, its `due_account_id`
        (the inter-ledger due-to / due-from account of that ledger) and its
        `postings`, and goes through the normal posting path (balance per
        asset, every posting in its own ledger, periods, metadata allowlist,
        overdraft, account status, hash chain). Both transactions carry
        `transfer_id`.

        The due accounts must eliminate: per asset, the net movement of the
        source due account plus that of the target due account is zero, and
        the source due account must move (422 `transfer_unbalanced`). Both
        sides naming the same ledger, or a posting in the wrong ledger, is
        400 `validation_failed`.

        `idempotency_key` covers the whole transfer: the same key and payload
        replays it (200 + `X-Idempotent-Replay: true`); the same key with
        another payload is 409 `idempotency_conflict`. The key may be sent in
        the body or via the `Idempotency-Key` request header. The two
        transactions get the derived keys `<key>/source` and `<key>/target`;
        if one of those is already held by another transaction the call is
        409 `idempotency_conflict`. Requires `ledger:write`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerTransferRequest'
            examples:
              parentToSubsidiary:
                summary: Move USD 100.00 from one ledger to another
                value:
                  idempotency_key: xfer-2026-0001
                  reference: xfer-0001
                  source:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    due_account_id: 7a6b2c83-5f70-7192-c3a5-1e3f5a6b7c8d
                    postings:
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 7a6b2c83-5f70-7192-c3a5-1e3f5a6b7c8d
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                  target:
                    ledger_id: 2a1b0c9d-8e7f-7a6b-9c5d-4e3f2a1b0c9d
                    due_account_id: 8b7c3d94-6a81-72a3-d4b6-2f4a6b7c8d9e
                    postings:
                      - account_id: 9c8d4ea5-7b92-73b4-e5c7-3a5b7c8d9eaf
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 8b7c3d94-6a81-72a3-d4b6-2f4a6b7c8d9e
                        direction: CREDIT
                        amount: { asset: USD, amount: '10000' }
      responses:
        '201':
          description: Transfer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransfer'
        '200':
          description: Idempotent replay — the transfer already existed for this idempotency key and payload.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransfer'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The idempotency key was already used with another payload, or a
            derived key (`<key>/source`, `<key>/target`) is held by another
            transaction (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key already used with a different payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            The due accounts do not eliminate (`transfer_unbalanced`), or a
            side is refused as a transaction would be: unbalanced
            (`unbalanced_transaction`), insufficient funds
            (`insufficient_funds`), frozen or closed account
            (`account_inactive`), parent account (`account_not_postable`),
            closed period (`period_closed`) or rejected metadata
            (`metadata_*`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                transferUnbalanced:
                  value:
                    error:
                      code: transfer_unbalanced
                      message: 'domain: due accounts do not eliminate'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/ledger-transfers/{id}:
    get:
      operationId: getLedgerTransfer
      tags: [LedgerTransfers]
      summary: Get a transfer between ledgers
      description: The transfer with its two transactions. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransfer'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [Reports]
      summary: Trial balance
      description: |
        Sums debits and credits per account and asset over posted
        transactions. For a healthy ledger, total debits equal total credits
        per asset.

        With `from` the report becomes a period result: each row sums only
        the movements whose `effective_at` falls in `[from, as_of]`, so a
        September salary does not leak into October. A transaction reversed
        in a later period contributes its original postings to its own period
        and the reversal's postings to the period of the reversal.
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: |
            Start of the period (inclusive). With `from`, only postings of
            transactions with `from <= effective_at <= as_of` count; `as_of`
            defaults to now. `from` after `as_of` yields 400
            `validation_failed`. Without `from` the report is cumulative, as
            before.
          schema:
            type: string
            format: date-time
        - name: as_of
          in: query
          description: |
            Compute the balance as of this instant: the report is
            reconstructed by aggregating postings of transactions with
            `effective_at <= as_of` (transactions later reversed still count
            at instants before their reversal's `effective_at`). Without it,
            the report reflects the current running balances. With `from`,
            it is the end of the period.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The trial balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
              examples:
                afterDeposit:
                  summary: Trial balance after the USD 100 deposit
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    as_of: '2026-07-24T12:10:00Z'
                    rows:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        account_name: assets:cash
                        account_type: asset
                        asset: USD
                        debits: '10000'
                        credits: '0'
                        net: '10000'
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        account_name: customer:cust_42:wallet
                        account_type: liability
                        asset: USD
                        debits: '0'
                        credits: '9700'
                        net: '-9700'
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        account_name: revenue:fees
                        account_type: revenue
                        asset: USD
                        debits: '0'
                        credits: '300'
                        net: '-300'
                    totals:
                      - asset: USD
                        debits: '10000'
                        credits: '10000'
                        balanced: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/statements:
    get:
      operationId: getStatement
      tags: [Reports]
      summary: Account statement
      description: |
        Statement of one account over a period: opening balance per asset
        (aggregate of postings with `effective_at` strictly before `from`),
        entries ordered by `effective_at` ascending with a per-asset running
        balance, and the closing balance at `to`. Balances are signed by the
        account's normal balance side, so a funded credit-normal wallet shows
        positive numbers. Reversed transactions keep contributing (their
        compensating transaction appears as its own entry). Entries are
        keyset-paginated; opening/closing always cover the whole period
        regardless of the page.
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Period start (inclusive). Defaults to `to` minus 30 days.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Period end (inclusive). Defaults to now.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The account statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
              examples:
                walletStatement:
                  summary: Wallet statement with two deposits in the period
                  value:
                    account:
                      id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                      name: customer:cust_42:wallet
                      type: liability
                      normal_balance: CREDIT
                      status: active
                      allow_negative: false
                      fund_class: customer
                      postable: true
                      metadata: {}
                      created_at: '2026-05-01T09:00:00Z'
                    period:
                      from: '2026-06-01T00:00:00Z'
                      to: '2026-07-01T00:00:00Z'
                    opening_balance:
                      - asset: USD
                        exponent: 2
                        amount: '14550'
                    entries:
                      - id: 7c2d8e4f-1b3c-7d5e-af61-8a9b0c1d2e3f
                        transaction_id: 3c2d8e4f-1b3c-7d5e-af61-8a9b0c1d2e30
                        reference: dep-2001
                        direction: CREDIT
                        amount: { asset: USD, amount: '1940' }
                        effective_at: '2026-06-01T13:00:00Z'
                        running_balance: '16490'
                      - id: 8d3e9f50-2c4d-7e6f-b072-9b0c1d2e3f40
                        transaction_id: 4d3e9f50-2c4d-7e6f-b072-9b0c1d2e3f41
                        reference: dep-2002
                        direction: CREDIT
                        amount: { asset: USD, amount: '970' }
                        effective_at: '2026-06-01T14:00:00Z'
                        running_balance: '17460'
                    closing_balance:
                      - asset: USD
                        exponent: 2
                        amount: '17460'
                    next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/provider-positions:
    get:
      operationId: listProviderPositions
      tags: [Reports]
      summary: Provider (counterparty) positions
      description: |
        Net position against every counterparty (payment provider, bank,
        processor), aggregated from the running `account_balances` of asset-
        and liability-type accounts — never from postings.

        Convention: an account belongs to a provider when its name/path
        contains a `provider` segment followed by the provider name —
        `assets:provider:acmepay:usd` or `liabilities/provider/nordpay/mxn`
        (both `:` and `/` work as separators) — or when the account carries
        `metadata.provider` as an explicit override (it wins over the path).

        `net` is the signed sum of `posted_debits - posted_credits` across
        the provider's accounts per asset: positive means the counterparty
        holds value for us (`they_owe_us`), negative means we owe them
        (`we_owe_them`), zero is `flat`.

        Tenants that do not follow the convention get an empty `data` array
        plus a `hint` explaining how to opt in.
      responses:
        '200':
          description: One entry per provider with per-asset net positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPositions'
              examples:
                twoProviders:
                  summary: Positive position with AcmePay, payable to NordPay
                  value:
                    data:
                      - provider: nordpay
                        positions:
                          - asset: USD
                            exponent: 2
                            net: '-1200'
                            direction: we_owe_them
                            accounts: [9e4f0a61-3d5e-7f80-c193-0c1d2e3f4a51]
                      - provider: acmepay
                        positions:
                          - asset: MXN
                            exponent: 2
                            net: '30000'
                            direction: they_owe_us
                            accounts: [0f5a1b72-4e6f-7081-d2a4-1d2e3f4a5b62]
                          - asset: USD
                            exponent: 2
                            net: '5000'
                            direction: they_owe_us
                            accounts: [1a6b2c83-5f70-7192-e3b5-2e3f4a5b6c73]
                noConvention:
                  summary: Tenant without provider-named accounts
                  value:
                    data: []
                    hint: >-
                      no provider accounts found: name accounts as
                      assets:provider:<name>:... (or
                      liabilities:provider:<name>:...) or set
                      metadata.provider on the account
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA JWT issued by the identity service (POST /v1/auth/token).

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page's `next_cursor`. A
        malformed cursor yields 400 `invalid_cursor`.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
        Query strings are as strict as bodies: a query parameter the endpoint
        does not declare is `validation_failed` and the message names it
        (`unknown query parameter "from" (accepted: ...)`), instead of being ignored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                error:
                  code: validation_failed
                  message: 'unknown field "amonut"'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            unknownQueryParameter:
              value:
                error:
                  code: validation_failed
                  message: 'unknown query parameter "metadata.order_id" (accepted: asset, cursor, limit)'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: token is invalid or expired
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    NotFound:
      description: The resource does not exist within this tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: resource not found
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    NotImplemented:
      description: Declared stub for a future milestone (`not_implemented`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stub:
              value:
                error:
                  code: not_implemented
                  message: GET /v1/statements is not implemented yet; it is planned for a future milestone
    MovementRejected:
      description: |
        Posting would leave an account with `allow_negative: false` below zero
        available (`insufficient_funds`), touches a frozen or closed account
        (`account_inactive`), or its `effective_at` falls in a closed
        accounting period (`period_closed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficientFunds:
              value:
                error:
                  code: insufficient_funds
                  message: 'domain: available balance would go negative: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e would have available -300 USD'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            accountInactive:
              value:
                error:
                  code: account_inactive
                  message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            periodClosed:
              value:
                error:
                  code: period_closed
                  message: 'domain: accounting period is closed: period 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d (2026-09) is hard_closed'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    MetadataRejected:
      description: |
        The metadata is rejected. The message names the key (unless the key
        itself looks like personal data) and never the value.

        - `metadata_not_scalar`: a value is an object, an array or null.
        - `metadata_too_large`: more than 50 keys, a key of 0 or more than
          64 bytes, or a value of more than 500 bytes.
        - `metadata_pii_detected`: a key or value looks like an email, a card
          number, a phone number or an IBAN, in every ledger. A UUID is never
          read as personal data.
        - `metadata_key_not_allowed`: the key is outside the ledger's
          allowlist (`PUT /v1/ledgers/{id}/metadata-policy`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            keyNotAllowed:
              value:
                error:
                  code: metadata_key_not_allowed
                  message: 'domain: metadata key is not allowed in this ledger: key "channel"'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            pii:
              value:
                error:
                  code: metadata_pii_detected
                  message: 'domain: metadata looks like personal data: the value of key "note" looks like a card number'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Conflict:
      description: Uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                error:
                  code: conflict
                  message: a resource with that name already exists
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, account_inactive,
                account_not_postable, parent_account_has_activity,
                period_closed, fx_quote_expired, fx_rate_mismatch,
                transfer_unbalanced, approval_required, self_approval,
                request_hash_mismatch, hold_expired, metadata_not_scalar,
                metadata_too_large,
                metadata_pii_detected, metadata_key_not_allowed,
                rate_limited,
                service_unavailable, internal.
            message:
              type: string
              description: Human-readable explanation. Never parse this.
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).

    AssetCode:
      type: string
      pattern: '^[A-Z0-9]{1,12}$'
      description: Asset code registered in the ledger asset registry (e.g. USD, BTC, USDC).
      examples: [USD]

    Money:
      type: object
      required: [asset, amount]
      additionalProperties: false
      description: |
        Integer amount in minor units, string-encoded so int64 values survive
        JSON round trips. The exponent lives in the asset registry.
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        amount:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: int64 in minor units, string-encoded (e.g. "10000" = USD 100.00).
      examples:
        - asset: USD
          amount: '10000'

    Direction:
      type: string
      enum: [DEBIT, CREDIT]

    TransactionStatus:
      type: string
      enum: [draft, posted, reversed, discarded]
      description: |
        `draft` and `discarded` rows are staging, not financial facts: only
        `posted` and `reversed` carry a journal number and enter the hash
        chain. `discarded` is terminal (a draft that was abandoned with
        `POST /v1/transactions/{id}/discard`).

    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]

    AccountStatus:
      type: string
      enum: [active, frozen, closed]
      description: |
        Only `active` accounts accept movements. A transaction (created,
        posted from draft or reversed) or a hold that touches a `frozen` or
        `closed` account fails with 422 `account_inactive`. Changed with
        `PATCH /v1/accounts/{id}`: `active` and `frozen` move freely into each
        other; `closed` is final and requires an empty account.

    HoldStatus:
      type: string
      enum: [active, captured, released, expired]
      description: |
        `active` reserves funds; `captured`, `released` and `expired` are
        terminal. The sweeper moves an active hold past `expires_at` to
        `expired` (ADR-016).

    Metadata:
      type: object
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 64
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
      description: |
        Flat key/value pairs attached by the tenant. Values must be scalars:
        strings, numbers or booleans (objects, arrays and null are 422
        `metadata_not_scalar`). Numbers and booleans are stored and returned
        as their JSON text (`10.50` -> `"10.50"`, `true` -> `"true"`), so
        responses always carry strings. Keys or values that look like an
        email, a card number (Luhn), a phone number (`+` and 8-15 digits) or
        an IBAN (mod 97) are rejected in every ledger (422
        `metadata_pii_detected`); a ledger's `metadata_policy` can restrict
        the keys too. See docs/metadata-y-cobertura.md.

    LedgerCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'

    Ledger:
      type: object
      required: [id, name, environment, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
          enum: [sandbox, live]
          description: Taken from the `env` claim of the creating token; not client-settable.
        metadata:
          $ref: '#/components/schemas/Metadata'
        metadata_policy:
          $ref: '#/components/schemas/MetadataPolicy'
        created_at:
          type: string
          format: date-time

    MetadataPolicy:
      type: object
      additionalProperties: false
      description: |
        The ledger's metadata allowlists. `null` (the default for every
        ledger): no allowlist, any key accepted. An empty list accepts no
        key. Keys come back sorted and without duplicates.
      properties:
        transaction_keys:
          type: [array, 'null']
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Keys accepted on new transactions and holds.
        account_keys:
          type: [array, 'null']
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Keys accepted on new accounts.

    FundClass:
      type: string
      enum: [customer, own]
      description: |
        Whose money the account holds: `customer` (held for or owed to
        customers) or `own` (the operator's money). Only `asset` and
        `liability` accounts enter the coverage report
        (`GET /v1/ledgers/{id}/coverage`). Defaults to `customer` for
        `liability` accounts and `own` for every other type; accounts that
        existed before this field got the same default.

    Coverage:
      type: object
      required: [ledger_id, covered, data]
      properties:
        ledger_id:
          type: string
          format: uuid
        covered:
          type: boolean
          description: True when every asset is covered.
        data:
          type: array
          items:
            type: object
            required: [asset, exponent, customer_assets, customer_liabilities, customer_receivables, negative_accounts, covered, shortfall]
            properties:
              asset:
                $ref: '#/components/schemas/AssetCode'
              exponent:
                type: integer
              customer_assets:
                type: string
                description: Posted debits - credits of the customer-class asset accounts, minor units.
              customer_liabilities:
                type: string
                description: Sum of the positive posted balances (credits - debits) of the customer-class liability accounts, minor units. Accounts in the red do not subtract from it.
              customer_receivables:
                type: string
                description: Sum of the negative posted balances of the customer-class liability accounts, as a positive number, minor units. What those customers owe the platform; not backing.
              negative_accounts:
                type: integer
                description: How many customer-class liability accounts have a negative posted balance in this asset.
              covered:
                type: boolean
                description: customer_assets >= customer_liabilities.
              shortfall:
                type: string
                description: customer_liabilities - customer_assets when not covered, "0" otherwise.

    AccountCreate:
      type: object
      required: [ledger_id, name, type, normal_balance]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Unique within the ledger, and its place in the account tree: `:`
            separates levels, so `assets:cash:usd` is a child of `assets:cash`
            and of `assets` (other characters, such as `/`, are part of the
            name). Intermediate levels need not exist. An account with
            children is a non-postable parent; creating a child under an
            account that has postings or active holds fails with 422
            `parent_account_has_activity`.
        type:
          $ref: '#/components/schemas/AccountType'
        normal_balance:
          $ref: '#/components/schemas/Direction'
        allow_negative:
          type: boolean
          description: |
            Whether a posting may leave this account's available balance
            (posted net minus active holds, signed by `normal_balance`) below
            zero. When `false`, such a posting fails with 422
            `insufficient_funds`. Defaults to `false` for `liability` accounts
            (customer wallets: money the ledger owes) and `true` for every
            other type, which routinely carry contra balances. Accounts that
            existed before this field are `true`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        metadata:
          $ref: '#/components/schemas/Metadata'

    AccountUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Fields to change; at least one. Omitted fields keep their value.
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
        allow_negative:
          type: boolean
          description: Overdraft policy; see `AccountCreate.allow_negative`.
        fund_class:
          $ref: '#/components/schemas/FundClass'

    Account:
      type: object
      required: [id, ledger_id, name, type, normal_balance, status, allow_negative, fund_class, postable, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        normal_balance:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/AccountStatus'
        allow_negative:
          type: boolean
          description: Overdraft policy; see `AccountCreate.allow_negative`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        postable:
          type: boolean
          readOnly: true
          description: |
            False when other accounts live under this one's name (it is a
            parent). Derived on every read, never stored. A parent rejects
            transactions and holds with 422 `account_not_postable`; its
            balances are the sum of its subtree.
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time

    Balance:
      type: object
      required: [asset, exponent, posted, pending, available, held, posted_debits, posted_credits, version]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
          minimum: 0
          maximum: 18
          description: Decimal places of the asset (registry value), for display.
        posted:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Net posted balance in minor units, signed by normal_balance.
        pending:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        available:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        held:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Sum of active holds against the account, in minor units.
        posted_debits:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Gross posted debits, unsigned by normal_balance.
        posted_credits:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Gross posted credits, unsigned by normal_balance.
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version of the balance row; increases with every posting.

    Posting:
      type: object
      required: [account_id, direction, amount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server; present in responses only.
        account_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'

    Entry:
      type: object
      required: [id, transaction_id, account_id, direction, amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time

    TransactionCreate:
      type: object
      required: [ledger_id, postings]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Unique per tenant. Retries with the same key return the original
            transaction (200 + `X-Idempotent-Replay: true`). Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        status:
          type: string
          enum: [draft, posted]
          default: posted
          description: Create as draft to post later, or post atomically (default).
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance per asset (sum of debits == sum of credits).
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        metadata:
          $ref: '#/components/schemas/Metadata'
        hold_id:
          type: string
          format: uuid
          description: |
            An active hold this payment settles (only with `status: posted`).
            In the same database transaction the hold is captured and linked
            (the hold's `transaction_id`), its reservation is released and only
            then is the overdraft policy checked — so the payment may spend
            the funds the hold set aside, and nobody else can in between. The
            transaction must lower the held account in the held asset; the
            captured amount is that decrease, capped at the hold, and any
            remainder is released. Emits `ledger.hold.captured` and writes the
            same `hold.capture` audit row as `POST /v1/holds/{id}/capture`. A
            hold that is not active is 409 `conflict`; one past `expires_at` is 409
            `hold_expired` (ADR-016). Part of the idempotency fingerprint.

            For short authorizations (a card, a checkout) only: a payout already
            sent to a bank should not wait on a hold, which expires and frees the
            funds — book it through `liabilities:payouts_in_flight:<provider>`
            instead (`docs/payouts-en-vuelo.md`).
        adjusts_period_id:
          type: string
          format: uuid
          description: |
            Makes this transaction an adjustment of that accounting period of
            the same ledger, which must be `soft_closed` or `hard_closed`; the
            adjustment cannot be dated before the period starts. A
            `soft_closed` period accepts only adjustments of itself; a
            `hard_closed` one accepts nothing, so it is corrected by an
            adjustment dated in an open period. Covered by the journal hash
            and part of the idempotency fingerprint. 404 when the period does
            not exist in the ledger; 400 `validation_failed` when it is open
            or starts after `effective_at`.

            An adjustment is only written by executing an approved adjustment
            request (`POST /v1/adjustment-requests`): sent here, a valid
            adjustment is refused with 422 `approval_required`. An adjustment
            is never a draft: with `status: draft` it is 400
            `validation_failed` (ADR-009).

    Transaction:
      type: object
      required: [id, ledger_id, idempotency_key, status, postings, metadata, reversed_by, reverses, effective_at, created_at, posted_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Free-form external reference; omitted when empty.
        description:
          type: string
        status:
          $ref: '#/components/schemas/TransactionStatus'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        metadata:
          $ref: '#/components/schemas/Metadata'
        reversed_by:
          type: [string, 'null']
          format: uuid
          description: Id of the reversal transaction, when this one was reversed.
        reverses:
          type: [string, 'null']
          format: uuid
          description: Id of the original transaction, when this one is a reversal.
        adjusts_period_id:
          type: [string, 'null']
          format: uuid
          description: Id of the accounting period this transaction adjusts, when it is an adjustment.
        posting_group_id:
          type: [string, 'null']
          format: uuid
          description: Id of the posting group this transaction belongs to; null for a standalone transaction.
        posting_rule_id:
          type: [string, 'null']
          format: uuid
          description: Id of the posting rule version this transaction was booked through; null when it was not booked from an event.
        transfer_id:
          type: [string, 'null']
          format: uuid
          description: Id of the ledger transfer this transaction is one side of; null for a standalone transaction.
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        created_at:
          type: string
          format: date-time
        posted_at:
          type: [string, 'null']
          format: date-time

    PeriodStatus:
      type: string
      enum: [open, soft_closed, hard_closed]

    PeriodCreate:
      type: object
      required: [ledger_id, name, starts_at, ends_at]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at:
          type: string
          format: date-time
          description: Inclusive start. Must equal the ledger's last period `ends_at`, if any.
        ends_at:
          type: string
          format: date-time
          description: Exclusive end; after `starts_at`.

    PeriodUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PeriodStatus'

    Period:
      type: object
      required: [id, ledger_id, name, starts_at, ends_at, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PeriodStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdjustmentStatus:
      type: string
      enum: [pending, approved, executed, rejected, cancelled]

    AdjustmentRequestCreate:
      type: object
      required: [ledger_id, effective_at, postings]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Required; may come in the `Idempotency-Key` header instead.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Required — the date is part of what is approved.
        adjusts_period_id:
          type: string
          format: uuid
          description: |
            The closed period this adjustment corrects (same rules as on
            `TransactionCreate`). Optional: a request without it executes as a
            regular entry that still went through four eyes.
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance per asset.
        metadata:
          $ref: '#/components/schemas/Metadata'

    AdjustmentApproval:
      type: object
      required: [approver, request_hash, approved_at]
      properties:
        approver:
          type: string
          description: Identity that approved (e.g. `api_key:<id>`).
        request_hash:
          type: string
          description: The hash approved, hex-encoded.
        approved_at:
          type: string
          format: date-time

    AdjustmentRequest:
      type: object
      required: [id, ledger_id, idempotency_key, status, request_hash, maker, effective_at, adjusts_period_id, metadata, postings, approvals, transaction_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        status:
          $ref: '#/components/schemas/AdjustmentStatus'
        request_hash:
          type: string
          description: SHA-256 of the canonical form of the request, hex-encoded. Approvers send it back to approve.
        maker:
          type: string
          description: Identity that created the request (e.g. `api_key:<id>`).
        reference:
          type: string
        description:
          type: string
        effective_at:
          type: string
          format: date-time
        adjusts_period_id:
          type: [string, 'null']
          format: uuid
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentApproval'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: The transaction written by the execution, once `executed`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldCreate:
      type: object
      required: [account_id, idempotency_key, amount]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
          description: Optional; derived from the account when omitted.
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
          description: When the hold auto-releases; defaults to 7 days.
        metadata:
          $ref: '#/components/schemas/Metadata'

    Hold:
      type: object
      required: [id, ledger_id, account_id, idempotency_key, amount, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/HoldStatus'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: The transaction created on capture; null otherwise.
        expires_at:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time

    FXQuote:
      type: object
      required: [id, base_asset, quote_asset, rate, source, quoted_at, expires_at, created_at]
      description: Immutable rate between two assets (1 unit of `base_asset` = `rate` units of `quote_asset`, in major units).
      properties:
        id:
          type: string
          format: uuid
        base_asset:
          $ref: '#/components/schemas/AssetCode'
        quote_asset:
          $ref: '#/components/schemas/AssetCode'
        rate:
          type: string
          pattern: '^[0-9]{1,20}(\.[0-9]{1,18})?$'
          description: Positive decimal string, never a float.
        source:
          type: string
        quoted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateFXQuoteRequest:
      type: object
      required: [base_asset, quote_asset, rate, source, expires_at]
      additionalProperties: false
      properties:
        base_asset:
          $ref: '#/components/schemas/AssetCode'
        quote_asset:
          $ref: '#/components/schemas/AssetCode'
        rate:
          type: string
          pattern: '^[0-9]{1,20}(\.[0-9]{1,18})?$'
          description: |
            1 unit of `base_asset` is `rate` units of `quote_asset`, in major
            units. Greater than zero, at most 18 fractional digits.
        source:
          type: string
          minLength: 1
          maxLength: 64
          description: Short label of where the rate comes from (e.g. `ecb`, `desk`).
        quoted_at:
          type: string
          format: date-time
          description: When the rate was observed; defaults to the creation time.
        expires_at:
          type: string
          format: date-time
          description: After this instant no new posting group can cite the quote. Must be after `quoted_at`.

    GroupFX:
      type: object
      required: [quote_id, account_id]
      additionalProperties: false
      description: The quote that prices a posting group and the conversion account whose legs are checked against it.
      properties:
        quote_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid

    GroupTransaction:
      type: object
      required: [postings]
      additionalProperties: false
      description: A member of a posting group. It is always posted and must hold a single asset.
      properties:
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance in its single asset.

    CreatePostingGroupRequest:
      type: object
      required: [ledger_id, transactions]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: |
            Unique per tenant and covers the whole group. Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date shared by every member; defaults to creation time.
        fx:
          $ref: '#/components/schemas/GroupFX'
        transactions:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/GroupTransaction'

    PostingGroup:
      type: object
      required: [id, ledger_id, idempotency_key, fx, transactions, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Omitted when empty.
        description:
          type: string
          description: Omitted when empty.
        fx:
          oneOf:
            - $ref: '#/components/schemas/GroupFX'
            - type: 'null'
          description: The quote and conversion account the group cites; null when it cites none.
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        created_at:
          type: string
          format: date-time

    RuleLine:
      type: object
      required: [direction, amount]
      additionalProperties: false
      description: One line template of a posting rule. Exactly one of `account_id` and `account`.
      properties:
        account_id:
          type: string
          format: uuid
          description: Fixed account this line always posts to.
        account:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: Account role; the event supplies the account in `accounts`.
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: Name of one of the event's `amounts`.
        asset:
          $ref: '#/components/schemas/AssetCode'

    PostingRule:
      type: object
      required: [id, ledger_id, event_type, version, lines, rule_hash, created_at]
      description: An immutable version of the mapping from a canonical event type to transaction lines.
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        version:
          type: integer
          minimum: 1
          description: Per ledger and event type, starting at 1.
        description:
          type: string
          description: Omitted when empty.
        lines:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuleLine'
        rule_hash:
          type: string
          description: Hex SHA-256 of the rule's event type and lines.
          examples: ['9c1e0b7a4d2f58163ab07c94e5d1f2a83b6c4d7e0f19a2b35c8d6e7f40a1b2c3']
        created_at:
          type: string
          format: date-time

    CreatePostingRuleRequest:
      type: object
      required: [ledger_id, event_type, lines]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        description:
          type: string
          maxLength: 1024
        lines:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuleLine'
          description: At least one DEBIT and one CREDIT line.

    CreatePostingEventRequest:
      type: object
      required: [ledger_id, event_type, amounts]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: |
            Unique per tenant. Required, but it may be supplied via the
            `Idempotency-Key` request header instead of this field; the body
            field wins when both are present.
        rule_version:
          type: integer
          minimum: 0
          description: Version of the rule to apply; 0 or omitted means the latest.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        metadata:
          $ref: '#/components/schemas/Metadata'
        asset:
          $ref: '#/components/schemas/AssetCode'
        amounts:
          type: object
          additionalProperties:
            type: string
            pattern: '^[0-9]+$'
          description: Amount name to string-encoded integer in minor units. Must hold exactly the names the rule uses; 0 skips that amount's lines.
        accounts:
          type: object
          additionalProperties:
            type: string
            format: uuid
          description: Account role to account id. Must hold exactly the roles the rule uses.

    PostingEvent:
      type: object
      required: [id, ledger_id, event_type, idempotency_key, rule_id, rule_version, amounts, accounts, transaction, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
        idempotency_key:
          type: string
        rule_id:
          type: string
          format: uuid
          description: The rule version that was applied.
        rule_version:
          type: integer
          minimum: 1
        asset:
          $ref: '#/components/schemas/AssetCode'
        amounts:
          type: object
          additionalProperties:
            type: string
          description: Amount name to string-encoded integer in minor units.
        accounts:
          type: object
          additionalProperties:
            type: string
            format: uuid
          description: Account role to account id; empty when the rule uses only fixed accounts.
        transaction:
          $ref: '#/components/schemas/Transaction'
        created_at:
          type: string
          format: date-time

    TransferSideRequest:
      type: object
      required: [ledger_id, due_account_id, postings]
      additionalProperties: false
      description: One side of a transfer between ledgers. It is always posted, in its own ledger.
      properties:
        ledger_id:
          type: string
          format: uuid
          description: Ledger this side posts to. The two sides must name different ledgers.
        due_account_id:
          type: string
          format: uuid
          description: The inter-ledger due-to / due-from account of `ledger_id`.
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Every posting must be on an account of `ledger_id`; must balance per asset.

    CreateLedgerTransferRequest:
      type: object
      required: [source, target]
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: |
            Unique per tenant and covers the whole transfer. Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date shared by both transactions; defaults to creation time.
        source:
          $ref: '#/components/schemas/TransferSideRequest'
        target:
          $ref: '#/components/schemas/TransferSideRequest'

    TransferSide:
      type: object
      required: [ledger_id, due_account_id, transaction]
      description: One side of a transfer between ledgers.
      properties:
        ledger_id:
          type: string
          format: uuid
        due_account_id:
          type: string
          format: uuid
        transaction:
          $ref: '#/components/schemas/Transaction'

    LedgerTransfer:
      type: object
      required: [id, idempotency_key, source, target, created_at]
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Omitted when empty.
        description:
          type: string
          description: Omitted when empty.
        source:
          $ref: '#/components/schemas/TransferSide'
        target:
          $ref: '#/components/schemas/TransferSide'
        created_at:
          type: string
          format: date-time

    TrialBalance:
      type: object
      required: [ledger_id, as_of, rows, totals]
      properties:
        ledger_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
          description: Present only for a period result (the `from` query parameter).
        as_of:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            required: [account_id, account_name, account_type, asset, debits, credits, net]
            properties:
              account_id:
                type: string
                format: uuid
              account_name:
                type: string
              account_type:
                $ref: '#/components/schemas/AccountType'
              asset:
                $ref: '#/components/schemas/AssetCode'
              debits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              credits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              net:
                type: string
                pattern: '^-?[0-9]{1,19}$'
                description: debits - credits, in minor units.
        totals:
          type: array
          items:
            type: object
            required: [asset, debits, credits, balanced]
            properties:
              asset:
                $ref: '#/components/schemas/AssetCode'
              debits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              credits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              balanced:
                type: boolean

    AssetBalance:
      type: object
      description: Per-asset balance signed by the account's normal balance side.
      required: [asset, exponent, amount]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
          description: Display exponent (decimal places) of the asset.
        amount:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Signed int64 minor units, string-encoded.

    StatementEntry:
      type: object
      required: [id, transaction_id, direction, amount, effective_at, running_balance]
      properties:
        id:
          type: string
          format: uuid
          description: Posting id.
        transaction_id:
          type: string
          format: uuid
        reference:
          type: string
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        effective_at:
          type: string
          format: date-time
        running_balance:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: >-
            Balance of the entry's asset after this entry, signed by the
            account's normal balance side.

    Statement:
      type: object
      required: [account, period, opening_balance, entries, closing_balance, next_cursor]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        opening_balance:
          type: array
          description: Balance per asset immediately before the period.
          items:
            $ref: '#/components/schemas/AssetBalance'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        closing_balance:
          type: array
          description: Balance per asset at the end of the period.
          items:
            $ref: '#/components/schemas/AssetBalance'
        next_cursor:
          type: [string, 'null']
          description: |
            Keyset cursor for the next page of entries; null when there are
            no more results (no extra empty page needed).

    ProviderPositions:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [provider, positions]
            properties:
              provider:
                type: string
                description: Counterparty name, lowercased.
              positions:
                type: array
                items:
                  type: object
                  required: [asset, exponent, net, direction, accounts]
                  properties:
                    asset:
                      $ref: '#/components/schemas/AssetCode'
                    exponent:
                      type: integer
                    net:
                      type: string
                      pattern: '^-?[0-9]{1,19}$'
                      description: Signed posted_debits - posted_credits across the provider's accounts.
                    direction:
                      type: string
                      enum: [they_owe_us, we_owe_them, flat]
                    accounts:
                      type: array
                      items:
                        type: string
                        format: uuid
        hint:
          type: string
          description: >-
            Present only when data is empty: explains the naming convention
            (assets:provider:<name>:...) or the metadata.provider override.

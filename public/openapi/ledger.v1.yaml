  /v1/posting-groups:
    post:
      operationId: createPostingGroup
      tags: [PostingGroups]
      summary: Create a posting group
      description: |
        Writes two or more posted, single-asset transactions atomically: all
        members commit or none does. Each member goes through the normal
        posting path (balance per asset, periods, metadata allowlist,
        overdraft, account status, hash chain) and carries `posting_group_id`.
        A member that mixes assets is 400 `validation_failed`. Requires
        `ledger:write`.

        With `fx`, the group cites an FX quote and a conversion account.
        Across the members, that account's net movement in the base asset and
        in the quote asset must be non-zero, of opposite sign, and the quote
        amount must equal the base amount times the rate within one minor unit
        (422 `fx_rate_mismatch`). The quote must not be expired
        (422 `fx_quote_expired`). An invalid quote, rate or group is 400
        `validation_failed`.

        `idempotency_key` covers the whole group: the same key and payload
        replays it (200 + `X-Idempotent-Replay: true`); the same key with
        another payload is 409 `idempotency_conflict`. The key may be sent in
        the body or via the `Idempotency-Key` request header. Members get the
        derived keys `<key>/1`, `<key>/2`, ….
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostingGroupRequest'
            examples:
              usdToEur:
                summary: Convert USD 100.00 to EUR 92.13 through a conversion account
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: fx-2026-0007
                  reference: conv-0007
                  fx:
                    quote_id: 4d3e9f50-2c4d-7e6f-9072-8b0c2d3e4f5a
                    account_id: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                  transactions:
                    - reference: conv-0007-usd
                      postings:
                        - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                          direction: DEBIT
                          amount: { asset: USD, amount: '10000' }
                        - account_id: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                          direction: CREDIT
                          amount: { asset: USD, amount: '10000' }
                    - reference: conv-0007-eur
                      postings:
                        - account_id: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                          direction: DEBIT
                          amount: { asset: EUR, amount: '9213' }
                        - account_id: 6f5a1b72-4e6f-7081-b294-0d2e4f5a6b7c
                          direction: CREDIT
                          amount: { asset: EUR, amount: '9213' }
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroup'
        '200':
          description: Idempotent replay — the group already existed for this idempotency key and payload.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroup'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The idempotency key was already used with another payload
            (`idempotency_conflict`); or the movement is past the stage
            (`movement_stage_invalid`) or has ended (`movement_closed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key already used with a different payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            A member is refused as a transaction would be: unbalanced
            (`unbalanced_transaction`), insufficient funds
            (`insufficient_funds`), frozen or closed account
            (`account_inactive`), parent account (`account_not_postable`),
            closed period (`period_closed`) or rejected metadata
            (`metadata_*`); or the group breaks its FX rules: the quote has
            expired (`fx_quote_expired`) or the conversion legs do not match
            the quote's rate (`fx_rate_mismatch`); or the group breaks the
            movement rules: a posting on a transit account without a movement
            (`movement_required`), or a movement whose transit would go below
            zero (`movement_transit_overdrawn`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                quoteExpired:
                  value:
                    error:
                      code: fx_quote_expired
                      message: 'domain: fx quote has expired'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                rateMismatch:
                  value:
                    error:
                      code: fx_rate_mismatch
                      message: 'domain: conversion legs do not match the fx quote'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/posting-groups/{id}:
    get:
      operationId: getPostingGroup
      tags: [PostingGroups]
      summary: Get a posting group
      description: The group with its member transactions. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroup'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/posting-rules:
    post:
      operationId: createPostingRule
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [PostingRules]
      summary: Publish a posting rule
      description: |
        Publishes the next version of the rule for `event_type` in a ledger.
        A rule maps a canonical event to the lines of one transaction: each
        line names an account (a fixed `account_id`, or an `account` role the
        event fills), a `direction`, the name of one of the event's `amount`s
        and, optionally, an `asset` (default: the event's). Rules are
        immutable and versioned: publishing never edits an earlier version,
        and each version carries a `rule_hash` over its event type and lines.
        Not idempotent: every call publishes a new version. Requires
        `ledger:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostingRuleRequest'
            examples:
              cardSettlement:
                summary: Card settlement with a fee
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  event_type: card.settled
                  description: Card settlement net of the processor fee
                  lines:
                    - { account: processor_clearing, direction: DEBIT, amount: net }
                    - { account: fee_expense, direction: DEBIT, amount: fee }
                    - { account: customer_wallet, direction: CREDIT, amount: gross }
      responses:
        '201':
          description: Rule version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRule'
              examples:
                cardSettlement:
                  value:
                    id: 7a6b2c83-5f70-7192-b3c5-1e2f3a4b5c6d
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    event_type: card.settled
                    version: 1
                    description: Card settlement net of the processor fee
                    lines:
                      - { account: processor_clearing, direction: DEBIT, amount: net }
                      - { account: fee_expense, direction: DEBIT, amount: fee }
                      - { account: customer_wallet, direction: CREDIT, amount: gross }
                    rule_hash: 9c1e0b7a4d2f58163ab07c94e5d1f2a83b6c4d7e0f19a2b35c8d6e7f40a1b2c3
                    created_at: '2026-10-19T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: listPostingRules
      tags: [PostingRules]
      summary: List a ledger's posting rules
      description: |
        Every published version, newest first; `event_type` narrows the list
        to one event type. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          required: false
          description: Only the versions of this event type.
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of rules, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostingRule'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/posting-rules/{id}:
    get:
      operationId: getPostingRule
      tags: [PostingRules]
      summary: Get a posting rule
      description: Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The rule version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/posting-events:
    post:
      operationId: createPostingEvent
      tags: [PostingRules]
      summary: Book a canonical event
      description: |
        Applies the rule for `event_type` (the latest version, or
        `rule_version` when given) to the event's `amounts` and `accounts` and
        posts the resulting transaction through the normal posting path
        (balance per asset, periods, metadata allowlist, overdraft, account
        status, hash chain). The transaction carries `posting_rule_id`. An
        amount of `0` skips its lines. Every amount and role the rule names
        must be supplied, and nothing else (400 `validation_failed`). The
        postings must balance (422 `unbalanced_transaction`). An unknown
        `event_type` or `rule_version` is 404. Requires `ledger:write`.

        `hold_id` (optional) settles an active hold in the same booking: the
        transaction captures it, as on `POST /v1/transactions`. A hold past its
        `expires_at` is 409 `hold_expired`.

        `idempotency_key` is required and may be sent in the body or via the
        `Idempotency-Key` request header (the body field wins). The same key
        and payload replays the event (200 + `X-Idempotent-Replay: true`).
        The same key with another payload, or a key already held by a plain
        transaction, is 409 `idempotency_conflict`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostingEventRequest'
            examples:
              cardSettled:
                summary: USD 100.00 gross, USD 2.50 fee
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  event_type: card.settled
                  idempotency_key: settle-2026-0042
                  asset: USD
                  amounts: { gross: '10000', fee: '250', net: '9750' }
                  accounts:
                    processor_clearing: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    fee_expense: 5e4f0a61-3d5e-7f80-a183-9c1d3e4f5a6b
                    customer_wallet: 6f5a1b72-4e6f-7081-b294-0d2e4f5a6b7c
      responses:
        '201':
          description: Event booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingEvent'
        '200':
          description: Idempotent replay — the event already existed for this idempotency key and payload.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The idempotency key was already used with another payload, or by a plain transaction (`idempotency_conflict`). A `hold_id` that is past its `expires_at` is `hold_expired`. A movement past the stage is `movement_stage_invalid`; one that has ended, `movement_closed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key already used with a different payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            The resulting transaction is refused as any posted transaction
            would be: unbalanced (`unbalanced_transaction`), insufficient
            funds (`insufficient_funds`), frozen or closed account
            (`account_inactive`), parent account (`account_not_postable`),
            closed period (`period_closed`), rejected metadata
            (`metadata_*`), or the movement rules: a posting on a transit
            account without a movement (`movement_required`), or a movement
            whose transit would go below zero (`movement_transit_overdrawn`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unbalanced:
                  value:
                    error:
                      code: unbalanced_transaction
                      message: 'domain: transaction is not balanced'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/posting-events/{id}:
    get:
      operationId: getPostingEvent
      tags: [PostingRules]
      summary: Get a posting event
      description: The event with the transaction it booked. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledger-transfers:
    post:
      operationId: createLedgerTransfer
      tags: [LedgerTransfers]
      summary: Create a transfer between ledgers
      description: |
        Moves value between two different ledgers of the tenant. A ledger never
        holds an entry that crosses ledgers, so a transfer is two posted
        transactions, one per ledger, written atomically: both commit or
        neither does. Each side names its `ledger_id`, its `due_account_id`
        (the inter-ledger due-to / due-from account of that ledger) and its
        `postings`, and goes through the normal posting path (balance per
        asset, every posting in its own ledger, periods, metadata allowlist,
        overdraft, account status, hash chain). Both transactions carry
        `transfer_id`.

        The due accounts must eliminate: per asset, the net movement of the
        source due account plus that of the target due account is zero, and
        the source due account must move (422 `transfer_unbalanced`). Both
        sides naming the same ledger, or a posting in the wrong ledger, is
        400 `validation_failed`.

        `idempotency_key` covers the whole transfer: the same key and payload
        replays it (200 + `X-Idempotent-Replay: true`); the same key with
        another payload is 409 `idempotency_conflict`. The key may be sent in
        the body or via the `Idempotency-Key` request header. The two
        transactions get the derived keys `<key>/source` and `<key>/target`;
        if one of those is already held by another transaction the call is
        409 `idempotency_conflict`. Requires `ledger:write`.

        A side may swap the asset it received through a conversion account.
        With `fx` (`quote_id`, `account_id`) the transfer cites an FX quote
        and that conversion account, which belongs to either side; its legs
        across both sides are judged exactly as in a posting group: opposite
        signs and the quote amount equal to the base amount times the rate
        within one minor unit (422 `fx_rate_mismatch`), quote not expired
        (422 `fx_quote_expired`). Without `fx` nothing prices the conversion,
        unless a ledger has `require_fx_quote` on: then a transfer that moves
        more than one asset is refused with 422 `fx_quote_required` when
        either of its ledgers has it (`PUT /v1/ledgers/{id}/fx-policy`). The
        quote is part of the request for idempotency.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerTransferRequest'
            examples:
              parentToSubsidiary:
                summary: Move USD 100.00 from one ledger to another
                value:
                  idempotency_key: xfer-2026-0001
                  reference: xfer-0001
                  source:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    due_account_id: 7a6b2c83-5f70-7192-c3a5-1e3f5a6b7c8d
                    postings:
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 7a6b2c83-5f70-7192-c3a5-1e3f5a6b7c8d
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                  target:
                    ledger_id: 2a1b0c9d-8e7f-7a6b-9c5d-4e3f2a1b0c9d
                    due_account_id: 8b7c3d94-6a81-72a3-d4b6-2f4a6b7c8d9e
                    postings:
                      - account_id: 9c8d4ea5-7b92-73b4-e5c7-3a5b7c8d9eaf
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 8b7c3d94-6a81-72a3-d4b6-2f4a6b7c8d9e
                        direction: CREDIT
                        amount: { asset: USD, amount: '10000' }
      responses:
        '201':
          description: Transfer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransfer'
        '200':
          description: Idempotent replay — the transfer already existed for this idempotency key and payload.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransfer'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The idempotency key was already used with another payload, or a
            derived key (`<key>/source`, `<key>/target`) is held by another
            transaction (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key already used with a different payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            The due accounts do not eliminate (`transfer_unbalanced`), or a
            side is refused as a transaction would be: unbalanced
            (`unbalanced_transaction`), insufficient funds
            (`insufficient_funds`), frozen or closed account
            (`account_inactive`), parent account (`account_not_postable`),
            closed period (`period_closed`), rejected metadata
            (`metadata_*`), a conversion that does not match its quote
            (`fx_rate_mismatch`), an expired quote (`fx_quote_expired`), or
            more than one asset without `fx` in a ledger with
            `require_fx_quote` on (`fx_quote_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                transferUnbalanced:
                  value:
                    error:
                      code: transfer_unbalanced
                      message: 'domain: due accounts do not eliminate'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/ledger-transfers/{id}:
    get:
      operationId: getLedgerTransfer
      tags: [LedgerTransfers]
      summary: Get a transfer between ledgers
      description: The transfer with its two transactions. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransfer'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/movements:
    post:
      operationId: openMovement
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Movements]
      summary: Open a movement
      description: |
        Opens a staged movement (ADR-019): one operation of the tenant in one
        ledger, such as a remittance or a payroll run. It starts in status
        `open`; later steps of this feature move it forward and close it. The
        ledger gives no meaning to `type` (the tenant's own label) or to
        `reference` (the tenant's id for the operation, not unique).

        `idempotency_key` is required: the same key and request replays the
        movement already opened (200 + `X-Idempotent-Replay: true`); the same
        key with another ledger, type, reference, quote or metadata is 409
        `idempotency_conflict`. The key may be sent in the body or via the
        `Idempotency-Key` request header. `metadata` follows the rules and the
        `transaction_keys` allowlist of a transaction's. Requires
        `ledger:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenMovementRequest'
            examples:
              remittance:
                summary: A remittance, keyed by the order
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: order-8841:open
                  type: remittance
                  reference: order-8841
                  metadata:
                    corridor: US-MX
      responses:
        '201':
          description: Movement opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
              examples:
                remittance:
                  value:
                    id: 0199f3a2-6c1e-7b40-9d52-4a8e1c7f3b60
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    type: remittance
                    reference: order-8841
                    status: open
                    fx_quote_id: null
                    opened_at: '2026-10-21T15:04:05Z'
                    last_stage_at: '2026-10-21T15:04:05Z'
                    closed_at: null
                    metadata:
                      corridor: US-MX
        '200':
          description: Idempotent replay — the movement already existed for this idempotency key and request.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The ledger, or the `fx_quote_id`, does not exist in the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The idempotency key was already used with another request (`idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: 'idempotency key reused with a different request payload'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: |
            The metadata is rejected (`metadata_not_scalar`, `metadata_too_large`,
            `metadata_pii_detected`, `metadata_key_not_allowed`; see `Metadata`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listMovements
      tags: [Movements]
      summary: List movements
      description: |
        The tenant's movements, newest first by `opened_at`. Every filter is
        optional and they combine. To find the operations that have been going
        for too long: `status=open&opened_before=<now minus the age>`.
        Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: ledger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: |
            A status, or `open` for every movement that has not ended
            (`open`, `authorized`, `captured` and `dispatched`): a movement
            already authorized is as open as one just opened. `completed`,
            `failed` and `cancelled` match themselves.
          schema:
            $ref: '#/components/schemas/MovementStatus'
        - name: type
          in: query
          schema:
            type: string
        - name: reference
          in: query
          description: Exact match on the tenant's reference.
          schema:
            type: string
        - name: opened_before
          in: query
          description: Only movements opened strictly before this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: opened_after
          in: query
          description: Only movements opened strictly after this instant (RFC 3339).
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of movements, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movement'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/movements/{id}:
    get:
      operationId: getMovement
      tags: [Movements]
      summary: Get a movement
      description: Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/movements/{id}/close:
    post:
      operationId: closeMovement
      tags: [Movements]
      summary: Close a movement
      description: |
        Requires `ledger:write`. Makes the movement terminal with `outcome`
        (ADR-019 §2, §4). `completed` needs the movement to have reached
        `captured`; `failed` and `cancelled` are accepted from any status that
        has not ended. In the same database transaction the close:

        - releases the movement's still-active holds (`ledger.hold.released`
          with `reason: movement_closed`), so no reservation outlives its
          operation;
        - computes the movement's transit per asset and, when it is not zero,
          records it as `transit_residual`. The close is **not refused** for a
          residual: the outcome is a fact. Only writes at stage `correct` can
          bring it back to zero (see `MovementRef`);
        - emits `ledger.movement.closed`, with the residual (empty when none).

        Idempotent by outcome, so it takes no idempotency key: closing again
        with the same outcome returns the movement unchanged; another outcome is
        409 `movement_closed`. A tagged write can also close its movement in the
        same call with `movement.close`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseMovementRequest'
            example:
              outcome: completed
      responses:
        '200':
          description: The movement, closed (or already closed with that outcome).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `movement_closed`: the movement already ended with another outcome.
            `movement_stage_invalid`: `completed` on a movement that never
            reached `captured`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/audit-log:
    get:
      operationId: listAuditLog
      tags: [Audit]
      summary: Read the tenant's audit trail
      description: |
        The privileged actions this service recorded for the tenant (who, what,
        when, with the minimum state before and after), oldest first, filtered
        by date, action and resource. Each entry carries its place in the
        tenant's hash chain (`chain_seq`, `prev_hash`, `entry_hash`; canonical
        form in `docs/audit-log.md`), so a reader can check a page link by link
        or call `GET /v1/audit-log/verify`. Only this service's actions are
        here; identity, webhooks and reconciliation keep their own trails.
        Read-only. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: from
          in: query
          description: Only entries at or after this instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only entries before this instant.
          schema: { type: string, format: date-time }
        - name: action
          in: query
          description: Exact action, e.g. `account.update`.
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, 1 to 200 (default 50).
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque `next_cursor` of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of entries in chain order.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  next_cursor:
                    type: [string, 'null']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token lacks `ledger:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/audit-log/verify:
    get:
      operationId: verifyAuditLog
      tags: [Audit]
      summary: Check the tenant's audit hash chain
      description: |
        Recomputes the whole chain and reports its head and every broken link:
        `seq_gap` (a row is missing or numbers were rewritten), `prev_hash`
        (the row does not link to the one before) and `entry_hash` (its
        contents no longer hash to the stored value). `ok` is true when there
        are none. The check runs inside the database, so a rewrite that also
        re-hashes the rows after it passes; compare `head` with the head
        published by the operator's `anchor-heads` / `audit-verify -anchor`
        to catch that. Read-only; its cost grows with the tenant's trail.
        Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The token lacks `ledger:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [Reports]
      summary: Trial balance
      description: |
        Sums debits and credits per account and asset over posted
        transactions. For a healthy ledger, total debits equal total credits
        per asset.

        With `from` the report becomes a period result: each row sums only
        the movements whose `effective_at` falls in `[from, as_of]`, so a
        September salary does not leak into October. A transaction reversed
        in a later period contributes its original postings to its own period
        and the reversal's postings to the period of the reversal.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: |
            Start of the period (inclusive). With `from`, only postings of
            transactions with `from <= effective_at <= as_of` count; `as_of`
            defaults to now. `from` after `as_of` yields 400
            `validation_failed`. Without `from` the report is cumulative, as
            before.
          schema:
            type: string
            format: date-time
        - name: as_of
          in: query
          description: |
            Compute the balance as of this instant: the report is
            reconstructed by aggregating postings of transactions with
            `effective_at <= as_of` (transactions later reversed still count
            at instants before their reversal's `effective_at`). Without it,
            the report reflects the current running balances. With `from`,
            it is the end of the period.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The trial balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
              examples:
                afterDeposit:
                  summary: Trial balance after the USD 100 deposit
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    as_of: '2026-07-24T12:10:00Z'
                    rows:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        account_name: assets:cash
                        account_type: asset
                        asset: USD
                        debits: '10000'
                        credits: '0'
                        net: '10000'
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        account_name: customer:cust_42:wallet
                        account_type: liability
                        asset: USD
                        debits: '0'
                        credits: '9700'
                        net: '-9700'
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        account_name: revenue:fees
                        account_type: revenue
                        asset: USD
                        debits: '0'
                        credits: '300'
                        net: '-300'
                    totals:
                      - asset: USD
                        debits: '10000'
                        credits: '10000'
                        balanced: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/statements:
    get:
      operationId: getStatement
      tags: [Reports]
      summary: Account statement
      description: |
        Statement of one account over a period: opening balance per asset
        (aggregate of postings with `effective_at` strictly before `from`),
        entries ordered by `effective_at` ascending with a per-asset running
        balance, and the closing balance at `to`. Balances are signed by the
        account's normal balance side, so a funded credit-normal wallet shows
        positive numbers. Reversed transactions keep contributing (their
        compensating transaction appears as its own entry). Entries are
        keyset-paginated; opening/closing always cover the whole period
        regardless of the page.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Period start (inclusive). Defaults to `to` minus 30 days.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Period end (inclusive). Defaults to now.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The account statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
              examples:
                walletStatement:
                  summary: Wallet statement with two deposits in the period
                  value:
                    account:
                      id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                      name: customer:cust_42:wallet
                      type: liability
                      normal_balance: CREDIT
                      status: active
                      allow_negative: false
                      fund_class: customer
                      transit: false
                      postable: true
                      metadata: {}
                      created_at: '2026-05-01T09:00:00Z'
                    period:
                      from: '2026-06-01T00:00:00Z'
                      to: '2026-07-01T00:00:00Z'
                    opening_balance:
                      - asset: USD
                        exponent: 2
                        amount: '14550'
                    entries:
                      - id: 7c2d8e4f-1b3c-7d5e-af61-8a9b0c1d2e3f
                        transaction_id: 3c2d8e4f-1b3c-7d5e-af61-8a9b0c1d2e30
                        reference: dep-2001
                        direction: CREDIT
                        amount: { asset: USD, amount: '1940' }
                        effective_at: '2026-06-01T13:00:00Z'
                        running_balance: '16490'
                      - id: 8d3e9f50-2c4d-7e6f-b072-9b0c1d2e3f40
                        transaction_id: 4d3e9f50-2c4d-7e6f-b072-9b0c1d2e3f41
                        reference: dep-2002
                        direction: CREDIT
                        amount: { asset: USD, amount: '970' }
                        effective_at: '2026-06-01T14:00:00Z'
                        running_balance: '17460'
                    closing_balance:
                      - asset: USD
                        exponent: 2
                        amount: '17460'
                    next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/provider-positions:
    get:
      operationId: listProviderPositions
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Reports]
      summary: Provider (counterparty) positions
      description: |
        Net position against every counterparty (payment provider, bank,
        processor), aggregated from the running `account_balances` of asset-
        and liability-type accounts — never from postings.

        Convention: an account belongs to a provider when its name/path
        contains a `provider` segment followed by the provider name —
        `assets:provider:acmepay:usd` or `liabilities/provider/nordpay/mxn`
        (both `:` and `/` work as separators) — or when the account carries
        `metadata.provider` as an explicit override (it wins over the path).

        `net` is the signed sum of `posted_debits - posted_credits` across
        the provider's accounts per asset: positive means the counterparty
        holds value for us (`they_owe_us`), negative means we owe them
        (`we_owe_them`), zero is `flat`.

        Tenants that do not follow the convention get an empty `data` array
        plus a `hint` explaining how to opt in.
      responses:
        '200':
          description: One entry per provider with per-asset net positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPositions'
              examples:
                twoProviders:
                  summary: Positive position with AcmePay, payable to NordPay
                  value:
                    data:
                      - provider: nordpay
                        positions:
                          - asset: USD
                            exponent: 2
                            net: '-1200'
                            direction: we_owe_them
                            accounts: [9e4f0a61-3d5e-7f80-c193-0c1d2e3f4a51]
                      - provider: acmepay
                        positions:
                          - asset: MXN
                            exponent: 2
                            net: '30000'
                            direction: they_owe_us
                            accounts: [0f5a1b72-4e6f-7081-d2a4-1d2e3f4a5b62]
                          - asset: USD
                            exponent: 2
                            net: '5000'
                            direction: they_owe_us
                            accounts: [1a6b2c83-5f70-7192-e3b5-2e3f4a5b6c73]
                noConvention:
                  summary: Tenant without provider-named accounts
                  value:
                    data: []
                    hint: >-
                      no provider accounts found: name accounts as
                      assets:provider:<name>:... (or
                      liabilities:provider:<name>:...) or set
                      metadata.provider on the account
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    signedRequest:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        **Preferred for integrations (ADR-023).** Sign every request with an API
        credential (`api_key` + `api_secret`, created in the console or with
        `POST /v1/tenants/{id}/api-credentials` on identity). Send four headers:

        | Header | Value |
        | --- | --- |
        | `X-Api-Key` | the public `ak_<env>_...` key id |
        | `X-Timestamp` | unix seconds; must be within 300 s of the server clock |
        | `X-Nonce` | 16-64 chars of `[A-Za-z0-9_-]`, unique per request (kept 600 s) |
        | `X-Signature` | `hex(HMAC-SHA256(api_secret, canonical))` |

        ```
        canonical = "LC1-HMAC-SHA256" \n METHOD \n host \n path \n query \n api_key
                    \n timestamp \n nonce \n idempotency_key \n hex(sha256(body))
        ```

        `host` is the lower-cased `Host` header; `path` and `query` are
        re-encoded (RFC 3986 unreserved characters only, query pairs sorted by
        key then value); `idempotency_key` is the `Idempotency-Key` header or
        empty; `body` is the exact bytes sent (sha256 of the empty string for no
        body). The query is part of the signature. Test vectors:
        `contracts/test-vectors/request-signatures.json`.

        The secret never travels. Credentials are sealed to one environment (a
        `sandbox` credential is refused by production: `environment_mismatch`),
        carry closed scopes, expire, and are checked against the database on
        every request (revocation is immediate). If identity cannot be reached,
        the request is refused with 503, never accepted unverified. Errors:
        `signature_missing`, `signature_invalid`, `timestamp_skew`,
        `nonce_reused`, `credential_expired`, `credential_revoked`,
        `environment_mismatch`, `ip_not_allowed` (the credential has an IP
        allow-list in `enforce` mode and the request came from outside it: 403).
        Never retry with the same `X-Nonce`.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA JWT issued by the identity service (POST /v1/auth/token).

  parameters:
    SignatureApiKey:
      name: X-Api-Key
      in: header
      required: false
      description: Public key id of the API credential. Required (with the other three headers) when the request is signed; see the `signedRequest` scheme.
      schema:
        type: string
        pattern: '^ak_(sandbox|live)_[0-9A-Za-z]{20}$'
    SignatureTimestamp:
      name: X-Timestamp
      in: header
      required: false
      description: Unix seconds, within 300 s of the server clock. Signed requests only.
      schema:
        type: string
        pattern: '^[0-9]+$'
    SignatureNonce:
      name: X-Nonce
      in: header
      required: false
      description: One-use nonce, 16-64 chars of `[A-Za-z0-9_-]`. A repeated nonce is `nonce_reused`. Signed requests only.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16,64}$'
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page's `next_cursor`. A
        malformed cursor yields 400 `invalid_cursor`.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
        Query strings are as strict as bodies: a query parameter the endpoint
        does not declare is `validation_failed` and the message names it
        (`unknown query parameter "from" (accepted: ...)`), instead of being ignored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                error:
                  code: validation_failed
                  message: 'unknown field "amonut"'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            unknownQueryParameter:
              value:
                error:
                  code: validation_failed
                  message: 'unknown query parameter "metadata.order_id" (accepted: asset, cursor, limit)'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: token is invalid or expired
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    NotFound:
      description: The resource does not exist within this tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: resource not found
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    NotImplemented:
      description: Declared stub for a future milestone (`not_implemented`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stub:
              value:
                error:
                  code: not_implemented
                  message: GET /v1/statements is not implemented yet; it is planned for a future milestone
    MovementRejected:
      description: |
        Posting would leave an account with `allow_negative: false` below zero
        available (`insufficient_funds`), touches a frozen or closed account
        (`account_inactive`), or its `effective_at` falls in a closed
        accounting period (`period_closed`). A write under a staged movement
        can also be refused with `movement_required` (a posting on a transit
        account needs a transaction that names a movement) or
        `movement_transit_overdrawn` (it would take the movement's transit
        below zero).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficientFunds:
              value:
                error:
                  code: insufficient_funds
                  message: 'domain: available balance would go negative: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e would have available -300 USD'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            accountInactive:
              value:
                error:
                  code: account_inactive
                  message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            periodClosed:
              value:
                error:
                  code: period_closed
                  message: 'domain: accounting period is closed: period 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d (2026-09) is hard_closed'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    MetadataRejected:
      description: |
        The metadata is rejected. The message names the key (unless the key
        itself looks like personal data) and never the value.

        - `metadata_not_scalar`: a value is an object, an array or null.
        - `metadata_too_large`: more than 50 keys, a key of 0 or more than
          64 bytes, or a value of more than 500 bytes.
        - `metadata_pii_detected`: a key or value looks like an email, a card
          number, a phone number or an IBAN, in every ledger. A UUID is never
          read as personal data.
        - `metadata_key_not_allowed`: the key is outside the ledger's
          allowlist (`PUT /v1/ledgers/{id}/metadata-policy`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            keyNotAllowed:
              value:
                error:
                  code: metadata_key_not_allowed
                  message: 'domain: metadata key is not allowed in this ledger: key "channel"'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            pii:
              value:
                error:
                  code: metadata_pii_detected
                  message: 'domain: metadata looks like personal data: the value of key "note" looks like a card number'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Conflict:
      description: |
        Uniqueness conflict (`conflict`). A write that names a staged movement
        can also be refused with `movement_stage_invalid` (the movement is past
        that stage) or `movement_closed` (it has ended).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                error:
                  code: conflict
                  message: a resource with that name already exists
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, account_inactive,
                account_not_postable, parent_account_has_activity,
                period_closed, fx_quote_expired, fx_rate_mismatch,
                fx_quote_required, transfer_unbalanced, approval_required, self_approval,
                movement_stage_invalid, movement_closed, movement_required,
                movement_transit_overdrawn,
                request_hash_mismatch, hold_expired, metadata_not_scalar,
                metadata_too_large,
                metadata_pii_detected, metadata_key_not_allowed,
                rate_limited,
                service_unavailable, internal,
                signature_missing, signature_invalid, timestamp_skew, nonce_reused,
                credential_expired, credential_revoked, environment_mismatch,
                ip_not_allowed, legacy_credential_retired.
            message:
              type: string
              description: Human-readable explanation. Never parse this.
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).

    AssetCode:
      type: string
      pattern: '^[A-Z0-9]{1,12}$'
      description: Asset code registered in the ledger asset registry (e.g. USD, BTC, USDC).
      examples: [USD]

    Money:
      type: object
      required: [asset, amount]
      additionalProperties: false
      description: |
        Integer amount in minor units, string-encoded so int64 values survive
        JSON round trips. The exponent lives in the asset registry.
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        amount:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: int64 in minor units, string-encoded (e.g. "10000" = USD 100.00).
      examples:
        - asset: USD
          amount: '10000'

    Direction:
      type: string
      enum: [DEBIT, CREDIT]

    TransactionStatus:
      type: string
      enum: [draft, posted, reversed, discarded]
      description: |
        `draft` and `discarded` rows are staging, not financial facts: only
        `posted` and `reversed` carry a journal number and enter the hash
        chain. `discarded` is terminal (a draft that was abandoned with
        `POST /v1/transactions/{id}/discard`).

    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]

    AccountStatus:
      type: string
      enum: [active, frozen, closed]
      description: |
        Only `active` accounts accept movements. A transaction (created,
        posted from draft or reversed) or a hold that touches a `frozen` or
        `closed` account fails with 422 `account_inactive`. Changed with
        `PATCH /v1/accounts/{id}`: `active` and `frozen` move freely into each
        other; `closed` is final and requires an empty account. A `frozen`
        account may refuse only some postings (`freeze_mode`: `debits` refuses
        DEBIT postings and accepts CREDIT ones, `credits` the opposite; `all`
        refuses everything); see `POST /v1/accounts/{id}/freeze`.

    HoldStatus:
      type: string
      enum: [active, captured, released, expired]
      description: |
        `active` reserves funds; `captured`, `released` and `expired` are
        terminal. The sweeper moves an active hold past `expires_at` to
        `expired` (ADR-016).

    Metadata:
      type: object
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 64
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
      description: |
        Flat key/value pairs attached by the tenant. Values must be scalars:
        strings, numbers or booleans (objects, arrays and null are 422
        `metadata_not_scalar`). Numbers and booleans are stored and returned
        as their JSON text (`10.50` -> `"10.50"`, `true` -> `"true"`), so
        responses always carry strings. Keys or values that look like an
        email, a card number (Luhn), a phone number (`+` and 8-15 digits) or
        an IBAN (mod 97) are rejected in every ledger (422
        `metadata_pii_detected`); a ledger's `metadata_policy` can restrict
        the keys too. See docs/metadata-y-cobertura.md.

    LedgerCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'

    Ledger:
      type: object
      required: [id, name, environment, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
          enum: [sandbox, live]
          description: Taken from the `env` claim of the creating token; not client-settable.
        metadata:
          $ref: '#/components/schemas/Metadata'
        metadata_policy:
          $ref: '#/components/schemas/MetadataPolicy'
        require_fx_quote:
          type: boolean
          description: |
            Whether a transaction in more than one asset, and a transfer between
            ledgers that moves more than one, needs an FX quote (false by
            default; `PUT /v1/ledgers/{id}/fx-policy`).
        loss_allocation:
          description: |
            How a provider's loss is shared (`PUT /v1/ledgers/{id}/custody-policy`).
            `null` until configured: there is no default.
          oneOf:
            - $ref: '#/components/schemas/LossAllocation'
            - type: 'null'
        created_at:
          type: string
          format: date-time

    CustodyPolicy:
      type: object
      required: [loss_allocation]
      additionalProperties: false
      properties:
        loss_allocation:
          $ref: '#/components/schemas/LossAllocation'

    LossAllocation:
      type: string
      enum: [pro_rata_pool, by_provider]
      description: |
        How a provider's loss is shared among the holders (ADR-020 §6).
        `pro_rata_pool`: over every holder's balance. `by_provider`: on the
        holders whose money sat at the provider.

    ProviderExposure:
      type: object
      required: [ledger_id, loss_allocation, backed, breaks, data]
      properties:
        ledger_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
          description: Present when the report was asked with `as_of`.
        loss_allocation:
          description: The ledger's rule today; `null` while never configured.
          oneOf:
            - $ref: '#/components/schemas/LossAllocation'
            - type: 'null'
        backed:
          type: boolean
          description: true when `breaks` is empty.
        breaks:
          type: array
          items:
            type: object
            required: [kind, asset, exponent, amount]
            properties:
              kind:
                type: string
                enum: [ledger_shortfall, negative_custody]
              provider:
                type: string
                description: Absent for `ledger_shortfall`.
              asset:
                type: string
              exponent:
                type: integer
              amount:
                type: string
                description: What is missing, minor units, always positive.
        data:
          type: array
          items:
            type: object
            required: [provider, asset, exponent, custody, claims, own, payable]
            properties:
              provider:
                type: string
              asset:
                type: string
              exponent:
                type: integer
              custody:
                type: string
                description: Customer money physically at the provider (minor units; negative is a break).
              claims:
                type: string
                description: Customer-class claims on the provider. Never backing.
              own:
                type: string
                description: The platform's own money at the provider.
              payable:
                type: string
                description: What the platform owes the provider.

    ExposureMatrix:
      type: object
      required: [ledger_id, loss_allocation, data]
      properties:
        ledger_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
        loss_allocation:
          $ref: '#/components/schemas/LossAllocation'
        data:
          type: array
          items:
            type: object
            required: [holder, asset, exponent, balance, shares, unplaced]
            properties:
              holder:
                type: string
                description: '`""` for customer liabilities that name no holder.'
              asset:
                type: string
              exponent:
                type: integer
              balance:
                type: string
                description: What the platform owes the holder in the asset (minor units).
              shares:
                type: array
                description: The balance spread over the providers; adds up to `balance - unplaced`.
                items:
                  type: object
                  required: [provider, amount]
                  properties:
                    provider:
                      type: string
                    amount:
                      type: string
              unplaced:
                type: string
                description: The part no provider custody backs.

    FXPolicy:
      type: object
      required: [require_fx_quote]
      additionalProperties: false
      properties:
        require_fx_quote:
          type: boolean
          description: |
            true: refuse (422 `fx_quote_required`) a transaction in more than
            one asset, and a transfer between ledgers that moves more than one
            without `fx`. false: accept them, as before.

    MetadataPolicy:
      type: object
      additionalProperties: false
      description: |
        The ledger's metadata allowlists. `null` (the default for every
        ledger): no allowlist, any key accepted. An empty list accepts no
        key. Keys come back sorted and without duplicates.
      properties:
        transaction_keys:
          type: [array, 'null']
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Keys accepted on new transactions, holds and movements.
        account_keys:
          type: [array, 'null']
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Keys accepted on new accounts.

    Liquidity:
      type: string
      enum: [liquid, claim]
      description: |
        Whether a customer `asset` account is cash that can back what is owed
        now (`liquid`) or a claim that may take years to collect (`claim`).
        Only `asset` accounts may be `claim`; any other type is refused with
        400. Defaults to `liquid`; accounts that existed before this field are
        `liquid`, so nothing that backed customers stops backing them until an
        operator marks an account `claim`.

    FundClass:
      type: string
      enum: [customer, own]
      description: |
        Whose money the account holds: `customer` (held for or owed to
        customers) or `own` (the operator's money). Only `asset` and
        `liability` accounts enter the coverage report
        (`GET /v1/ledgers/{id}/coverage`). Defaults to `customer` for
        `liability` accounts and `own` for every other type; accounts that
        existed before this field got the same default.

    Coverage:
      type: object
      required: [ledger_id, covered, data]
      properties:
        ledger_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
          description: Present when the report was asked with `as_of`.
        covered:
          type: boolean
          description: True when every asset is covered.
        data:
          type: array
          items:
            $ref: '#/components/schemas/CoverageRow'

    CoverageRow:
      type: object
      required: [asset, exponent, customer_assets, customer_claims, customer_liabilities, customer_receivables, negative_accounts, covered, shortfall]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
        customer_assets:
          type: string
          description: Posted debits - credits of the customer-class asset accounts with liquidity liquid, minor units.
        customer_claims:
          type: string
          description: Posted debits - credits of the customer-class asset accounts with liquidity claim, minor units. Reported apart; not backing.
        customer_liabilities:
          type: string
          description: Sum of the positive posted balances (credits - debits) of the customer-class liability accounts, minor units. Accounts in the red do not subtract from it.
        customer_receivables:
          type: string
          description: Sum of the negative posted balances of the customer-class liability accounts, as a positive number, minor units. What those customers owe the platform; not backing.
        negative_accounts:
          type: integer
          description: How many customer-class liability accounts have a negative posted balance in this asset.
        covered:
          type: boolean
          description: customer_assets >= customer_liabilities.
        shortfall:
          type: string
          description: customer_liabilities - customer_assets when not covered, "0" otherwise.

    CoverageSnapshotCreate:
      type: object
      required: [as_of]
      additionalProperties: false
      properties:
        as_of:
          type: string
          format: date-time
          description: Instant the report is taken at; not in the future.

    AuditEntry:
      type: object
      required: [id, occurred_at, tenant_id, actor, action, resource_type, resource_id, chain_seq, prev_hash, entry_hash]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid }
        actor:
          type: string
          description: '`api_key:<id>`, `admin`, `operator` or `system`.'
        action: { type: string, example: account.update }
        resource_type: { type: string }
        resource_id: { type: string }
        before:
          type: object
          additionalProperties: true
          description: State before the action; absent when there was none. Never secrets or PII.
        after:
          type: object
          additionalProperties: true
          description: State after the action; absent when the resource is gone.
        request_id: { type: string }
        chain_seq:
          type: integer
          format: int64
          description: Gap-free position in the tenant's chain, from 1.
        prev_hash:
          type: string
          description: '`entry_hash` of the entry before, in hex; 64 zeros for the first.'
        entry_hash:
          type: string
          description: SHA-256, in hex, of the entry's canonical form (`docs/audit-log.md`).
    AuditChainVerification:
      type: object
      required: [ok, head, breaks]
      properties:
        ok: { type: boolean }
        head:
          type: object
          required: [chain_seq, entry_hash, occurred_at]
          properties:
            chain_seq: { type: integer, format: int64, description: 0 for an empty trail. }
            entry_hash: { type: string, description: 64 zeros for an empty trail. }
            occurred_at: { type: [string, 'null'], format: date-time }
        breaks:
          type: array
          items:
            type: object
            required: [chain_seq, problem, stored, expected]
            properties:
              chain_seq: { type: integer, format: int64 }
              problem: { type: string, enum: [seq_gap, prev_hash, entry_hash] }
              stored: { type: string, description: 'Hex hash, or the stored position for `seq_gap`.' }
              expected: { type: string, description: 'Hex hash, or the expected position for `seq_gap`.' }
    CoverageSnapshot:
      type: object
      required: [id, ledger_id, as_of, taken_at, taken_by, snapshot_hash, covered, data]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
        taken_at:
          type: string
          format: date-time
          description: When the snapshot was written.
        taken_by:
          type: string
          description: The actor, e.g. `api_key:<id>`.
        snapshot_hash:
          type: string
          description: SHA-256 (hex) of the canonical report, `ledgercore.coverage.v2`. Published by the daily anchor.
        covered:
          type: boolean
          description: True when every asset is covered.
        data:
          type: array
          description: The rows of `Coverage`, as they were at `as_of`.
          items:
            $ref: '#/components/schemas/CoverageRow'

    AccountCreate:
      type: object
      required: [ledger_id, name, type, normal_balance]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Unique within the ledger, and its place in the account tree: `:`
            separates levels, so `assets:cash:usd` is a child of `assets:cash`
            and of `assets` (other characters, such as `/`, are part of the
            name). Intermediate levels need not exist. An account with
            children is a non-postable parent; creating a child under an
            account that has postings or active holds fails with 422
            `parent_account_has_activity`.
        type:
          $ref: '#/components/schemas/AccountType'
        normal_balance:
          $ref: '#/components/schemas/Direction'
        allow_negative:
          type: boolean
          description: |
            Whether a posting may leave this account's available balance
            (posted net minus active holds, signed by `normal_balance`) below
            zero. When `false`, such a posting fails with 422
            `insufficient_funds`. Defaults to `false` for `liability` accounts
            (customer wallets: money the ledger owes) and `true` for every
            other type, which routinely carry contra balances. Accounts that
            existed before this field are `true`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        liquidity:
          $ref: '#/components/schemas/Liquidity'
        transit:
          type: boolean
          default: false
          description: |
            Marks a transit account (ADR-019): the account whose postings make
            up the transit of the movements that tag them. Set here and never
            changed afterwards. A posting on a transit account needs a
            transaction that names a movement (422 `movement_required`), and a
            tagged write cannot take the movement's transit below zero (422
            `movement_transit_overdrawn`): the transit of a movement is derived
            from its postings on transit accounts, each signed by the account's
            normal balance, so the balance of a transit account is always the
            sum of the transits of its movements.
        metadata:
          $ref: '#/components/schemas/Metadata'

    FreezeMode:
      type: string
      enum: [all, debits, credits]
      description: |
        Which postings a frozen account refuses, read against the direction of
        each posting: `all` refuses every posting, `debits` refuses DEBIT
        postings and accepts CREDIT ones, `credits` the opposite.

    AccountFreeze:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/FreezeMode'
        reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: Why the subtree is frozen (400 when missing or blank).
        case_ref:
          type: string
          maxLength: 128
          description: Optional case or ticket number of the compliance case.

    AccountUnfreeze:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: Why the subtree is unfrozen (400 when missing or blank).
        case_ref:
          type: string
          maxLength: 128
          description: Optional case or ticket number of the compliance case.

    AccountSubtree:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Every account of the subtree after the change, in no particular order.
          items:
            $ref: '#/components/schemas/Account'

    AccountUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Fields to change; at least one. Omitted fields keep their value.
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
        allow_negative:
          type: boolean
          description: Overdraft policy; see `AccountCreate.allow_negative`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        liquidity:
          $ref: '#/components/schemas/Liquidity'

    Account:
      type: object
      required: [id, ledger_id, name, type, normal_balance, status, allow_negative, fund_class, liquidity, transit, postable, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        normal_balance:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/AccountStatus'
        allow_negative:
          type: boolean
          description: Overdraft policy; see `AccountCreate.allow_negative`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        liquidity:
          $ref: '#/components/schemas/Liquidity'
        freeze_mode:
          $ref: '#/components/schemas/FreezeMode'
        freeze_reason:
          type: string
          description: Why the account is frozen. Present only while it is frozen, and absent after a bare `PATCH`.
        freeze_case_ref:
          type: string
          description: Case or ticket number given when it was frozen, if any. Present only while it is frozen.
        transit:
          type: boolean
          description: Whether this is a transit account; see `AccountCreate.transit`.
        postable:
          type: boolean
          readOnly: true
          description: |
            False when other accounts live under this one's name (it is a
            parent). Derived on every read, never stored. A parent rejects
            transactions and holds with 422 `account_not_postable`; its
            balances are the sum of its subtree.
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time

    Balance:
      type: object
      required: [asset, exponent, posted, pending, available, held, posted_debits, posted_credits, version]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
          minimum: 0
          maximum: 18
          description: Decimal places of the asset (registry value), for display.
        posted:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Net posted balance in minor units, signed by normal_balance.
        pending:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        available:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        held:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Sum of active holds against the account, in minor units.
        posted_debits:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Gross posted debits, unsigned by normal_balance.
        posted_credits:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Gross posted credits, unsigned by normal_balance.
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version of the balance row; increases with every posting.

    Posting:
      type: object
      required: [account_id, direction, amount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server; present in responses only.
        account_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'

    Entry:
      type: object
      required: [id, transaction_id, account_id, direction, amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time

    TransactionCreate:
      type: object
      required: [ledger_id, postings]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Unique per tenant. Retries with the same key return the original
            transaction (200 + `X-Idempotent-Replay: true`). Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        status:
          type: string
          enum: [draft, posted]
          default: posted
          description: Create as draft to post later, or post atomically (default).
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance per asset (sum of debits == sum of credits).
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        metadata:
          $ref: '#/components/schemas/Metadata'
        hold_id:
          type: string
          format: uuid
          description: |
            An active hold this payment settles (only with `status: posted`).
            In the same database transaction the hold is captured and linked
            (the hold's `transaction_id`), its reservation is released and only
            then is the overdraft policy checked — so the payment may spend
            the funds the hold set aside, and nobody else can in between. The
            transaction must lower the held account in the held asset; the
            captured amount is that decrease, capped at the hold, and any
            remainder is released. Emits `ledger.hold.captured` and writes the
            same `hold.capture` audit row as `POST /v1/holds/{id}/capture`. A
            hold that is not active is 409 `conflict`; one past `expires_at` is 409
            `hold_expired` (ADR-016). Part of the idempotency fingerprint.

            For short authorizations (a card, a checkout) only: a payout already
            sent to a bank should not wait on a hold, which expires and frees the
            funds — book it through `liabilities:payouts_in_flight:<provider>`
            instead (`docs/payouts-en-vuelo.md`).
        adjusts_period_id:
          type: string
          format: uuid
          description: |
            Makes this transaction an adjustment of that accounting period of
            the same ledger, which must be `soft_closed` or `hard_closed`; the
            adjustment cannot be dated before the period starts. A
            `soft_closed` period accepts only adjustments of itself; a
            `hard_closed` one accepts nothing, so it is corrected by an
            adjustment dated in an open period. Covered by the journal hash
            and part of the idempotency fingerprint. 404 when the period does
            not exist in the ledger; 400 `validation_failed` when it is open
            or starts after `effective_at`.

            An adjustment is only written by executing an approved adjustment
            request (`POST /v1/adjustment-requests`): sent here, a valid
            adjustment is refused with 422 `approval_required`. An adjustment
            is never a draft: with `status: draft` it is 400
            `validation_failed` (ADR-009).
        frozen_override:
          $ref: '#/components/schemas/FrozenOverride'
        movement:
          allOf:
            - $ref: '#/components/schemas/MovementRef'
          description: |
            Writes the transaction as a stage of a staged movement (ADR-019);
            only with `status: posted` (a draft cannot name one). Before
            anything else the movement's row is locked, so the stages of one
            movement serialize, and the write is judged against its status in
            the same database transaction: `authorize`, `capture` and
            `dispatch` are accepted while the movement has not passed that
            stage and move its status forward (skipping is allowed, going back
            is 409 `movement_stage_invalid`); `complete` and `fail` are
            accepted at any time and do not move it. A movement that ended is
            409 `movement_closed`, but a replay of a write accepted earlier
            returns its stored response whatever the status. The movement must
            be in the transaction's ledger (400), and a hold named by `hold_id`
            must belong to it.

            When the write ends, the movement's transit in every asset must not
            have gone below zero (422 `movement_transit_overdrawn`): paying out
            or booking revenue for more than was captured is refused at the
            write that does it. Stored on the transaction, covered by the
            journal hash (canonical form v6) and part of the idempotency
            fingerprint.

    FrozenOverride:
      type: object
      required: [reason]
      additionalProperties: false
      description: |
        Records a movement on `frozen` accounts that the platform must book
        whatever the customer does. Needs the `ledger:frozen_override` scope
        (403 without it; no default key has it). It relaxes `frozen` only, on
        the accounts the request touches: a `closed` account is still
        `account_inactive`, and balance, overdraft, period and metadata rules
        and the hash chain apply as always. Only for `status: posted`
        transactions and reversals; posting groups, posting events, ledger
        transfers and holds do not accept it. When it relaxed at least one
        frozen account it writes a `transaction.frozen_override` audit row
        (actor, frozen accounts, reason) in the same database transaction;
        a replay writes none. Part of the idempotency fingerprint.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: Why the movement is recorded on a frozen account (400 when missing or blank).
          examples: ['Bank paid payout po_42 on 2026-10-21']

    Transaction:
      type: object
      required: [id, ledger_id, idempotency_key, status, postings, metadata, reversed_by, reverses, effective_at, created_at, posted_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Free-form external reference; omitted when empty.
        description:
          type: string
        status:
          $ref: '#/components/schemas/TransactionStatus'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        metadata:
          $ref: '#/components/schemas/Metadata'
        reversed_by:
          type: [string, 'null']
          format: uuid
          description: Id of the reversal transaction, when this one was reversed.
        reverses:
          type: [string, 'null']
          format: uuid
          description: Id of the original transaction, when this one is a reversal.
        adjusts_period_id:
          type: [string, 'null']
          format: uuid
          description: Id of the accounting period this transaction adjusts, when it is an adjustment.
        posting_group_id:
          type: [string, 'null']
          format: uuid
          description: Id of the posting group this transaction belongs to; null for a standalone transaction.
        posting_rule_id:
          type: [string, 'null']
          format: uuid
          description: Id of the posting rule version this transaction was booked through; null when it was not booked from an event.
        transfer_id:
          type: [string, 'null']
          format: uuid
          description: Id of the ledger transfer this transaction is one side of; null for a standalone transaction.
        movement:
          oneOf:
            - $ref: '#/components/schemas/MovementRef'
            - type: 'null'
          description: The staged movement and stage this transaction was written under (ADR-019); null when it names none.
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        created_at:
          type: string
          format: date-time
        posted_at:
          type: [string, 'null']
          format: date-time

    PeriodStatus:
      type: string
      enum: [open, soft_closed, hard_closed]

    PeriodCreate:
      type: object
      required: [ledger_id, name, starts_at, ends_at]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at:
          type: string
          format: date-time
          description: Inclusive start. Must equal the ledger's last period `ends_at`, if any.
        ends_at:
          type: string
          format: date-time
          description: Exclusive end; after `starts_at`.

    PeriodUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PeriodStatus'

    Period:
      type: object
      required: [id, ledger_id, name, starts_at, ends_at, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PeriodStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdjustmentStatus:
      type: string
      enum: [pending, approved, executed, rejected, cancelled]

    AdjustmentRequestCreate:
      type: object
      required: [ledger_id, effective_at, postings]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Required; may come in the `Idempotency-Key` header instead.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Required — the date is part of what is approved.
        adjusts_period_id:
          type: string
          format: uuid
          description: |
            The closed period this adjustment corrects (same rules as on
            `TransactionCreate`). Optional: a request without it executes as a
            regular entry that still went through four eyes.
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance per asset.
        metadata:
          $ref: '#/components/schemas/Metadata'

    AdjustmentApproval:
      type: object
      required: [approver, request_hash, approved_at]
      properties:
        approver:
          type: string
          description: Identity that approved (e.g. `api_key:<id>`).
        request_hash:
          type: string
          description: The hash approved, hex-encoded.
        approved_at:
          type: string
          format: date-time

    AdjustmentRequest:
      type: object
      required: [id, ledger_id, idempotency_key, status, request_hash, maker, effective_at, adjusts_period_id, metadata, postings, approvals, transaction_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        status:
          $ref: '#/components/schemas/AdjustmentStatus'
        request_hash:
          type: string
          description: SHA-256 of the canonical form of the request, hex-encoded. Approvers send it back to approve.
        maker:
          type: string
          description: Identity that created the request (e.g. `api_key:<id>`).
        reference:
          type: string
        description:
          type: string
        effective_at:
          type: string
          format: date-time
        adjusts_period_id:
          type: [string, 'null']
          format: uuid
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentApproval'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: The transaction written by the execution, once `executed`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldCreate:
      type: object
      required: [account_id, idempotency_key, amount]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
          description: Optional; derived from the account when omitted.
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
          description: When the hold auto-releases; defaults to 7 days.
        metadata:
          $ref: '#/components/schemas/Metadata'
        movement:
          allOf:
            - $ref: '#/components/schemas/MovementRef'
          description: |
            Creates the hold as a stage of a staged movement (ADR-019): the
            usual stage is `authorize` for a holder's reservation, or
            `dispatch` for the liquidity set aside for a payout. Judged like a
            transaction's `movement`; part of the idempotency fingerprint.

    ProviderHoldCreate:
      type: object
      required: [idempotency_key, amount]
      additionalProperties: false
      description: |
        `HoldCreate` without `account_id` and `ledger_id`: the route names the
        ledger and the provider, and the ledger picks the custody account.
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
          description: When the hold auto-releases; defaults to 7 days.
        metadata:
          $ref: '#/components/schemas/Metadata'
        movement:
          allOf:
            - $ref: '#/components/schemas/MovementRef'
          description: Usually stage `dispatch` (ADR-019).

    Hold:
      type: object
      required: [id, ledger_id, account_id, idempotency_key, amount, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/HoldStatus'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: The transaction created on capture; null otherwise.
        movement:
          oneOf:
            - $ref: '#/components/schemas/MovementRef'
            - type: 'null'
          description: The staged movement and stage the hold was created under (ADR-019); null when it names none.
        expires_at:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time

    FXQuote:
      type: object
      required: [id, base_asset, quote_asset, rate, source, quoted_at, expires_at, created_at]
      description: Immutable rate between two assets (1 unit of `base_asset` = `rate` units of `quote_asset`, in major units).
      properties:
        id:
          type: string
          format: uuid
        base_asset:
          $ref: '#/components/schemas/AssetCode'
        quote_asset:
          $ref: '#/components/schemas/AssetCode'
        rate:
          type: string
          pattern: '^[0-9]{1,20}(\.[0-9]{1,18})?$'
          description: Positive decimal string, never a float.
        source:
          type: string
        quoted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateFXQuoteRequest:
      type: object
      required: [base_asset, quote_asset, rate, source, expires_at]
      additionalProperties: false
      properties:
        base_asset:
          $ref: '#/components/schemas/AssetCode'
        quote_asset:
          $ref: '#/components/schemas/AssetCode'
        rate:
          type: string
          pattern: '^[0-9]{1,20}(\.[0-9]{1,18})?$'
          description: |
            1 unit of `base_asset` is `rate` units of `quote_asset`, in major
            units. Greater than zero, at most 18 fractional digits.
        source:
          type: string
          minLength: 1
          maxLength: 64
          description: Short label of where the rate comes from (e.g. `ecb`, `desk`).
        quoted_at:
          type: string
          format: date-time
          description: When the rate was observed; defaults to the creation time.
        expires_at:
          type: string
          format: date-time
          description: After this instant no new posting group can cite the quote. Must be after `quoted_at`.

    GroupFX:
      type: object
      required: [quote_id, account_id]
      additionalProperties: false
      description: The quote that prices a posting group or a transfer between ledgers, and the conversion account whose legs are checked against it.
      properties:
        quote_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid

    GroupTransaction:
      type: object
      required: [postings]
      additionalProperties: false
      description: A member of a posting group. It is always posted and must hold a single asset.
      properties:
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance in its single asset.

    CreatePostingGroupRequest:
      type: object
      required: [ledger_id, transactions]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: |
            Unique per tenant and covers the whole group. Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date shared by every member; defaults to creation time.
        fx:
          $ref: '#/components/schemas/GroupFX'
        movement:
          allOf:
            - $ref: '#/components/schemas/MovementRef'
          description: |
            Writes every member under the movement and stage (ADR-019); the
            members commit at the same instant, so the movement's transit is
            judged once, after the last of them. Part of the idempotency
            fingerprint.
        transactions:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/GroupTransaction'

    PostingGroup:
      type: object
      required: [id, ledger_id, idempotency_key, fx, transactions, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Omitted when empty.
        description:
          type: string
          description: Omitted when empty.
        fx:
          oneOf:
            - $ref: '#/components/schemas/GroupFX'
            - type: 'null'
          description: The quote and conversion account the group cites; null when it cites none.
        movement:
          oneOf:
            - $ref: '#/components/schemas/MovementRef'
            - type: 'null'
          description: The staged movement and stage every member was written under (ADR-019); null when it names none.
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        created_at:
          type: string
          format: date-time

    RuleLine:
      type: object
      required: [direction, amount]
      additionalProperties: false
      description: One line template of a posting rule. Exactly one of `account_id` and `account`.
      properties:
        account_id:
          type: string
          format: uuid
          description: Fixed account this line always posts to.
        account:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: Account role; the event supplies the account in `accounts`.
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: Name of one of the event's `amounts`.
        asset:
          $ref: '#/components/schemas/AssetCode'

    PostingRule:
      type: object
      required: [id, ledger_id, event_type, version, lines, rule_hash, created_at]
      description: An immutable version of the mapping from a canonical event type to transaction lines.
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        version:
          type: integer
          minimum: 1
          description: Per ledger and event type, starting at 1.
        description:
          type: string
          description: Omitted when empty.
        lines:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuleLine'
        rule_hash:
          type: string
          description: Hex SHA-256 of the rule's event type and lines.
          examples: ['9c1e0b7a4d2f58163ab07c94e5d1f2a83b6c4d7e0f19a2b35c8d6e7f40a1b2c3']
        created_at:
          type: string
          format: date-time

    CreatePostingRuleRequest:
      type: object
      required: [ledger_id, event_type, lines]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        description:
          type: string
          maxLength: 1024
        lines:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuleLine'
          description: At least one DEBIT and one CREDIT line.

    CreatePostingEventRequest:
      type: object
      required: [ledger_id, event_type, amounts]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: |
            Unique per tenant. Required, but it may be supplied via the
            `Idempotency-Key` request header instead of this field; the body
            field wins when both are present.
        rule_version:
          type: integer
          minimum: 0
          description: Version of the rule to apply; 0 or omitted means the latest.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        metadata:
          $ref: '#/components/schemas/Metadata'
        asset:
          $ref: '#/components/schemas/AssetCode'
        amounts:
          type: object
          additionalProperties:
            type: string
            pattern: '^[0-9]+$'
          description: Amount name to string-encoded integer in minor units. Must hold exactly the names the rule uses; 0 skips that amount's lines.
        accounts:
          type: object
          additionalProperties:
            type: string
            format: uuid
          description: Account role to account id. Must hold exactly the roles the rule uses.
        hold_id:
          type: string
          format: uuid
          description: |
            An active hold the event settles. The rule's transaction is booked
            with `hold_id` as on `POST /v1/transactions`: the hold is captured
            and linked in the same database transaction, so the posting may
            spend the funds it reserves. The rule must lower the held account
            in the held asset. The hold is part of the idempotency payload: a
            replay must repeat it, and the same key with another hold is 409
            `idempotency_conflict`. A hold past `expires_at` is 409 `hold_expired`.
        movement:
          allOf:
            - $ref: '#/components/schemas/MovementRef'
          description: |
            Books the event as a stage of a staged movement (ADR-019), judged
            like a transaction's `movement`. Without `rule_version`, the rule
            applied is the latest version that existed when the movement was
            opened: a rule published while the movement is open does not change
            how it completes, so a long-lived operation closes with the rule it
            started with. An event type that had no rule then is 404, unless
            the event names a version. Part of the idempotency fingerprint.

    PostingEvent:
      type: object
      required: [id, ledger_id, event_type, idempotency_key, rule_id, rule_version, amounts, accounts, transaction, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        event_type:
          type: string
        idempotency_key:
          type: string
        rule_id:
          type: string
          format: uuid
          description: The rule version that was applied.
        rule_version:
          type: integer
          minimum: 1
        asset:
          $ref: '#/components/schemas/AssetCode'
        amounts:
          type: object
          additionalProperties:
            type: string
          description: Amount name to string-encoded integer in minor units.
        accounts:
          type: object
          additionalProperties:
            type: string
            format: uuid
          description: Account role to account id; empty when the rule uses only fixed accounts.
        movement:
          oneOf:
            - $ref: '#/components/schemas/MovementRef'
            - type: 'null'
          description: The staged movement and stage the event was booked under (ADR-019); null when it names none. Same as `transaction.movement`.
        transaction:
          $ref: '#/components/schemas/Transaction'
        created_at:
          type: string
          format: date-time

    TransferSideRequest:
      type: object
      required: [ledger_id, due_account_id, postings]
      additionalProperties: false
      description: One side of a transfer between ledgers. It is always posted, in its own ledger.
      properties:
        ledger_id:
          type: string
          format: uuid
          description: Ledger this side posts to. The two sides must name different ledgers.
        due_account_id:
          type: string
          format: uuid
          description: The inter-ledger due-to / due-from account of `ledger_id`.
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Every posting must be on an account of `ledger_id`; must balance per asset.

    CreateLedgerTransferRequest:
      type: object
      required: [source, target]
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: |
            Unique per tenant and covers the whole transfer. Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date shared by both transactions; defaults to creation time.
        source:
          $ref: '#/components/schemas/TransferSideRequest'
        target:
          $ref: '#/components/schemas/TransferSideRequest'
        fx:
          $ref: '#/components/schemas/GroupFX'

    TransferSide:
      type: object
      required: [ledger_id, due_account_id, transaction]
      description: One side of a transfer between ledgers.
      properties:
        ledger_id:
          type: string
          format: uuid
        due_account_id:
          type: string
          format: uuid
        transaction:
          $ref: '#/components/schemas/Transaction'

    MovementStatus:
      type: string
      enum: [open, authorized, captured, dispatched, completed, failed, cancelled]
      description: |
        Where a movement stands. It starts at `open` and only moves forward
        (`authorized`, `captured`, `dispatched`; a stage may be skipped) to one
        of the terminal statuses `completed`, `failed` or `cancelled`. Writes
        tagged with the movement move it forward (see `MovementRef`); a close
        (`POST /v1/movements/{id}/close`, or `movement.close` on a write) ends
        it, and a terminal status is final.

    MovementStage:
      type: string
      enum: [authorize, capture, dispatch, complete, fail, correct]
      description: |
        The step of a movement a write belongs to (ADR-019). `authorize`,
        `capture` and `dispatch` are ordered: a write is accepted while the
        movement has not passed that stage, and moves its status to it
        (`authorized`, `captured`, `dispatched`). Several writes may share a
        stage (two partial captures) and stages may be skipped (a wallet to
        wallet transfer goes straight to `capture`). `complete` and `fail` tag
        the writes that pay out, book components or undo; they are accepted
        while the movement has not ended and do not change its status. `correct`
        is the one stage a closed movement accepts, and only while it holds a
        `transit_residual`: it books what brings the residual back to zero, and
        needs `movement.reason`. It is 409 `movement_stage_invalid` on a
        movement that has not ended and 409 `movement_closed` on one with no
        residual. Hold writes never take it. Which ledger object each stage
        creates is the template of the flow, not a rule the ledger imposes.

    MovementRef:
      type: object
      required: [id, stage]
      additionalProperties: false
      description: |
        The `movement` object of a tagged write: the movement it belongs to and
        the stage it is written in (ADR-019). The movement must exist in the
        tenant (404) and in the write's ledger (400). A movement that ended is
        409 `movement_closed`; a stage the movement has passed is 409
        `movement_stage_invalid`.

        `close` and `reason` are part of the request (and of its idempotency
        fingerprint), not stored on the write: `GET` returns only `id` and
        `stage`. Hold writes (create, capture, release) take neither, nor stage
        `correct` (400).
      properties:
        id:
          type: string
          format: uuid
          description: The movement (`POST /v1/movements`).
        stage:
          $ref: '#/components/schemas/MovementStage'
        close:
          type: string
          enum: [completed, failed, cancelled]
          description: |
            Close the movement with this outcome right after the write, in the
            same database transaction, exactly as `POST /v1/movements/{id}/close`
            would. Not with stage `correct`. On a posting group the close runs
            once, after the last member.
        reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: Required with stage `correct`, refused with any other. Written to the `movement.correct` audit row.

    CloseMovementRequest:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [completed, failed, cancelled]

    OpenMovementRequest:
      type: object
      required: [ledger_id, type]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
          description: The ledger of the movement. A movement never spans ledgers.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 240
          description: Required, here or in the `Idempotency-Key` header. A convention that works is `<reference>:open`.
        type:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          description: The tenant's own label for the kind of operation (`remittance`, `payroll_run`). Opaque to the ledger.
        reference:
          type: string
          maxLength: 255
          description: The tenant's id for the operation, such as an order id. Indexed, not unique.
        fx_quote_id:
          type: string
          format: uuid
          description: The quote the operation was priced with (an `FXQuote` of the tenant), if any.
        metadata:
          $ref: '#/components/schemas/Metadata'

    Movement:
      type: object
      required: [id, ledger_id, type, status, fx_quote_id, opened_at, last_stage_at, closed_at, transit_residual, metadata]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        type:
          type: string
        reference:
          type: string
          description: Absent when the movement was opened without one.
        status:
          $ref: '#/components/schemas/MovementStatus'
        fx_quote_id:
          type: [string, 'null']
          format: uuid
        opened_at:
          type: string
          format: date-time
          description: When the movement was opened. Its age is the time since.
        last_stage_at:
          type: string
          format: date-time
          description: When it last advanced; `opened_at` until it does.
        closed_at:
          type: [string, 'null']
          format: date-time
          description: Set when the movement reaches a terminal status.
        transit_residual:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Money'
          description: |
            The transit, per asset, the movement still held when it closed, and
            still holds after any `correct` writes since. `null` when there is
            none: a terminal movement with `transit_residual: null` has zero
            transit in every asset (I-14). Always `null` while the movement is
            open.
        metadata:
          $ref: '#/components/schemas/Metadata'

    LedgerTransfer:
      type: object
      required: [id, idempotency_key, source, target, created_at]
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Omitted when empty.
        description:
          type: string
          description: Omitted when empty.
        source:
          $ref: '#/components/schemas/TransferSide'
        target:
          $ref: '#/components/schemas/TransferSide'
        fx:
          oneOf:
            - $ref: '#/components/schemas/GroupFX'
            - type: 'null'
          description: The quote and conversion account the transfer cites; null when it cites none.
        created_at:
          type: string
          format: date-time

    TrialBalance:
      type: object
      required: [ledger_id, as_of, rows, totals]
      properties:
        ledger_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
          description: Present only for a period result (the `from` query parameter).
        as_of:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            required: [account_id, account_name, account_type, asset, debits, credits, net]
            properties:
              account_id:
                type: string
                format: uuid
              account_name:
                type: string
              account_type:
                $ref: '#/components/schemas/AccountType'
              asset:
                $ref: '#/components/schemas/AssetCode'
              debits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              credits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              net:
                type: string
                pattern: '^-?[0-9]{1,19}$'
                description: debits - credits, in minor units.
        totals:
          type: array
          items:
            type: object
            required: [asset, debits, credits, balanced]
            properties:
              asset:
                $ref: '#/components/schemas/AssetCode'
              debits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              credits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              balanced:
                type: boolean

    AssetBalance:
      type: object
      description: Per-asset balance signed by the account's normal balance side.
      required: [asset, exponent, amount]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
          description: Display exponent (decimal places) of the asset.
        amount:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Signed int64 minor units, string-encoded.

    StatementEntry:
      type: object
      required: [id, transaction_id, direction, amount, effective_at, running_balance]
      properties:
        id:
          type: string
          format: uuid
          description: Posting id.
        transaction_id:
          type: string
          format: uuid
        reference:
          type: string
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        effective_at:
          type: string
          format: date-time
        running_balance:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: >-
            Balance of the entry's asset after this entry, signed by the
            account's normal balance side.

    Statement:
      type: object
      required: [account, period, opening_balance, entries, closing_balance, next_cursor]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        opening_balance:
          type: array
          description: Balance per asset immediately before the period.
          items:
            $ref: '#/components/schemas/AssetBalance'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        closing_balance:
          type: array
          description: Balance per asset at the end of the period.
          items:
            $ref: '#/components/schemas/AssetBalance'
        next_cursor:
          type: [string, 'null']
          description: |
            Keyset cursor for the next page of entries; null when there are
            no more results (no extra empty page needed).

    ProviderPositions:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [provider, positions]
            properties:
              provider:
                type: string
                description: Counterparty name, lowercased.
              positions:
                type: array
                items:
                  type: object
                  required: [asset, exponent, net, direction, accounts]
                  properties:
                    asset:
                      $ref: '#/components/schemas/AssetCode'
                    exponent:
                      type: integer
                    net:
                      type: string
                      pattern: '^-?[0-9]{1,19}$'
                      description: Signed posted_debits - posted_credits across the provider's accounts.
                    direction:
                      type: string
                      enum: [they_owe_us, we_owe_them, flat]
                    accounts:
                      type: array
                      items:
                        type: string
                        format: uuid
        hint:
          type: string
          description: >-
            Present only when data is empty: explains the naming convention
            (assets:provider:<name>:...) or the metadata.provider override.

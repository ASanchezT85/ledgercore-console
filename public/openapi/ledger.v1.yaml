openapi: 3.1.0
info:
  title: LedgerCore Ledger API
  version: 1.0.0
  description: |
    Double-entry ledger API. All monetary amounts are integers in minor units,
    string-encoded to avoid int64 precision loss in JSON, together with an
    asset code. Every transaction must balance debits and credits per asset.

    Multi-tenancy: the tenant is derived from the JWT; resources are always
    scoped to the authenticated tenant.
  contact:
    name: LedgerCore Platform Team
    url: https://github.com/ASanchezT85/ledgercore
servers:
  - url: http://localhost:8081
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway; paths are routed unchanged)
security:
  - bearerAuth: []
tags:
  - name: Ledgers
    description: A ledger is an isolated chart of accounts within a tenant.
  - name: Accounts
    description: Accounts hold balances per asset and receive postings.
  - name: Transactions
    description: Balanced sets of postings. Lifecycle draft -> posted -> reversed.
  - name: Holds
    description: Two-phase authorizations that reserve funds before capture.
  - name: Periods
    description: Accounting periods of a ledger. Lifecycle open -> soft_closed -> hard_closed.
  - name: AdjustmentRequests
    description: |
      Maker-checker for adjustments. Lifecycle pending -> approved -> executed,
      or rejected / cancelled. Every adjustment (`adjusts_period_id`) is
      written by executing a request two other actors approved.
  - name: Reports
    description: Accounting reports.

paths:
  /v1/ledgers:
    post:
      operationId: createLedger
      tags: [Ledgers]
      summary: Create a ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCreate'
            examples:
              main:
                summary: Main USD ledger
                value:
                  name: main
                  description: Primary operating ledger
                  metadata:
                    region: us
      responses:
        '201':
          description: Ledger created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                main:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    description: Primary operating ledger
                    environment: sandbox
                    metadata:
                      region: us
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/MetadataRejected' }
    get:
      operationId: listLedgers
      tags: [Ledgers]
      summary: List ledgers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of ledgers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ledger'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
              examples:
                page:
                  value:
                    data:
                      - id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: main
                        description: Primary operating ledger
                        environment: sandbox
                        metadata: {}
                        created_at: '2026-07-24T12:00:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ledgers/{id}:
    get:
      operationId: getLedger
      tags: [Ledgers]
      summary: Get a ledger
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                main:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    description: Primary operating ledger
                    environment: sandbox
                    metadata: {}
                    created_at: '2026-07-24T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/metadata-policy:
    put:
      operationId: setLedgerMetadataPolicy
      tags: [Ledgers]
      summary: Set the ledger's metadata allowlist
      description: |
        Replaces the metadata keys the ledger accepts: `transaction_keys` on
        new transactions and holds, `account_keys` on new accounts. A list
        that is `null` or left out removes that allowlist (any key accepted);
        an empty list accepts no key. A key outside the list is rejected with
        422 `metadata_key_not_allowed`. Requires the `ledger:write` scope.

        Every ledger, with or without an allowlist, accepts only scalar
        values and rejects obvious personal data (see `Metadata`). The policy
        governs metadata written from then on; what is already stored is not
        re-judged. The change waits for the writes in flight on the ledger,
        and writes that commit after it are judged by it.

        Each change leaves an `audit_log` row (`ledger.metadata_policy.update`)
        with the previous and the new policy, in the same database
        transaction. Setting the policy the ledger already has is a no-op and
        audits nothing.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataPolicy'
            examples:
              ordersOnly:
                value:
                  transaction_keys: [order_id, channel]
                  account_keys: [customer_id]
              removeAllowlists:
                value: {}
      responses:
        '200':
          description: The ledger with its new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                ordersOnly:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    environment: sandbox
                    metadata: {}
                    metadata_policy:
                      transaction_keys: [channel, order_id]
                      account_keys: [customer_id]
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MetadataRejected' }

  /v1/ledgers/{id}/coverage:
    get:
      operationId: getLedgerCoverage
      tags: [Ledgers, Reports]
      summary: Customer-funds coverage per asset
      description: |
        Whether the funds that back customer money cover what is owed to
        customers, per asset of the ledger:

        - `customer_assets`: posted balance (debits - credits) of the
          ledger's `asset` accounts with `fund_class: customer` — the bank or
          safeguarding accounts that hold customer money.
        - `customer_liabilities`: posted balance (credits - debits) of its
          `liability` accounts with `fund_class: customer` — wallets and
          other balances owed to customers.
        - `covered` is `customer_assets >= customer_liabilities`;
          `shortfall` is what is missing, `"0"` when covered.

        Only posted balances count (drafts and holds do not), read from the
        running `account_balances`. Accounts of other types, and `own`
        accounts, never count. New `liability` accounts default to
        `customer` and every other type to `own`, so until the backing asset
        accounts are marked `customer` the report shows the full liability
        as shortfall. The top-level `covered` is true when every asset is.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: One row per asset with customer-class balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              examples:
                covered:
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    covered: false
                    data:
                      - asset: EUR
                        exponent: 2
                        customer_assets: '50000'
                        customer_liabilities: '42000'
                        covered: true
                        shortfall: '0'
                      - asset: USD
                        exponent: 2
                        customer_assets: '5000'
                        customer_liabilities: '9700'
                        covered: false
                        shortfall: '4700'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts:
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            examples:
              customerWallet:
                summary: Customer wallet account
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  name: customer:cust_42:wallet
                  type: liability
                  normal_balance: CREDIT
                  allow_negative: false
                  fund_class: customer
                  metadata:
                    customer_id: cust_42
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                customerWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: active
                    allow_negative: false
                    fund_class: customer
                    postable: true
                    metadata:
                      customer_id: cust_42
                    created_at: '2026-07-24T12:01:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            The name places the account under an existing account that already
            has postings (drafts included) or active holds
            (`parent_account_has_activity`). That account would become a
            non-postable parent and could never move those funds again; post
            to a new leaf instead (e.g. `assets:cash:main` beside
            `assets:cash:usd`, not under an active `assets:cash`). Or the
            metadata is rejected (`metadata_not_scalar`, `metadata_too_large`,
            `metadata_pii_detected`, `metadata_key_not_allowed`; see
            `MetadataRejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parentHasActivity:
                  value:
                    error:
                      code: parent_account_has_activity
                      message: 'domain: parent account already has postings or active holds: assets:cash cannot become a parent of assets:cash:usd'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List accounts
      parameters:
        - name: ledger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AccountType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of accounts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  next_cursor:
                    type: [string, 'null']
              examples:
                page:
                  value:
                    data:
                      - id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: customer:cust_42:wallet
                        type: liability
                        normal_balance: CREDIT
                        status: active
                        allow_negative: false
                        fund_class: customer
                        postable: true
                        metadata: {}
                        created_at: '2026-07-24T12:01:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                customerWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: active
                    allow_negative: false
                    fund_class: customer
                    postable: true
                    metadata: {}
                    created_at: '2026-07-24T12:01:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      tags: [Accounts]
      summary: Freeze, unfreeze or close an account, or change its overdraft policy or fund class
      description: |
        Changes the account's `status`, `allow_negative` and/or `fund_class`;
        send at least one. Fields left out keep their value. Requires the
        `ledger:write` scope. Every change also leaves an `audit_log` row
        (`account.update`) with the previous and the new values.

        - `active` <-> `frozen` move freely. A frozen account rejects every
          new transaction and hold (422 `account_inactive`); captures and
          releases of holds it already has still work.
        - `closed` is **final**: a closed account cannot be reopened, frozen
          or have its policy changed (409 `conflict`).
        - Only an **empty** account can be closed: zero posted balance, no
          active holds and no draft transactions pending in every asset it
          has touched. Otherwise 409 `conflict` — drain it, release or capture
          its holds and post its drafts first.
        - Lowering `allow_negative` to `false` on an account that is already
          below zero is accepted: it can be refilled but not taken lower.
        - Only a postable account can be changed. A parent (`postable:
          false`) receives no movements, so its status and policy would govern
          nothing: 422 `account_not_postable` — change its children instead.

        The change waits for the transactions and holds already in flight on
        the account and blocks new ones until it commits, so a freeze or close
        never lands between a movement's status check and its commit.

        Every change emits `ledger.account.updated` with the new and the
        previous values. A request that changes nothing returns the account
        as it is and emits nothing, so retries are safe without an
        idempotency key.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
            examples:
              freeze:
                value:
                  status: frozen
              close:
                value:
                  status: closed
              allowOverdraft:
                value:
                  allow_negative: true
              markCustomerFunds:
                summary: The bank account holds customer money (counts in coverage)
                value:
                  fund_class: customer
      responses:
        '200':
          description: The account after the change (or unchanged, if nothing differed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                frozenWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: frozen
                    allow_negative: false
                    fund_class: customer
                    postable: true
                    metadata: {}
                    created_at: '2026-07-24T12:01:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The account is closed (closed is final), or it is not empty and
            cannot be closed (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  value:
                    error:
                      code: conflict
                      message: 'domain: a closed account cannot be changed: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is closed'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                notEmpty:
                  value:
                    error:
                      code: conflict
                      message: 'domain: only an empty account can be closed: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e has a posted balance of 9700 USD'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: The account is a parent (`account_not_postable`); change its children instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parent:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 5d4c3b2a-1f0e-7d6c-8b5a-493827161504 (customer:cust_42) has child accounts; change them instead'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/accounts/{id}/balances:
    get:
      operationId: getAccountBalances
      tags: [Accounts]
      summary: Get account balances per asset
      description: |
        Returns one balance row per asset the account has ever touched.
        `pending` includes draft transactions and uncaptured holds;
        `available` = posted - active holds against the account.

        For a parent account (`postable: false`) the rows are the sum of its
        whole subtree — every account whose name starts with the parent's
        name followed by `:` — computed on read, never stored, and signed by
        the parent's `normal_balance`; `version` is the sum of the members'
        versions and `aggregate` is `true`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Balances per asset.
          content:
            application/json:
              schema:
                type: object
                required: [data, aggregate]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Balance'
                  aggregate:
                    type: boolean
                    description: True when the account is a parent and the rows sum its subtree.
              examples:
                afterDeposit:
                  summary: Customer wallet after the USD 100 deposit (97 credited)
                  value:
                    data:
                      - asset: USD
                        exponent: 2
                        posted: '9700'
                        pending: '0'
                        available: '9700'
                        held: '0'
                        posted_debits: '0'
                        posted_credits: '9700'
                        version: 1
                    aggregate: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts/{id}/entries:
    get:
      operationId: listAccountEntries
      tags: [Accounts]
      summary: List the postings that hit an account
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: asset
          in: query
          schema:
            $ref: '#/components/schemas/AssetCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entry'
                  next_cursor:
                    type: [string, 'null']
              examples:
                page:
                  value:
                    data:
                      - id: 4d3e9f1a-2b3c-7d5e-af61-8a9b0c1d2e3f
                        transaction_id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                        account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount:
                          asset: USD
                          amount: '9700'
                        created_at: '2026-07-24T12:05:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/transactions:
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create a transaction
      description: |
        Creates a balanced transaction. With `status=posted` (default) it is
        atomically validated and posted; with `status=draft` it can be posted
        later via `POST /v1/transactions/{id}/post`.

        `idempotency_key` is unique per tenant: retrying with the same key
        returns the original transaction instead of creating a duplicate
        (200 with the `X-Idempotent-Replay: true` response header). The key
        may be sent in the body or via the `Idempotency-Key` request header.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
            examples:
              usdDeposit:
                summary: USD 100 deposit — 97 to the customer, 3 platform fee
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: dep-2026-0001
                  description: Customer USD deposit
                  postings:
                    - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                      direction: DEBIT
                      amount: { asset: USD, amount: '10000' }
                    - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      direction: CREDIT
                      amount: { asset: USD, amount: '9700' }
                    - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                      direction: CREDIT
                      amount: { asset: USD, amount: '300' }
                  metadata:
                    channel: bank_transfer
      responses:
        '201':
          description: Transaction created (and posted unless status=draft was requested).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                usdDeposit:
                  value:
                    id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: dep-2026-0001
                    description: Customer USD deposit
                    status: posted
                    postings:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        direction: DEBIT
                        amount: { asset: USD, amount: '10000' }
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        direction: CREDIT
                        amount: { asset: USD, amount: '9700' }
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        direction: CREDIT
                        amount: { asset: USD, amount: '300' }
                    metadata:
                      channel: bank_transfer
                    reversed_by: null
                    reverses: null
                    effective_at: '2026-07-24T12:05:00Z'
                    created_at: '2026-07-24T12:05:00Z'
                    posted_at: '2026-07-24T12:05:00Z'
        '200':
          description: Idempotent replay — the transaction already existed for this idempotency key.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            The transaction does not balance per asset
            (`unbalanced_transaction`), would leave an account with
            `allow_negative: false` below zero available (`insufficient_funds`,
            checked only when the transaction is posted), touches a frozen
            or closed account (`account_inactive`), posts to a parent
            account — one with child accounts under its path
            (`account_not_postable`), is dated in a closed accounting
            period (`period_closed`; see `adjusts_period_id`), is an
            adjustment sent without an approved adjustment request
            (`approval_required`), or carries rejected metadata
            (`metadata_*`, see `MetadataRejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                metadataPII:
                  value:
                    error:
                      code: metadata_pii_detected
                      message: 'domain: metadata looks like personal data: the value of key "note" looks like an email address'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                unbalanced:
                  value:
                    error:
                      code: unbalanced_transaction
                      message: 'debits (10000 USD) do not equal credits (9700 USD)'
                insufficientFunds:
                  value:
                    error:
                      code: insufficient_funds
                      message: 'domain: available balance would go negative: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e would have available -300 USD'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                accountInactive:
                  value:
                    error:
                      code: account_inactive
                      message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                accountNotPostable:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 3c2d8e4f-1b3c-7d5e-8f61-7a9b1c2d3e4f (assets) has child accounts; post to one of them'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                periodClosed:
                  value:
                    error:
                      code: period_closed
                      message: 'domain: accounting period is closed: period 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d (2026-09) is soft_closed; only adjustments of it may be dated in it'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List transactions
      parameters:
        - name: ledger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of transactions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  next_cursor:
                    type: [string, 'null']
              examples:
                page:
                  value:
                    data: []
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Get a transaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                usdDeposit:
                  value:
                    id: 3c2d8e0f-1a2b-7c4d-9e5f-7a8b9c0d1e2f
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    idempotency_key: dep-2026-0001
                    description: Customer USD deposit
                    status: posted

                    error:
                      code: conflict
                      message: transaction is already reversed

  /v1/periods:
    post:
      operationId: createPeriod
      tags: [Periods]
      summary: Create an accounting period
      description: |
        Appends an `open` period `[starts_at, ends_at)` to a ledger. The
        periods of a ledger are contiguous: the first one may start anywhere,
        each next one must start exactly at the last one's `ends_at` (400
        `validation_failed` otherwise), so they never overlap or leave gaps.
        Dates outside every period are not governed, and a ledger without
        periods behaves as if periods did not exist. Requires `ledger:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCreate'
            examples:
              september:
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  name: '2026-09'
                  starts_at: '2026-09-01T00:00:00Z'
                  ends_at: '2026-10-01T00:00:00Z'
      responses:
        '201':
          description: The period, open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listPeriods
      tags: [Periods]
      summary: List a ledger's accounting periods
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of periods, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Period'
                  next_cursor:
                    type: [string, 'null']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/periods/{id}:
    patch:
      operationId: transitionPeriod
      tags: [Periods]
      summary: Close a period (soft or hard)
      description: |
        Moves the period forward: `open` -> `soft_closed` -> `hard_closed`
        (`soft_closed` may be skipped). Setting the current status again is a
        no-op. Going back, including reopening a hard close, is 409
        `conflict`. Each real transition writes a `period.transition` row to
        the audit log in the same database transaction. Requires
        `ledger:write`.

        - `soft_closed`: only adjustments of this period
          (`adjusts_period_id`) may be dated in it.
        - `hard_closed`: no transaction may be dated in it (422
          `period_closed`); correct it with an adjustment dated in an open
          period.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodUpdate'
            examples:
              hardClose:
                value:
                  status: hard_closed
      responses:
        '200':
          description: The period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The transition would move the period back (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/adjustment-requests:
    post:
      operationId: createAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Propose an adjustment (maker)
      description: |
        Records the complete proposed adjustment — postings, metadata,
        `effective_at`, `adjusts_period_id` — made by the calling identity (the
        maker), in status `pending`. It is judged now as a transaction would
        be (accounts, metadata allowlist, period rules) and again when it is
        executed. The server computes `request_hash` (SHA-256 of its canonical
        form, see docs/maker-checker.md); after that the content never
        changes. Two other identities must approve that hash before the
        request can be executed. Requires `ledger:write`.

        `idempotency_key` is unique per tenant: the same key and content
        replays the request (200 + `X-Idempotent-Replay: true`); the same key
        with other content is 409 `idempotency_conflict`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Alternative to the `idempotency_key` body field (the body field wins).
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequestCreate'
            examples:
              softClosedCorrection:
                summary: Book a missed USD 50 fee into the soft-closed September
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  idempotency_key: adj-2026-09-0001
                  description: Missed September fee
                  effective_at: '2026-09-30T23:00:00Z'
                  adjusts_period_id: 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d
                  postings:
                    - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      direction: DEBIT
                      amount: { asset: USD, amount: '5000' }
                    - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                      direction: CREDIT
                      amount: { asset: USD, amount: '5000' }
      responses:
        '201':
          description: The request, pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '200':
          description: Idempotent replay — the request already existed for this key and content.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            The proposal would be refused as a transaction: unbalanced,
            inactive or parent account, closed period (`period_closed`) or
            rejected metadata (`metadata_*`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listAdjustmentRequests
      tags: [AdjustmentRequests]
      summary: List a ledger's adjustment requests
      description: Newest first. `status=pending` lists what checkers have to review. Requires `ledger:read`.
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdjustmentStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of adjustment requests.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdjustmentRequest'
                  next_cursor:
                    type: [string, 'null']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/adjustment-requests/{id}:
    get:
      operationId: getAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Get an adjustment request
      description: The request with its approvals. Requires `ledger:read`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The adjustment request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/adjustment-requests/{id}/approve:
    post:
      operationId: approveAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Approve an adjustment request (checker)
      description: |
        Records the calling identity's approval of the `request_hash` it
        reviewed. The maker cannot approve (403 `self_approval`), an identity
        approves once (409 `conflict`), and the hash must be the request's
        (409 `request_hash_mismatch`). The second approval moves the request
        to `approved`. Only a `pending` request takes approvals. Audited.
        Requires `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_hash]
              additionalProperties: false
              properties:
                request_hash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: The `request_hash` the approver reviewed, hex-encoded.
      responses:
        '200':
          description: The request, with the new approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The maker cannot approve their own request (`self_approval`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The hash is not the request's (`request_hash_mismatch`), this
            identity already approved, or the request is not pending
            (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/adjustment-requests/{id}/reject:
    post:
      operationId: rejectAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Reject a pending adjustment request
      description: |
        `pending` -> `rejected`, final. Stopping a request moves no money, so
        any identity with `ledger:write` may do it; rejecting a rejected
        request is a no-op. Audited.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The request, rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/adjustment-requests/{id}/cancel:
    post:
      operationId: cancelAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Cancel a pending or approved adjustment request
      description: |
        `pending` or `approved` -> `cancelled`, final (e.g. the period was
        hard-closed after the approvals). Cancelling a cancelled request is a
        no-op. Audited. Requires `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The request, cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/adjustment-requests/{id}/execute:
    post:
      operationId: executeAdjustmentRequest
      tags: [AdjustmentRequests]
      summary: Execute an approved adjustment request
      description: |
        Writes the request's transaction, posted, through the normal path
        (period rules, metadata allowlist, overdraft, journal hash chain), with
        idempotency key `adjustment-request:<id>`, and links request and
        transaction (`transaction_id`). Exactly once: a repeated or concurrent
        execution returns the same transaction (200 +
        `X-Idempotent-Replay: true`). If the transaction is refused (e.g. the
        period was hard-closed meanwhile) the request stays `approved`.
        Audited. Requires `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: The adjustment transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '200':
          description: Already executed — the transaction written by the first execution.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The request is not approved (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': { $ref: '#/components/responses/MovementRejected' }

  /v1/holds:
    post:
      operationId: createHold
      tags: [Holds]
      summary: Create a hold
      description: |
        Reserves funds on an account (reducing `available` without moving
        money) until captured or released.

        `idempotency_key` is unique per tenant: retrying with the same key
        returns the original hold (200 + `X-Idempotent-Replay: true`).

        Note: automatic release of expired holds (sweeper) is not implemented
        yet (fase 1.5); `expires_at` is stored and enforced at capture time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldCreate'
            examples:
              cardAuth:
                summary: Authorize USD 25.00 on a customer wallet
                value:
                  ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                  account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                  idempotency_key: auth-2026-0042
                  amount: { asset: USD, amount: '2500' }
                  expires_at: '2026-07-31T00:00:00Z'
                  metadata:
                    card_auth_id: auth_9f3
      responses:
        '201':
          description: Hold created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              examples:
                cardAuth:
                  value:
                    id: 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    idempotency_key: auth-2026-0042
                    amount: { asset: USD, amount: '2500' }
                    status: active
                    transaction_id: null
                    expires_at: '2026-07-31T00:00:00Z'
                    metadata:
                      card_auth_id: auth_9f3
                    created_at: '2026-07-24T13:00:00Z'
        '200':
          description: Idempotent replay — the hold already existed for this idempotency key.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Insufficient available balance to place the hold
            (`insufficient_funds`), the account is frozen or closed
            (`account_inactive`), it is a parent account
            (`account_not_postable`), or the metadata is rejected
            (`metadata_*`, see `MetadataRejected`; holds follow the ledger's
            `transaction_keys`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient:
                  value:
                    error:
                      code: insufficient_funds
                      message: 'available balance 9700 USD is less than hold amount 2500000 USD'
                accountInactive:
                  value:
                    error:
                      code: account_inactive
                      message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                accountNotPostable:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 3c2d8e4f-1b3c-7d5e-8f61-7a9b1c2d3e4f (assets) has child accounts; post to one of them'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/holds/{id}:
    get:
      operationId: getHold
      tags: [Holds]
      summary: Get a hold
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/holds/{id}/capture:
    post:
      operationId: captureHold
      tags: [Holds]
      summary: Capture a hold
      description: |
        Finalizes the hold (fully or partially): the held funds are freed and
        the hold is marked captured, optionally linked to the posted
        transaction that moved the money. A partial capture releases the
        remainder. Capture does not create the transaction itself — post it
        via `POST /v1/transactions` and link it with `transaction_id`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount:
                  $ref: '#/components/schemas/Money'
                  description: Amount to capture; defaults to the full hold amount.
                transaction_id:
                  type: string
                  format: uuid
                  description: Posted transaction to link as the money movement of this capture.
            examples:
              partial:
                summary: Capture USD 20.00 of the USD 25.00 hold
                value:
                  amount: { asset: USD, amount: '2000' }
      responses:
        '200':
          description: Hold captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              examples:
                captured:
                  value:
                    id: 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    idempotency_key: auth-2026-0042
                    amount: { asset: USD, amount: '2500' }
                    status: captured
                    transaction_id: 9c8d4e6f-7a8b-7c9d-f4c6-3e4f5a6b7c8d
                    expires_at: '2026-07-31T00:00:00Z'
                    metadata: {}
                    created_at: '2026-07-24T13:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The hold is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notActive:
                  value:
                    error:
                      code: conflict
                      message: hold is already released

  /v1/holds/{id}/release:
    post:
      operationId: releaseHold
      tags: [Holds]
      summary: Release a hold
      description: Frees the reserved funds without moving money.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Hold released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              examples:
                released:
                  value:
                    id: 8b7c3d5e-6f7a-7b8c-e3b5-2d3e4f5a6b7c
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    idempotency_key: auth-2026-0042
                    amount: { asset: USD, amount: '2500' }
                    status: released
                    transaction_id: null
                    expires_at: '2026-07-31T00:00:00Z'
                    metadata: {}
                    created_at: '2026-07-24T13:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The hold is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notActive:
                  value:
                    error:
                      code: conflict
                      message: hold is already captured

  /v1/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [Reports]
      summary: Trial balance
      description: |
        Sums debits and credits per account and asset over posted
        transactions. For a healthy ledger, total debits equal total credits
        per asset.
      parameters:
        - name: ledger_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          description: |
            Compute the balance as of this instant: the report is
            reconstructed by aggregating postings of transactions with
            `effective_at <= as_of` (transactions later reversed still count
            at instants before their reversal's `effective_at`). Without it,
            the report reflects the current running balances.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The trial balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
              examples:
                afterDeposit:
                  summary: Trial balance after the USD 100 deposit
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    as_of: '2026-07-24T12:10:00Z'
                    rows:
                      - account_id: 5e4f0a2b-3c4d-7e6f-b072-9a0b1c2d3e4f
                        account_name: assets:cash
                        account_type: asset
                        asset: USD
                        debits: '10000'
                        credits: '0'
                        net: '10000'
                      - account_id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        account_name: customer:cust_42:wallet
                        account_type: liability
                        asset: USD
                        debits: '0'
                        credits: '9700'
                        net: '-9700'
                      - account_id: 6f5a1b3c-4d5e-7f80-c193-0b1c2d3e4f5a
                        account_name: revenue:fees
                        account_type: revenue
                        asset: USD
                        debits: '0'
                        credits: '300'
                        net: '-300'
                    totals:
                      - asset: USD
                        debits: '10000'
                        credits: '10000'
                        balanced: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/statements:
    get:
      operationId: getStatement
      tags: [Reports]
      summary: Account statement
      description: |
        Statement of one account over a period: opening balance per asset
        (aggregate of postings with `effective_at` strictly before `from`),
        entries ordered by `effective_at` ascending with a per-asset running
        balance, and the closing balance at `to`. Balances are signed by the
        account's normal balance side, so a funded credit-normal wallet shows
        positive numbers. Reversed transactions keep contributing (their
        compensating transaction appears as its own entry). Entries are
        keyset-paginated; opening/closing always cover the whole period
        regardless of the page.
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Period start (inclusive). Defaults to `to` minus 30 days.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Period end (inclusive). Defaults to now.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The account statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
              examples:
                walletStatement:
                  summary: Wallet statement with two deposits in the period
                  value:
                    account:
                      id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                      ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                      name: customer:cust_42:wallet
                      type: liability
                      normal_balance: CREDIT
                      status: active
                      allow_negative: false
                      fund_class: customer
                      postable: true
                      metadata: {}
                      created_at: '2026-05-01T09:00:00Z'
                    period:
                      from: '2026-06-01T00:00:00Z'
                      to: '2026-07-01T00:00:00Z'
                    opening_balance:
                      - asset: USD
                        exponent: 2
                        amount: '14550'
                    entries:
                      - id: 7c2d8e4f-1b3c-7d5e-af61-8a9b0c1d2e3f
                        transaction_id: 3c2d8e4f-1b3c-7d5e-af61-8a9b0c1d2e30
                        reference: dep-2001
                        direction: CREDIT
                        amount: { asset: USD, amount: '1940' }
                        effective_at: '2026-06-01T13:00:00Z'
                        running_balance: '16490'
                      - id: 8d3e9f50-2c4d-7e6f-b072-9b0c1d2e3f40
                        transaction_id: 4d3e9f50-2c4d-7e6f-b072-9b0c1d2e3f41
                        reference: dep-2002
                        direction: CREDIT
                        amount: { asset: USD, amount: '970' }
                        effective_at: '2026-06-01T14:00:00Z'
                        running_balance: '17460'
                    closing_balance:
                      - asset: USD
                        exponent: 2
                        amount: '17460'
                    next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/provider-positions:
    get:
      operationId: listProviderPositions
      tags: [Reports]
      summary: Provider (counterparty) positions
      description: |
        Net position against every counterparty (payment provider, bank,
        processor), aggregated from the running `account_balances` of asset-
        and liability-type accounts — never from postings.

        Convention: an account belongs to a provider when its name/path
        contains a `provider` segment followed by the provider name —
        `assets:provider:acmepay:usd` or `liabilities/provider/nordpay/mxn`
        (both `:` and `/` work as separators) — or when the account carries
        `metadata.provider` as an explicit override (it wins over the path).

        `net` is the signed sum of `posted_debits - posted_credits` across
        the provider's accounts per asset: positive means the counterparty
        holds value for us (`they_owe_us`), negative means we owe them
        (`we_owe_them`), zero is `flat`.

        Tenants that do not follow the convention get an empty `data` array
        plus a `hint` explaining how to opt in.
      responses:
        '200':
          description: One entry per provider with per-asset net positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPositions'
              examples:
                twoProviders:
                  summary: Positive position with AcmePay, payable to NordPay
                  value:
                    data:
                      - provider: nordpay
                        positions:
                          - asset: USD
                            exponent: 2
                            net: '-1200'
                            direction: we_owe_them
                            accounts: [9e4f0a61-3d5e-7f80-c193-0c1d2e3f4a51]
                      - provider: acmepay
                        positions:
                          - asset: MXN
                            exponent: 2
                            net: '30000'
                            direction: they_owe_us
                            accounts: [0f5a1b72-4e6f-7081-d2a4-1d2e3f4a5b62]
                          - asset: USD
                            exponent: 2
                            net: '5000'
                            direction: they_owe_us
                            accounts: [1a6b2c83-5f70-7192-e3b5-2e3f4a5b6c73]
                noConvention:
                  summary: Tenant without provider-named accounts
                  value:
                    data: []
                    hint: >-
                      no provider accounts found: name accounts as
                      assets:provider:<name>:... (or
                      liabilities:provider:<name>:...) or set
                      metadata.provider on the account
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA JWT issued by the identity service (POST /v1/auth/token).

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size; values above 200 are clamped to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor from a previous page's `next_cursor`. A
        malformed cursor yields 400 `invalid_cursor`.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid input (`validation_failed`) or malformed pagination cursor (`invalid_cursor`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                error:
                  code: validation_failed
                  message: 'unknown field "amonut"'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: token is invalid or expired
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    NotFound:
      description: The resource does not exist within this tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: resource not found
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    NotImplemented:
      description: Declared stub for a future milestone (`not_implemented`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stub:
              value:
                error:
                  code: not_implemented
                  message: GET /v1/statements is not implemented yet; it is planned for a future milestone
    MovementRejected:
      description: |
        Posting would leave an account with `allow_negative: false` below zero
        available (`insufficient_funds`), touches a frozen or closed account
        (`account_inactive`), or its `effective_at` falls in a closed
        accounting period (`period_closed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficientFunds:
              value:
                error:
                  code: insufficient_funds
                  message: 'domain: available balance would go negative: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e would have available -300 USD'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            accountInactive:
              value:
                error:
                  code: account_inactive
                  message: 'domain: account is not active: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is frozen'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            periodClosed:
              value:
                error:
                  code: period_closed
                  message: 'domain: accounting period is closed: period 0a1b2c3d-4e5f-7a8b-9c0d-1e2f3a4b5c6d (2026-09) is hard_closed'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    MetadataRejected:
      description: |
        The metadata is rejected. The message names the key (unless the key
        itself looks like personal data) and never the value.

        - `metadata_not_scalar`: a value is an object, an array or null.
        - `metadata_too_large`: more than 50 keys, a key of 0 or more than
          64 bytes, or a value of more than 500 bytes.
        - `metadata_pii_detected`: a key or value looks like an email, a card
          number, a phone number or an IBAN, in every ledger.
        - `metadata_key_not_allowed`: the key is outside the ledger's
          allowlist (`PUT /v1/ledgers/{id}/metadata-policy`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            keyNotAllowed:
              value:
                error:
                  code: metadata_key_not_allowed
                  message: 'domain: metadata key is not allowed in this ledger: key "channel"'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
            pii:
              value:
                error:
                  code: metadata_pii_detected
                  message: 'domain: metadata looks like personal data: the value of key "note" looks like a card number'
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
    Conflict:
      description: Uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                error:
                  code: conflict
                  message: a resource with that name already exists
                  request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable error code (snake_case). Catalog:
                validation_failed, invalid_cursor, unauthorized, forbidden,
                not_found, conflict, idempotency_conflict,
                unbalanced_transaction, insufficient_funds, account_inactive,
                account_not_postable, parent_account_has_activity,
                period_closed, approval_required, self_approval,
                request_hash_mismatch, metadata_not_scalar, metadata_too_large,
                metadata_pii_detected, metadata_key_not_allowed,
                rate_limited,
                service_unavailable, internal.
            message:
              type: string
              description: Human-readable explanation. Never parse this.
            request_id:
              type: string
              description: Correlation id of the request (also in X-Request-Id).

    AssetCode:
      type: string
      pattern: '^[A-Z0-9]{1,12}$'
      description: Asset code registered in the ledger asset registry (e.g. USD, BTC, USDC).
      examples: [USD]

    Money:
      type: object
      required: [asset, amount]
      additionalProperties: false
      description: |
        Integer amount in minor units, string-encoded so int64 values survive
        JSON round trips. The exponent lives in the asset registry.
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        amount:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: int64 in minor units, string-encoded (e.g. "10000" = USD 100.00).
      examples:
        - asset: USD
          amount: '10000'

    Direction:
      type: string
      enum: [DEBIT, CREDIT]

    TransactionStatus:
      type: string
      enum: [draft, posted, reversed]

    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]

    AccountStatus:
      type: string
      enum: [active, frozen, closed]
      description: |
        Only `active` accounts accept movements. A transaction (created,
        posted from draft or reversed) or a hold that touches a `frozen` or
        `closed` account fails with 422 `account_inactive`. Changed with
        `PATCH /v1/accounts/{id}`: `active` and `frozen` move freely into each
        other; `closed` is final and requires an empty account.

    HoldStatus:
      type: string
      enum: [active, captured, released, expired]

    Metadata:
      type: object
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 64
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
      description: |
        Flat key/value pairs attached by the tenant. Values must be scalars:
        strings, numbers or booleans (objects, arrays and null are 422
        `metadata_not_scalar`). Numbers and booleans are stored and returned
        as their JSON text (`10.50` -> `"10.50"`, `true` -> `"true"`), so
        responses always carry strings. Keys or values that look like an
        email, a card number (Luhn), a phone number (`+` and 8-15 digits) or
        an IBAN (mod 97) are rejected in every ledger (422
        `metadata_pii_detected`); a ledger's `metadata_policy` can restrict
        the keys too. See docs/metadata-y-cobertura.md.

    LedgerCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/Metadata'

    Ledger:
      type: object
      required: [id, name, environment, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        environment:
          type: string
          enum: [sandbox, live]
          description: Taken from the `env` claim of the creating token; not client-settable.
        metadata:
          $ref: '#/components/schemas/Metadata'
        metadata_policy:
          $ref: '#/components/schemas/MetadataPolicy'
        created_at:
          type: string
          format: date-time

    MetadataPolicy:
      type: object
      additionalProperties: false
      description: |
        The ledger's metadata allowlists. `null` (the default for every
        ledger): no allowlist, any key accepted. An empty list accepts no
        key. Keys come back sorted and without duplicates.
      properties:
        transaction_keys:
          type: [array, 'null']
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Keys accepted on new transactions and holds.
        account_keys:
          type: [array, 'null']
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Keys accepted on new accounts.

    FundClass:
      type: string
      enum: [customer, own]
      description: |
        Whose money the account holds: `customer` (held for or owed to
        customers) or `own` (the operator's money). Only `asset` and
        `liability` accounts enter the coverage report
        (`GET /v1/ledgers/{id}/coverage`). Defaults to `customer` for
        `liability` accounts and `own` for every other type; accounts that
        existed before this field got the same default.

    Coverage:
      type: object
      required: [ledger_id, covered, data]
      properties:
        ledger_id:
          type: string
          format: uuid
        covered:
          type: boolean
          description: True when every asset is covered.
        data:
          type: array
          items:
            type: object
            required: [asset, exponent, customer_assets, customer_liabilities, covered, shortfall]
            properties:
              asset:
                $ref: '#/components/schemas/AssetCode'
              exponent:
                type: integer
              customer_assets:
                type: string
                description: Posted debits - credits of the customer-class asset accounts, minor units.
              customer_liabilities:
                type: string
                description: Posted credits - debits of the customer-class liability accounts, minor units.
              covered:
                type: boolean
                description: customer_assets >= customer_liabilities.
              shortfall:
                type: string
                description: customer_liabilities - customer_assets when not covered, "0" otherwise.

    AccountCreate:
      type: object
      required: [ledger_id, name, type, normal_balance]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Unique within the ledger, and its place in the account tree: `:`
            separates levels, so `assets:cash:usd` is a child of `assets:cash`
            and of `assets` (other characters, such as `/`, are part of the
            name). Intermediate levels need not exist. An account with
            children is a non-postable parent; creating a child under an
            account that has postings or active holds fails with 422
            `parent_account_has_activity`.
        type:
          $ref: '#/components/schemas/AccountType'
        normal_balance:
          $ref: '#/components/schemas/Direction'
        allow_negative:
          type: boolean
          description: |
            Whether a posting may leave this account's available balance
            (posted net minus active holds, signed by `normal_balance`) below
            zero. When `false`, such a posting fails with 422
            `insufficient_funds`. Defaults to `false` for `liability` accounts
            (customer wallets: money the ledger owes) and `true` for every
            other type, which routinely carry contra balances. Accounts that
            existed before this field are `true`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        metadata:
          $ref: '#/components/schemas/Metadata'

    AccountUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Fields to change; at least one. Omitted fields keep their value.
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
        allow_negative:
          type: boolean
          description: Overdraft policy; see `AccountCreate.allow_negative`.
        fund_class:
          $ref: '#/components/schemas/FundClass'

    Account:
      type: object
      required: [id, ledger_id, name, type, normal_balance, status, allow_negative, fund_class, postable, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        normal_balance:
          $ref: '#/components/schemas/Direction'
        status:
          $ref: '#/components/schemas/AccountStatus'
        allow_negative:
          type: boolean
          description: Overdraft policy; see `AccountCreate.allow_negative`.
        fund_class:
          $ref: '#/components/schemas/FundClass'
        postable:
          type: boolean
          readOnly: true
          description: |
            False when other accounts live under this one's name (it is a
            parent). Derived on every read, never stored. A parent rejects
            transactions and holds with 422 `account_not_postable`; its
            balances are the sum of its subtree.
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time

    Balance:
      type: object
      required: [asset, exponent, posted, pending, available, held, posted_debits, posted_credits, version]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
          minimum: 0
          maximum: 18
          description: Decimal places of the asset (registry value), for display.
        posted:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Net posted balance in minor units, signed by normal_balance.
        pending:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        available:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        held:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Sum of active holds against the account, in minor units.
        posted_debits:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Gross posted debits, unsigned by normal_balance.
        posted_credits:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Gross posted credits, unsigned by normal_balance.
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency version of the balance row; increases with every posting.

    Posting:
      type: object
      required: [account_id, direction, amount]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server; present in responses only.
        account_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'

    Entry:
      type: object
      required: [id, transaction_id, account_id, direction, amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time

    TransactionCreate:
      type: object
      required: [ledger_id, postings]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Unique per tenant. Retries with the same key return the original
            transaction (200 + `X-Idempotent-Replay: true`). Required, but it
            may be supplied via the `Idempotency-Key` request header instead
            of this field; the body field wins when both are present.
        reference:
          type: string
          maxLength: 255
          description: Free-form external reference.
        description:
          type: string
          maxLength: 1024
        status:
          type: string
          enum: [draft, posted]
          default: posted
          description: Create as draft to post later, or post atomically (default).
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance per asset (sum of debits == sum of credits).
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        metadata:
          $ref: '#/components/schemas/Metadata'
        hold_id:
          type: string
          format: uuid
          description: |
            An active hold this payment settles (only with `status: posted`).
            In the same database transaction the hold is captured and linked
            (the hold's `transaction_id`), its reservation is released and only
            then is the overdraft policy checked — so the payment may spend
            the funds the hold set aside, and nobody else can in between. The
            transaction must lower the held account in the held asset; the
            captured amount is that decrease, capped at the hold, and any
            remainder is released. Emits `ledger.hold.captured`. A hold that is
            not active is 409 `conflict`. Part of the idempotency fingerprint.
        adjusts_period_id:
          type: string
          format: uuid
          description: |
            Makes this transaction an adjustment of that accounting period of
            the same ledger, which must be `soft_closed` or `hard_closed`; the
            adjustment cannot be dated before the period starts. A
            `soft_closed` period accepts only adjustments of itself; a
            `hard_closed` one accepts nothing, so it is corrected by an
            adjustment dated in an open period. Covered by the journal hash
            and part of the idempotency fingerprint. 404 when the period does
            not exist in the ledger; 400 `validation_failed` when it is open
            or starts after `effective_at`.

            An adjustment is only written by executing an approved adjustment
            request (`POST /v1/adjustment-requests`): sent here, a valid
            adjustment is refused with 422 `approval_required`.

    Transaction:
      type: object
      required: [id, ledger_id, idempotency_key, status, postings, metadata, reversed_by, reverses, effective_at, created_at, posted_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        reference:
          type: string
          description: Free-form external reference; omitted when empty.
        description:
          type: string
        status:
          $ref: '#/components/schemas/TransactionStatus'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        metadata:
          $ref: '#/components/schemas/Metadata'
        reversed_by:
          type: [string, 'null']
          format: uuid
          description: Id of the reversal transaction, when this one was reversed.
        reverses:
          type: [string, 'null']
          format: uuid
          description: Id of the original transaction, when this one is a reversal.
        adjusts_period_id:
          type: [string, 'null']
          format: uuid
          description: Id of the accounting period this transaction adjusts, when it is an adjustment.
        effective_at:
          type: string
          format: date-time
          description: Accounting effective date; defaults to creation time.
        created_at:
          type: string
          format: date-time
        posted_at:
          type: [string, 'null']
          format: date-time

    PeriodStatus:
      type: string
      enum: [open, soft_closed, hard_closed]

    PeriodCreate:
      type: object
      required: [ledger_id, name, starts_at, ends_at]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at:
          type: string
          format: date-time
          description: Inclusive start. Must equal the ledger's last period `ends_at`, if any.
        ends_at:
          type: string
          format: date-time
          description: Exclusive end; after `starts_at`.

    PeriodUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PeriodStatus'

    Period:
      type: object
      required: [id, ledger_id, name, starts_at, ends_at, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PeriodStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdjustmentStatus:
      type: string
      enum: [pending, approved, executed, rejected, cancelled]

    AdjustmentRequestCreate:
      type: object
      required: [ledger_id, effective_at, postings]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Required; may come in the `Idempotency-Key` header instead.
        reference:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        effective_at:
          type: string
          format: date-time
          description: Required — the date is part of what is approved.
        adjusts_period_id:
          type: string
          format: uuid
          description: |
            The closed period this adjustment corrects (same rules as on
            `TransactionCreate`). Optional: a request without it executes as a
            regular entry that still went through four eyes.
        postings:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Posting'
          description: Must balance per asset.
        metadata:
          $ref: '#/components/schemas/Metadata'

    AdjustmentApproval:
      type: object
      required: [approver, request_hash, approved_at]
      properties:
        approver:
          type: string
          description: Identity that approved (e.g. `api_key:<id>`).
        request_hash:
          type: string
          description: The hash approved, hex-encoded.
        approved_at:
          type: string
          format: date-time

    AdjustmentRequest:
      type: object
      required: [id, ledger_id, idempotency_key, status, request_hash, maker, effective_at, adjusts_period_id, metadata, postings, approvals, transaction_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        status:
          $ref: '#/components/schemas/AdjustmentStatus'
        request_hash:
          type: string
          description: SHA-256 of the canonical form of the request, hex-encoded. Approvers send it back to approve.
        maker:
          type: string
          description: Identity that created the request (e.g. `api_key:<id>`).
        reference:
          type: string
        description:
          type: string
        effective_at:
          type: string
          format: date-time
        adjusts_period_id:
          type: [string, 'null']
          format: uuid
        metadata:
          $ref: '#/components/schemas/Metadata'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/AdjustmentApproval'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: The transaction written by the execution, once `executed`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HoldCreate:
      type: object
      required: [account_id, idempotency_key, amount]
      additionalProperties: false
      properties:
        ledger_id:
          type: string
          format: uuid
          description: Optional; derived from the account when omitted.
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
          description: When the hold auto-releases; defaults to 7 days.
        metadata:
          $ref: '#/components/schemas/Metadata'

    Hold:
      type: object
      required: [id, ledger_id, account_id, idempotency_key, amount, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/HoldStatus'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: The transaction created on capture; null otherwise.
        expires_at:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time

    TrialBalance:
      type: object
      required: [ledger_id, as_of, rows, totals]
      properties:
        ledger_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            required: [account_id, account_name, account_type, asset, debits, credits, net]
            properties:
              account_id:
                type: string
                format: uuid
              account_name:
                type: string
              account_type:
                $ref: '#/components/schemas/AccountType'
              asset:
                $ref: '#/components/schemas/AssetCode'
              debits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              credits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              net:
                type: string
                pattern: '^-?[0-9]{1,19}$'
                description: debits - credits, in minor units.
        totals:
          type: array
          items:
            type: object
            required: [asset, debits, credits, balanced]
            properties:
              asset:
                $ref: '#/components/schemas/AssetCode'
              debits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              credits:
                type: string
                pattern: '^-?[0-9]{1,19}$'
              balanced:
                type: boolean

    AssetBalance:
      type: object
      description: Per-asset balance signed by the account's normal balance side.
      required: [asset, exponent, amount]
      properties:
        asset:
          $ref: '#/components/schemas/AssetCode'
        exponent:
          type: integer
          description: Display exponent (decimal places) of the asset.
        amount:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Signed int64 minor units, string-encoded.

    StatementEntry:
      type: object
      required: [id, transaction_id, direction, amount, effective_at, running_balance]
      properties:
        id:
          type: string
          format: uuid
          description: Posting id.
        transaction_id:
          type: string
          format: uuid
        reference:
          type: string
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        effective_at:
          type: string
          format: date-time
        running_balance:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: >-
            Balance of the entry's asset after this entry, signed by the
            account's normal balance side.

    Statement:
      type: object
      required: [account, period, opening_balance, entries, closing_balance, next_cursor]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        opening_balance:
          type: array
          description: Balance per asset immediately before the period.
          items:
            $ref: '#/components/schemas/AssetBalance'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        closing_balance:
          type: array
          description: Balance per asset at the end of the period.
          items:
            $ref: '#/components/schemas/AssetBalance'
        next_cursor:
          type: [string, 'null']
          description: |
            Keyset cursor for the next page of entries; null when there are
            no more results (no extra empty page needed).

    ProviderPositions:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [provider, positions]
            properties:
              provider:
                type: string
                description: Counterparty name, lowercased.
              positions:
                type: array
                items:
                  type: object
                  required: [asset, exponent, net, direction, accounts]
                  properties:
                    asset:
                      $ref: '#/components/schemas/AssetCode'
                    exponent:
                      type: integer
                    net:
                      type: string
                      pattern: '^-?[0-9]{1,19}$'
                      description: Signed posted_debits - posted_credits across the provider's accounts.
                    direction:
                      type: string
                      enum: [they_owe_us, we_owe_them, flat]
                    accounts:
                      type: array
                      items:
                        type: string
                        format: uuid
        hint:
          type: string
          description: >-
            Present only when data is empty: explains the naming convention
            (assets:provider:<name>:...) or the metadata.provider override.

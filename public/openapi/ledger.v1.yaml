openapi: 3.1.0
info:
  title: LedgerCore Ledger API
  version: 1.0.0
  description: |
    Double-entry ledger API. All monetary amounts are integers in minor units,
    string-encoded to avoid int64 precision loss in JSON, together with an
    asset code. Every transaction must balance debits and credits per asset.

    Multi-tenancy: the tenant is derived from the authenticated credential (a
    signed request, see `signedRequest`, or a console-user JWT); resources are always
    scoped to the authenticated tenant.
  contact:
    name: LedgerCore Platform Team
    url: https://github.com/ASanchezT85/ledgercore
servers:
  - url: http://localhost:8081
    description: Local development (direct)
  - url: http://localhost:8080
    description: Local development (via gateway; paths are routed unchanged)
security:
  - signedRequest: []
  - bearerAuth: []
tags:
  - name: Ledgers
    description: A ledger is an isolated chart of accounts within a tenant.
  - name: Audit
    description: |
      The tenant's audit trail of privileged actions, hash-chained and
      tamper-evident (roadmap 6.35).
  - name: Accounts
    description: Accounts hold balances per asset and receive postings.
  - name: Transactions
    description: Balanced sets of postings. Lifecycle draft -> posted -> reversed; a draft can instead be discarded.
  - name: Holds
    description: Two-phase authorizations that reserve funds before capture.
  - name: Periods
    description: Accounting periods of a ledger. Lifecycle open -> soft_closed -> hard_closed.
  - name: AdjustmentRequests
    description: |
      Maker-checker for adjustments. Lifecycle pending -> approved -> executed,
      or rejected / cancelled. Every adjustment (`adjusts_period_id`) is
      written by executing a request two other actors approved.
  - name: FXQuotes
    description: Immutable rates between two assets that posting groups cite.
  - name: PostingGroups
    description: |
      Several single-asset transactions written atomically, optionally priced
      by an FX quote (currency conversion).
  - name: PostingRules
    description: |
      Versioned, immutable mappings from a canonical event type to the lines of
      one transaction, and the events booked through them.
  - name: LedgerTransfers
    description: |
      A value transfer between two ledgers of one tenant, written as one
      transaction per ledger whose due-to / due-from accounts eliminate.
  - name: Movements
    description: |
      Staged movements (ADR-019): one operation of the tenant (a remittance, a
      payroll run...) from open to a terminal status. Open and read them here;
      tag the writes of the operation with `movement: {id, stage}` on
      `POST /v1/transactions`, `/v1/holds` (and their capture and release),
      `/v1/transactions/{id}/reverse`, `/v1/posting-events` and
      `/v1/posting-groups`. The close and its invariant come in a later step.
  - name: Reports
    description: Accounting reports.

paths:
  /v1/ledgers:
    post:
      operationId: createLedger
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
      tags: [Ledgers]
      summary: Create a ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCreate'
            examples:
              main:
                summary: Main USD ledger
                value:
                  name: main
                  description: Primary operating ledger
                  metadata:
                    region: us
      responses:
        '201':
          description: Ledger created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                main:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    description: Primary operating ledger
                    environment: sandbox
                    metadata:
                      region: us
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/MetadataRejected' }
    get:
      operationId: listLedgers
      tags: [Ledgers]
      summary: List ledgers
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of ledgers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ledger'
                  next_cursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
              examples:
                page:
                  value:
                    data:
                      - id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: main
                        description: Primary operating ledger
                        environment: sandbox
                        metadata: {}
                        created_at: '2026-07-24T12:00:00Z'
                    next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ledgers/{id}:
    get:
      operationId: getLedger
      tags: [Ledgers]
      summary: Get a ledger
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                main:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    description: Primary operating ledger
                    environment: sandbox
                    metadata: {}
                    created_at: '2026-07-24T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/metadata-policy:
    put:
      operationId: setLedgerMetadataPolicy
      tags: [Ledgers]
      summary: Set the ledger's metadata allowlist
      description: |
        Replaces the metadata keys the ledger accepts: `transaction_keys` on
        new transactions, holds and movements, `account_keys` on new accounts. A list
        that is `null` or left out removes that allowlist (any key accepted);
        an empty list accepts no key. A key outside the list is rejected with
        422 `metadata_key_not_allowed`. Requires the `ledger:write` scope.

        Every ledger, with or without an allowlist, accepts only scalar
        values and rejects obvious personal data (see `Metadata`). The policy
        governs metadata written from then on; what is already stored is not
        re-judged. The change waits for the writes in flight on the ledger,
        and writes that commit after it are judged by it.

        Each change leaves an `audit_log` row (`ledger.metadata_policy.update`)
        with the previous and the new policy, in the same database
        transaction. Setting the policy the ledger already has is a no-op and
        audits nothing.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataPolicy'
            examples:
              ordersOnly:
                value:
                  transaction_keys: [order_id, channel]
                  account_keys: [customer_id]
              removeAllowlists:
                value: {}
      responses:
        '200':
          description: The ledger with its new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
              examples:
                ordersOnly:
                  value:
                    id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: main
                    environment: sandbox
                    metadata: {}
                    metadata_policy:
                      transaction_keys: [channel, order_id]
                      account_keys: [customer_id]
                    created_at: '2026-07-24T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MetadataRejected' }

  /v1/ledgers/{id}/fx-policy:
    put:
      operationId: setLedgerFXPolicy
      tags: [Ledgers]
      summary: Require an FX quote for conversions
      description: |
        Turns the ledger's `require_fx_quote` on or off (off by default for
        every ledger). While it is on, a transaction that holds more than one
        asset is refused with 422 `fx_quote_required`, drafts included: a
        plain transaction carries no quote, so convert with a posting group
        (`POST /v1/posting-groups` with `fx`) or a transfer between ledgers
        that cites `fx`. A transfer between ledgers that moves more than one
        asset without `fx` is refused the same way when either of its two
        ledgers has the policy on. Reversals, and replays of what was
        accepted earlier, are never refused by it. Requires the `ledger:write`
        scope.

        The policy governs movements written from then on. The change waits
        for the writes in flight on the ledger, and writes that commit after
        it are judged by it. Each change leaves an `audit_log` row
        (`ledger.fx_policy.update`) with the previous and the new value;
        setting the value the ledger already has is a no-op and audits nothing.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FXPolicy'
            examples:
              on:
                value:
                  require_fx_quote: true
      responses:
        '200':
          description: The ledger with its new policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/custody-policy:
    put:
      operationId: setLedgerCustodyPolicy
      tags: [Ledgers]
      summary: Choose how a provider's loss is shared
      description: |
        Sets the ledger's `loss_allocation` ([ADR-020](https://github.com/ASanchezT85/ledgercore/blob/main/docs/adr/ADR-020-one-wallet-provider-exposure.md)
        §6), the rule that says whose money is lost when a provider fails:

        - `pro_rata_pool`: the loss is shared over every holder's balance, pro
          rata (safeguarded funds are one pool).
        - `by_provider`: the loss falls on the holders whose money sat at that
          provider.

        **There is no default.** A ledger that never set it returns
        `loss_allocation: null`, has only the provider level
        (`GET /v1/ledgers/{id}/provider-exposure`) and refuses the owner matrix
        with 409 `loss_allocation_not_configured`: a silent default would pick
        one side of a legal question for the tenant. Which rule applies to a
        licence and country must be confirmed with counsel; this is not legal
        advice. The field is required and cannot be unset.

        The change waits for the writes in flight on the ledger. Each change
        leaves an `audit_log` row (`ledger.custody_policy.update`) with the
        previous value (`null` the first time) and the new one; setting the
        rule the ledger already has is a no-op and audits nothing. Requires
        the `ledger:write` scope.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyPolicy'
            examples:
              pool:
                value:
                  loss_allocation: pro_rata_pool
      responses:
        '200':
          description: The ledger with its rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/provider-exposure:
    get:
      operationId: getLedgerProviderExposure
      tags: [Ledgers, Reports]
      summary: What each provider holds, and whether customer funds are backed
      description: |
        The provider level of [ADR-020](https://github.com/ASanchezT85/ledgercore/blob/main/docs/adr/ADR-020-one-wallet-provider-exposure.md)
        §2, per provider and asset. It needs no `loss_allocation`, so it always
        works. An account belongs to a provider when `metadata.provider` names
        it or its path has a `provider` segment followed by the name
        (`assets:provider:bank_x:custody`), as in `GET /v1/provider-positions`.

        - `custody`: posted balance (debits - credits) of the provider's
          `asset` accounts with `fund_class: customer` and `liquidity: liquid`:
          the customer money physically there. Summed over providers it is
          `customer_assets` of `GET /v1/ledgers/{id}/coverage`.
        - `claims`: the same with `liquidity: claim`. Reported apart; it never
          counts as backing.
        - `own`: posted balance of the provider's `own` asset accounts: the
          platform's own money there (receivables included).
        - `payable`: posted balance (credits - debits) of the provider's
          `liability` accounts: what the platform owes the provider.

        `breaks` lists where customer funds are not backed, and `backed` is
        `breaks` being empty:

        - `ledger_shortfall` (per asset): customer assets do not reach customer
          liabilities, the `shortfall` of `/coverage`.
        - `negative_custody` (per provider and asset): the provider's customer
          custody is below zero; a provider cannot hold negative money.

        Per-provider backing has no owner meaning in a pool, so under
        `pro_rata_pool` these are the whole check. Under `by_provider` the
        per-holder check (a holder's portion at a provider above its custody)
        needs the traced movements of ADR-019 and is not built yet. An account
        that names a provider is the provider's, never a holder's.

        **As of a date.** Like `/coverage`: with `as_of` the sums are rebuilt
        from the postings with `effective_at <= as_of`, using the `fund_class`
        and `liquidity` each account had then. `loss_allocation` is today's.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: as_of
          in: query
          required: false
          description: RFC 3339 instant; omit for the report as of now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One row per provider and asset, and the backing breaks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderExposure'
              examples:
                negativeCustody:
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    loss_allocation: pro_rata_pool
                    backed: false
                    breaks:
                      - { kind: ledger_shortfall, asset: USD, exponent: 2, amount: '700' }
                      - { kind: negative_custody, provider: bank_x, asset: USD, exponent: 2, amount: '100' }
                    data:
                      - { provider: bank_x, asset: USD, exponent: 2, custody: '-100', claims: '0', own: '0', payable: '0' }
                      - { provider: psp_z, asset: USD, exponent: 2, custody: '300', claims: '0', own: '0', payable: '0' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/exposure-matrix:
    get:
      operationId: getLedgerExposureMatrix
      tags: [Ledgers, Reports]
      summary: Provider × holder matrix under the ledger's loss rule
      description: |
        Whose money sits at which provider ([ADR-020](https://github.com/ASanchezT85/ledgercore/blob/main/docs/adr/ADR-020-one-wallet-provider-exposure.md)
        §2), computed on read under the ledger's `loss_allocation`, never
        stored. It replaces N × M calls to read one wallet per provider.

        - `pro_rata_pool`: holder h's exposure to provider P = `balance(h)` ×
          `custody(P)` / Σ customer custody, per asset. Only providers with
          positive customer custody weigh (a negative one is a `break` of
          `provider-exposure`; `claims` never weigh). The shares of a holder add
          up to its balance exactly (the cents go to the largest remainders).
        - `by_provider`: accepted as a rule, but its fold over the traced
          movements of ADR-019 is not built yet: 501 `not_available_yet`.
        - Not configured: 409 `loss_allocation_not_configured`. There is no
          default (`PUT /v1/ledgers/{id}/custody-policy`).

        A holder is the `holder` of `metadata`, or the path segment after
        `holder` (`liabilities:holder:ana:available`); its `balance` adds its
        `liability` accounts with `fund_class: customer` and a positive
        balance, `available`, `incoming` and the rest, in one asset. One in the
        red never lowers it, as in `/coverage`. `holder: ""` gathers customer
        liabilities that name no holder, so the rows add up to the
        liabilities of `/coverage` (less accounts that name a provider).
        `unplaced` is the part of a balance that no provider custody backs: all
        of it when the asset has no positive customer custody.

        The matrix is not paginated; every holder with a balance is returned.
        `as_of` works as in `GET /v1/ledgers/{id}/coverage`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: as_of
          in: query
          required: false
          description: RFC 3339 instant; omit for the matrix as of now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One row per holder and asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureMatrix'
              examples:
                pool:
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    loss_allocation: pro_rata_pool
                    data:
                      - holder: ana
                        asset: USD
                        exponent: 2
                        balance: '500'
                        shares:
                          - { provider: bank_x, amount: '333' }
                          - { provider: psp_z, amount: '167' }
                        unplaced: '0'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The ledger has no `loss_allocation` (`loss_allocation_not_configured`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notConfigured:
                  value:
                    error:
                      code: loss_allocation_not_configured
                      message: 'domain: loss_allocation is not configured for this ledger'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '501':
          description: The ledger's rule is `by_provider` and its matrix is not built yet (`not_available_yet`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                byProvider:
                  value:
                    error:
                      code: not_available_yet
                      message: 'domain: not available yet: the by_provider matrix needs the traced movements of ADR-019 (step 2)'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/ledgers/{id}/coverage:
    get:
      operationId: getLedgerCoverage
      tags: [Ledgers, Reports]
      summary: Customer-funds coverage per asset
      description: |
        Whether the funds that back customer money cover what is owed to
        customers, per asset of the ledger:

        - `customer_assets`: posted balance (debits - credits) of the
          ledger's `asset` accounts with `fund_class: customer` and
          `liquidity: liquid` — the bank or safeguarding accounts that hold
          customer money and can pay it out now.
        - `customer_claims`: posted balance of the `asset` accounts with
          `fund_class: customer` and `liquidity: claim` — money that may take
          years to collect (a receivable from a failed provider, say). Reported
          apart; it never counts as backing.
        - `customer_liabilities`: posted balance (credits - debits) of its
          `liability` accounts with `fund_class: customer` — wallets and
          other balances owed to customers. Only accounts with a positive
          balance add to it: a wallet in the red (`allow_negative`) never
          lowers what is owed to the others.
        - `customer_receivables`: the sum of the negative balances of those
          same accounts, as a positive number — what customers owe the
          platform. `negative_accounts` counts them. They are reported apart
          and never reduce `customer_liabilities` nor count as backing.
        - `covered` is `customer_assets >= customer_liabilities`;
          `shortfall` is what is missing, `"0"` when covered.

        Only posted balances count (drafts and holds do not). Accounts of
        other types, and `own` accounts, never count. New `liability` accounts default to
        `customer` and every other type to `own`, so until the backing asset
        accounts are marked `customer` the report shows the full liability
        as shortfall. The top-level `covered` is true when every asset is.

        **As of a date.** Without `as_of` the report is read from the running
        `account_balances`. With `as_of` it is rebuilt from the postings
        whose transaction has `effective_at <= as_of` (posted or later
        reversed, like `trial-balance?as_of=`) **using the `fund_class` and `liquidity` each
        account had at `as_of`**: reclassifying an account afterwards does
        not change the report for an earlier date. The class history comes
        from the audit log (`account.update`), so a change made straight in
        the database is not seen. A posting backdated into the period after
        the report was first asked does change it: freeze a date with
        `POST /v1/ledgers/{id}/coverage-snapshots`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: as_of
          in: query
          required: false
          description: RFC 3339 instant; omit for the report as of now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One row per asset with customer-class balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              examples:
                covered:
                  value:
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    covered: false
                    data:
                      - asset: EUR
                        exponent: 2
                        customer_assets: '50000'
                        customer_liabilities: '42000'
                        customer_claims: '0'
                        customer_receivables: '0'
                        negative_accounts: 0
                        covered: true
                        shortfall: '0'
                      - asset: USD
                        exponent: 2
                        customer_assets: '5000'
                        customer_claims: '4000'
                        customer_liabilities: '9700'
                        customer_receivables: '500'
                        negative_accounts: 1
                        covered: false
                        shortfall: '4700'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/coverage-snapshots:
    post:
      operationId: createCoverageSnapshot
      tags: [Ledgers, Reports]
      summary: Freeze the coverage report at a date
      description: |
        Stores the ledger's coverage report as of `as_of` (see
        `GET /v1/ledgers/{id}/coverage?as_of=`) as an immutable snapshot with
        a `snapshot_hash`: the SHA-256, in hex, of its canonical JSON
        (`ledgercore.coverage.v2`: format, ledger, `as_of` in UTC and the
        per-asset sums, `customer_claims` included, rows sorted by asset). Snapshots are append-only (the
        database rejects UPDATE and DELETE), so the report a regulator
        received for a month-end stays exactly that. Taking the same `as_of`
        again adds another snapshot, with the same hash unless history
        changed meanwhile. `as_of` is required and may not be in the future
        (400 `validation_failed`). The daily `anchor-heads` also publishes
        the id and hash of each ledger's latest snapshot. Requires
        `ledger:write`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageSnapshotCreate'
            examples:
              month_end:
                value:
                  as_of: '2026-09-30T23:59:59Z'
      responses:
        '201':
          description: The snapshot.
          content:
            application/json:
              schema:

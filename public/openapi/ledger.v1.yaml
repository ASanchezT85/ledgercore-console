  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                customerWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: active
                    allow_negative: false
                    fund_class: customer
                    transit: false
                    postable: true
                    metadata: {}
                    created_at: '2026-07-24T12:01:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      tags: [Accounts]
      summary: Freeze, unfreeze or close an account, or change its overdraft policy, fund class or liquidity
      description: |
        Changes the account's `status`, `allow_negative`, `fund_class` and/or
        `liquidity` (a `claim` is for assets only, 400 otherwise); send at least
        one. Fields left out keep their value. Requires the
        `ledger:write` scope. Every change also leaves an `audit_log` row
        (`account.update`) with the previous and the new values.

        - `active` <-> `frozen` move freely. A frozen account rejects every
          new transaction and hold (422 `account_inactive`); captures and
          releases of holds it already has still work.
        - `closed` is **final**: a closed account cannot be reopened, frozen
          or have its policy changed (409 `conflict`).
        - Only an **empty** account can be closed: zero posted balance, no
          active holds and no draft transactions pending in every asset it
          has touched. Otherwise 409 `conflict` — drain it, release or capture
          its holds and post or discard its drafts first.
        - Lowering `allow_negative` to `false` on an account that is already
          below zero is accepted: it can be refilled but not taken lower.
        - Only a postable account can be changed. A parent (`postable:
          false`) receives no movements, so its status and policy would govern
          nothing: 422 `account_not_postable` — change its children instead,
          or freeze the whole subtree at once with
          `POST /v1/accounts/{id}/freeze`.
        - A `frozen` status set here is a freeze of mode `all` with no reason;
          to freeze only the debits or the credits, or to record a reason and a
          case reference, use `POST /v1/accounts/{id}/freeze`.

        The change waits for the transactions and holds already in flight on
        the account and blocks new ones until it commits, so a freeze or close
        never lands between a movement's status check and its commit.

        Every change emits `ledger.account.updated` with the new and the
        previous values. A request that changes nothing returns the account
        as it is and emits nothing, so retries are safe without an
        idempotency key.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
            examples:
              freeze:
                value:
                  status: frozen
              close:
                value:
                  status: closed
              allowOverdraft:
                value:
                  allow_negative: true
              markCustomerFunds:
                summary: The bank account holds customer money (counts in coverage)
                value:
                  fund_class: customer
      responses:
        '200':
          description: The account after the change (or unchanged, if nothing differed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                frozenWallet:
                  value:
                    id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                    ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                    name: customer:cust_42:wallet
                    type: liability
                    normal_balance: CREDIT
                    status: frozen
                    allow_negative: false
                    fund_class: customer
                    transit: false
                    postable: true
                    metadata: {}
                    created_at: '2026-07-24T12:01:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The account is closed (closed is final), or it is not empty and
            cannot be closed (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  value:
                    error:
                      code: conflict
                      message: 'domain: a closed account cannot be changed: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e is closed'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
                notEmpty:
                  value:
                    error:
                      code: conflict
                      message: 'domain: only an empty account can be closed: account 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e has a posted balance of 9700 USD'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9
        '422':
          description: The account is a parent (`account_not_postable`); change its children instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parent:
                  value:
                    error:
                      code: account_not_postable
                      message: 'domain: account has child accounts and cannot receive postings: account 5d4c3b2a-1f0e-7d6c-8b5a-493827161504 (customer:cust_42) has child accounts; change them instead'
                      request_id: 9f1b2c3d4e5f60718293a4b5c6d7e8f9

  /v1/accounts/{id}/freeze:
    post:
      operationId: freezeAccount
      tags: [Accounts]
      summary: Freeze an account and everything under it
      description: |
        Freezes the account **and every account under its path** in one database
        transaction, so no movement commits between the first leaf and the last
        and none commits on any leaf once the call returns. It works on a parent
        (`postable: false`), which `PATCH /v1/accounts/{id}` refuses: call it on
        a holder's parent account to freeze the holder's whole subtree (ADR-020).
        Requires the `ledger:write` scope.

        `mode` says which postings a frozen account still refuses, read against
        the **direction of each posting**: `all` (the default) refuses every
        posting; `debits` refuses DEBIT postings and accepts CREDIT ones (on a
        wallet: the money going out is blocked, a deposit still lands);
        `credits` is the opposite. Holds reserve money a later debit spends on a
        credit-normal account, so they follow `debits` there. A refused posting
        fails with 422 `account_inactive`. `frozen_override` still relaxes a
        freeze of any mode.

        `reason` is required (1 to 1024 characters) and `case_ref` is optional
        (up to 128 characters, e.g. a compliance case number). Both are stored
        on every account that changes, written to the audit log
        (`account.freeze`, one row per account that changed) and sent in
        `ledger.account.updated`.

        Closed accounts are skipped. An account already frozen with the same
        mode, reason and case reference is left as it is, so a retry changes
        nothing and emits nothing; with another mode or reason, it replaces
        them. The response lists every account of the subtree after the change.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountFreeze'
            examples:
              holder:
                summary: Block the money going out of a holder, keep deposits
                value:
                  mode: debits
                  reason: Court order 2026-1187
                  case_ref: CASE-7
              everything:
                value:
                  reason: Suspected account takeover
      responses:
        '200':
          description: The subtree after the freeze (in no particular order).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSubtree'
              examples:
                holder:
                  value:
                    data:
                      - id: 5d4c3b2a-1f0e-7d6c-8b5a-493827161504
                        ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: customer:cust_42
                        type: liability
                        normal_balance: CREDIT
                        status: frozen
                        allow_negative: false
                        fund_class: customer
                        liquidity: liquid
                        transit: false
                        postable: false
                        metadata: {}
                        created_at: '2026-07-24T12:00:00Z'
                        freeze_mode: debits
                        freeze_reason: Court order 2026-1187
                        freeze_case_ref: CASE-7
                      - id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: customer:cust_42:wallet
                        type: liability
                        normal_balance: CREDIT
                        status: frozen
                        allow_negative: false
                        fund_class: customer
                        liquidity: liquid
                        transit: false
                        postable: true
                        metadata: {}
                        created_at: '2026-07-24T12:01:00Z'
                        freeze_mode: debits
                        freeze_reason: Court order 2026-1187
                        freeze_case_ref: CASE-7
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts/{id}/unfreeze:
    post:
      operationId: unfreezeAccount
      tags: [Accounts]
      summary: Unfreeze an account and everything under it
      description: |
        Returns every frozen account of the subtree (the account and everything
        under its path) to `active`, whatever its mode, in one database
        transaction. Requires the `ledger:write` scope. Accounts that are active
        or closed are left as they are, so a retry changes nothing and emits
        nothing.

        `reason` is required (1 to 1024 characters) and `case_ref` is optional
        (up to 128 characters). They are written to the audit log
        (`account.unfreeze`, one row per account that changed) and sent in
        `ledger.account.updated`; the accounts themselves keep no freeze state
        once active. The response lists every account of the subtree after the
        change.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUnfreeze'
            examples:
              cleared:
                value:
                  reason: Cleared by compliance
                  case_ref: CASE-7
      responses:
        '200':
          description: The subtree after the unfreeze (in no particular order).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSubtree'
              examples:
                holder:
                  value:
                    data:
                      - id: 5d4c3b2a-1f0e-7d6c-8b5a-493827161504
                        ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: customer:cust_42
                        type: liability
                        normal_balance: CREDIT
                        status: active
                        allow_negative: false
                        fund_class: customer
                        liquidity: liquid
                        transit: false
                        postable: false
                        metadata: {}
                        created_at: '2026-07-24T12:00:00Z'
                      - id: 2b1c7d3f-0a2b-7c4d-9e50-6f8a0b1c2d3e
                        ledger_id: 1f0a6a2e-9c1b-7f2e-8a11-3c5d7e9f0b21
                        name: customer:cust_42:wallet
                        type: liability
                        normal_balance: CREDIT
                        status: active
                        allow_negative: false
                        fund_class: customer
                        liquidity: liquid
                        transit: false
                        postable: true
                        metadata: {}
                        created_at: '2026-07-24T12:01:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/providers/{provider}/freeze:
    post:
      operationId: freezeProvider
      tags: [Ledgers, Accounts]
      summary: Freeze every account of a provider
      description: |
        Freezes the custody, receivable and payable accounts of provider `P` in
        one database transaction, with the locks, modes, audit and events of
        `POST /v1/accounts/{id}/freeze`: nothing captures, dispatches or settles
        through `P` once the call returns, and no movement commits between the
        first account and the last. Requires the `ledger:write` scope.

        An account belongs to `P` when `metadata.provider` is `P` or its path
        has the segment `provider` followed by `P` (the rule of
        `GET /v1/provider-positions`; names compare in lower case). Only `asset`
        and `liability` accounts are frozen: expense accounts of `P` (fees, loss
        write-downs) stay open for bookkeeping. Parents of those accounts are
        frozen too, as in the account freeze.

        **Holders' wallets stay active.** Their money is a claim on the
        operator, not on `P`; they keep spending, paying and receiving. Which
        holders carry the loss is a separate decision, set by the ledger's
        loss-allocation rule: under `pro_rata_pool` nothing else moves when a
        provider is frozen and a loss is shared pro rata when it is recognized.

        `mode` (`all` by default, `debits`, `credits`), `reason` (required, 1 to
        1024 characters) and `case_ref` (optional, up to 128) are the same as on
        the account freeze. A provider with no account in the ledger is 404.
        The response lists every account of `P` after the change.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: provider
          in: path
          required: true
          description: Provider name as in `metadata.provider` or the `provider` path segment (case-insensitive).
          schema:
            type: string
            example: psp_z
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountFreeze'
            examples:
              failure:
                value:
                  mode: all
                  reason: PSP Z insolvency proceedings
                  case_ref: CASE-12
      responses:
        '200':
          description: The provider's accounts after the change (in no particular order).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSubtree'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/ledgers/{id}/providers/{provider}/holds:
    post:
      operationId: createProviderHold
      tags: [Ledgers, Holds]
      summary: Reserve a provider's liquidity for a dispatch
      description: |
        Creates a hold on `custody(P)`, the provider's custody account, so a
        payout or dispatch reserves the provider's liquidity in the same
        transaction as the stage that names it (ADR-020 section 3). It is
        `POST /v1/holds` with the account chosen by the ledger: the hold, its
        idempotency, expiry, events and `movement` tag are the same. Requires
        the `ledger:write` scope.

        Choosing `P` (preferred provider, cheapest, largest balance) stays in
        the tenant's router; the ledger only checks that `P` can pay. The hold
        is refused with 422 `insufficient_funds` when `P`'s available custody
        (posted minus active holds) is below the amount, whatever the account's
        `allow_negative`, and with 422 `account_inactive` while `P` is frozen
        (`POST /v1/ledgers/{id}/providers/{provider}/freeze`). Concurrent
        dispatches serialize on the custody balance row: they never reserve
        more than `P` holds.

        `custody(P)` is the one leaf `asset` account of the ledger that
        identifies `P` (`metadata.provider`, or the `provider` path segment;
        names compare in lower case), with `fund_class: customer` and
        `liquidity: liquid`: the accounts `GET /v1/ledgers/{id}/provider-exposure`
        counts as custody. A provider with none is 404; one with several is 409,
        and the client names the account with `POST /v1/holds`. Send neither
        `account_id` nor `ledger_id`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: provider
          in: path
          required: true
          description: Provider name as in `metadata.provider` or the `provider` path segment (case-insensitive).
          schema:
            type: string
            example: bank_x
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderHoldCreate'
            examples:
              payout:
                value:
                  idempotency_key: dispatch-2026-0042
                  amount: { asset: USD, amount: '40000' }
                  movement: { id: 3f6c1c52-0a7e-7b1d-9d34-5a8e2b7c9d10, stage: dispatch }
      responses:
        '201':
          description: Hold created on the provider's custody account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '200':
          description: Idempotent replay — the hold already existed for this idempotency key.
          headers:
            X-Idempotent-Replay:
              description: Always "true" on a replayed response.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The provider has more than one custody account (`conflict`); the
            idempotency key was used with another payload
            (`idempotency_conflict`); or the movement is past the stage
            (`movement_stage_invalid`) or has ended (`movement_closed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The provider's available custody is below the amount
            (`insufficient_funds`), or its custody is frozen or closed
            (`account_inactive`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ledgers/{id}/providers/{provider}/unfreeze:
    post:
      operationId: unfreezeProvider
      tags: [Ledgers, Accounts]
      summary: Unfreeze every account of a provider
      description: |
        Returns every frozen account of provider `P` in the ledger (same
        selection as `POST /v1/ledgers/{id}/providers/{provider}/freeze`) to
        `active`, whatever its mode, in one database transaction. Requires the
        `ledger:write` scope. Accounts that are active or closed are left as
        they are, so a retry changes nothing and emits nothing. `reason` is
        required and `case_ref` optional; they go to the audit log
        (`account.unfreeze`) and `ledger.account.updated`. A provider with no
        account in the ledger is 404.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
        - name: provider
          in: path
          required: true
          description: Provider name as in `metadata.provider` or the `provider` path segment (case-insensitive).
          schema:
            type: string
            example: psp_z
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUnfreeze'
            examples:
              cleared:
                value:
                  reason: Provider reinstated
                  case_ref: CASE-12
      responses:
        '200':
          description: The provider's accounts after the change (in no particular order).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSubtree'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts/{id}/balances:
    get:
      operationId: getAccountBalances
      tags: [Accounts]
      summary: Get account balances per asset
      description: |
        Returns one balance row per asset the account has ever touched.
        `pending` includes draft transactions and uncaptured holds;
        `available` = posted - active holds against the account.

        For a parent account (`postable: false`) the rows are the sum of its
        whole subtree — every account whose name starts with the parent's
        name followed by `:` — computed on read, never stored, and signed by
        the parent's `normal_balance`; `version` is the sum of the members'
        versions and `aggregate` is `true`.
      parameters:
        - $ref: '#/components/parameters/SignatureApiKey'
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Balances per asset.
          content:
            application/json:
              schema:
                type: object
                required: [data, aggregate]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Balance'
                  aggregate:
                    type: boolean
                    description: True when the account is a parent and the rows sum its subtree.
              examples:
                afterDeposit:
                  summary: Customer wallet after the USD 100 deposit (97 credited)
                  value:
                    data:
                      - asset: USD
                        exponent: 2
                        posted: '9700'
                        pending: '0'
                        available: '9700'
                        held: '0'
                        posted_debits: '0'
                        posted_credits: '9700'
                        version: 1
                    aggregate: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/accounts/{id}/entries:
    get:
      operationId: listAccountEntries
